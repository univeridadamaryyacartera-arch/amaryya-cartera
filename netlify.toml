# Netlify · Universidad AmarYYa
# Sitio estático: no requiere compilación. Se publica la carpeta raíz.
[build]
  publish = "."

# Siempre entrega la versión más reciente de la app (sin caché vieja)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
