<!DOCTYPE html>
<!-- AmarYYa v4.18 · Modo GitHub: publicada en Netlify, los datos se guardan en un repositorio privado de GitHub (amaryya-datos) y todo el equipo ve lo mismo · antes v4.17 · Estado de cuenta por estudiante · Pagos nuevos: el Apoyo Closer y su % de comisión se toman automáticamente del primer pago del estudiante, igual que el % del closer · antes v4.16 · Procesos terapéuticos generan bolsillo (sesiones del programa × 50 USD, proporcional al pago) + Sesiones: todos los terapeutas ven todas las sesiones personalizadas (solo editan las suyas pendientes) + si falla el guardado o la eliminación, la pantalla vuelve al dato real al instante + editar una sesión sin subir su valor no vuelve a pedir la casilla de exceso de bolsillo · antes v4.15 · Sesiones: conexión con la base más robusta al cargar + aviso cuando la copia no está conectada a la base compartida · antes v4.14 · Panel gerencial: una sola torta con selector de 7 indicadores (gráfica, tabla y detalle) + totales de control en Sesiones personalizadas · antes v4.13 · Lectura de comprobantes: al registrar un pago se sube la imagen y se detectan valor, moneda, fecha y plataforma · antes v4.12 · Eliminación en cascada de estudiantes (pagos y sesiones) + fuente Roboto en todos los paneles · antes v4.11 · Detalle emergente al pasar el cursor por las alertas · antes v4.10 · Barra lateral en amarillo #fec70b · antes v4.9 · Datos base embebidos: exportación 2026-11-05 (65 estudiantes, 69 pagos) cargada en el HTML · 2026-11-05 -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Universidad AmarYYa · Cartera & Comisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#2B2118; --ink-soft:#6b5f4e; --ink-faint:#9c9080;
  --paper:#F6EFDD; --paper-alt:#FFFDF8; --paper-deep:#EFE4C8;
  --gold:#C9962C; --gold-deep:#A97A1E; --gold-pale:#F1DFAF;
  --indigo:#231C3D; --indigo-soft:#332A54; --indigo-pale:#4b3f73;
  --clay:#B5652E; --clay-pale:#f0ded0;
  --green:#3f6b4a; --green-pale:#dcead9;
  --red:#a13d3d; --red-pale:#f4dcdc;
  --border:#e3d5b5; --border-soft:#ece1c8;
  --radius:12px; --radius-sm:8px;
  --shadow:0 4px 18px rgba(35,28,61,0.10);
  --shadow-sm:0 2px 8px rgba(35,28,61,0.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE6D6; --ink-soft:#c9bfa9; --ink-faint:#8d836f;
    --paper:#1C1730; --paper-alt:#241d3c; --paper-deep:#2c2449;
    --gold:#D9A93D; --gold-deep:#E6BE5F; --gold-pale:#4a3d1f;
    --indigo:#F0E9D6; --indigo-soft:#cfc4e8; --indigo-pale:#8b7fc2;
    --clay:#d98a57; --clay-pale:#3a2a22;
    --green:#7fb68d; --green-pale:#1f332a;
    --red:#e08a8a; --red-pale:#3a2323;
    --border:#3a3156; --border-soft:#2e2748;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE6D6; --ink-soft:#c9bfa9; --ink-faint:#8d836f;
  --paper:#1C1730; --paper-alt:#241d3c; --paper-deep:#2c2449;
  --gold:#D9A93D; --gold-deep:#E6BE5F; --gold-pale:#4a3d1f;
  --indigo:#F0E9D6; --indigo-soft:#cfc4e8; --indigo-pale:#8b7fc2;
  --clay:#d98a57; --clay-pale:#3a2a22;
  --green:#7fb68d; --green-pale:#1f332a;
  --red:#e08a8a; --red-pale:#3a2323;
  --border:#3a3156; --border-soft:#2e2748;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Roboto',sans-serif; background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Roboto',sans-serif; font-weight:600; margin:0; color:var(--indigo);}
::selection{background:var(--gold-pale);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
.num{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- App shell ---------- */
#app{display:flex; height:100%;}
.sidebar{
  width:236px; flex:0 0 236px; background:#fec70b;
  color:#231C3D; display:flex; flex-direction:column; position:sticky; top:0; height:100%; overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.brand{padding:22px 20px 14px; position:relative; border-bottom:1px solid rgba(35,28,61,0.18);}
.brand .zodiac{
  position:absolute; right:-30px; top:-30px; width:140px; height:140px; opacity:0.18;
  border:1px solid #231C3D; border-radius:50%;
}
.brand .zodiac::before,.brand .zodiac::after{
  content:""; position:absolute; inset:18px; border:1px solid #231C3D; border-radius:50%;
}
.brand h1{color:#231C3D; font-size:22px; letter-spacing:0.3px; line-height:1.15; position:relative; z-index:1;}
.brand span.sub{display:block; font-size:10.5px; letter-spacing:2px; color:#231C3D; text-transform:uppercase; margin-top:5px; font-weight:600;}
.nav{flex:1; padding:14px 10px;}
.nav .grp-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1.6px; color:#5a4a1a; margin:16px 12px 6px;}
.nav button{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none;
  color:#231C3D; padding:9px 12px; border-radius:8px; font-size:13.5px; font-weight:500; margin-bottom:2px;
  transition:background .15s, color .15s;
}
.nav button:hover{background:rgba(35,28,61,0.10); color:#231C3D;}
.nav button.active{background:#231C3D; color:#fec70b; font-weight:700;}
.nav button .ic{width:18px; text-align:center; font-size:14px;}
.nav button .lock{margin-left:auto; opacity:.65; font-size:11px;}
.sidebar-foot{padding:14px 18px 18px; font-size:11px; color:#5a4a1a; border-top:1px solid rgba(35,28,61,0.15);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:16px 30px; background:var(--paper-alt); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
}
.topbar .crumbs{font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
.topbar h2{font-size:26px; margin-top:2px;}
.topbar .actions{display:flex; gap:10px;}
.content{padding:26px 30px 60px; flex:1;}

/* ---------- Buttons ---------- */
.btn{
  border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent;
  display:inline-flex; align-items:center; gap:7px; transition:transform .06s, box-shadow .15s, background .15s;
}
.btn:active{transform:translateY(1px);}
.btn-gold{background:var(--gold); color:var(--indigo); box-shadow:var(--shadow-sm);}
.btn-gold:hover{background:var(--gold-deep);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--gold-deep); color:var(--gold-deep);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid transparent; padding:7px 10px;}
.btn-ghost:hover{background:var(--paper-deep);}
.btn-danger{background:var(--red-pale); color:var(--red); border-color:transparent;}
.btn-danger:hover{background:#ecc7c7;}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Cards & grid ---------- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1200px){.grid-5{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){.grid-5{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.grid-5{grid-template-columns:1fr;}}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.card{
  background:var(--paper-alt); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm);
}
.kpi{position:relative; overflow:hidden;}
.kpi .lbl{font-size:11px; text-transform:uppercase; letter-spacing:1.1px; color:var(--ink-faint); font-weight:700;}
.kpi .val{font-family:'Roboto',sans-serif; font-size:30px; font-weight:700; color:var(--indigo); margin-top:6px;}
.kpi .sub{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.kpi .bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}
.kpi.k-green .bar{background:var(--green);}
.kpi.k-clay .bar{background:var(--clay);}
.kpi.k-indigo .bar{background:var(--indigo);}
.kpi.k-gold .bar{background:var(--gold-deep);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h3{font-size:19px;}
.section-title .hint{font-size:11.5px; color:var(--ink-faint);}
.section-title:first-child{margin-top:0;}

/* ---------- Tables ---------- */
.table-wrap{background:var(--paper-alt); border:1px solid var(--border); border-radius:var(--radius); overflow-x:auto; overflow-y:hidden; box-shadow:var(--shadow-sm);}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; background:var(--paper-deep); color:var(--indigo); font-size:11px; text-transform:uppercase;
  letter-spacing:0.6px; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap; font-weight:700;
}
tbody td{padding:10px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FBF6E9;}
tbody tr.clickable{cursor:pointer;}
.td-right{text-align:right;}
.muted{color:var(--ink-faint);}
.empty-row td{text-align:center; padding:34px; color:var(--ink-faint); font-style:italic;}

.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px;}
.pill-green{background:var(--green-pale); color:var(--green);}
.pill-red{background:var(--red-pale); color:var(--red);}
.pill-gold{background:var(--gold-pale); color:var(--gold-deep);}
.pill-gray{background:var(--paper-deep); color:var(--ink-soft);}

/* ---------- Forms ---------- */
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 18px;}
.form-grid .full{grid-column:1/-1;}
label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.2px;}
label .req{color:var(--red);}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--paper-alt); color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-pale); border-color:var(--gold-deep);}
textarea{resize:vertical; min-height:64px;}
.field-hint{font-size:11px; color:var(--ink-faint); margin-top:4px;}
.ocr-box{border-style:dashed !important;}
.ocr-grid{display:grid; grid-template-columns:minmax(200px,280px) 1fr; gap:16px; align-items:start;}
@media (max-width:640px){ .ocr-grid{grid-template-columns:1fr;} }
.ocr-drop{display:flex; align-items:center; justify-content:center; text-align:center; min-height:150px; padding:12px; border:2px dashed var(--border); border-radius:var(--radius-sm); background:var(--paper-alt); cursor:pointer; font-size:12.5px; transition:border-color .15s, background .15s;}
.ocr-drop:hover,.ocr-drop.drag{border-color:var(--gold); background:var(--gold-pale);}
.ocr-drop img{max-height:220px; border-radius:6px; box-shadow:var(--shadow-sm);}
.ocr-side{display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
.ocr-res{width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; background:var(--paper-alt);}
.ocr-res .row{display:flex; justify-content:space-between; gap:12px; padding:3px 0; border-bottom:1px dotted var(--border-soft);}
.ocr-res .row:last-child{border-bottom:none;}
.ocr-res .ok{color:var(--green); font-weight:600;} .ocr-res .warn{color:var(--clay); font-weight:600;}
.ocr-filled{box-shadow:0 0 0 2px var(--gold) !important; transition:box-shadow .3s;}
fieldset{border:1px dashed var(--border); border-radius:10px; padding:14px 16px 16px; margin:0 0 4px;}
legend{font-size:12px; font-weight:700; color:var(--gold-deep); padding:0 6px; text-transform:uppercase; letter-spacing:.6px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap;}
.tabs button{
  background:none; border:none; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--ink-faint);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabs button.active{color:var(--gold-deep); border-color:var(--gold-deep);}

.preview-box{
  background:var(--indigo); color:#F4ECD8; border-radius:10px; padding:14px 16px; margin-top:6px;
}
.preview-box .row{display:flex; justify-content:space-between; padding:4px 0; font-size:13px;}
.preview-box .row b{color:#fff; font-weight:700;}
.preview-box .row .lab{color:#c3b7e0;}
.preview-box hr{border:none; border-top:1px solid rgba(255,255,255,0.15); margin:6px 0;}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(35,28,61,0.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto;}
.modal{background:var(--paper-alt); border-radius:14px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,0.3); animation:pop .16s ease;}
.modal.wide{max-width:900px;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:20px;}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.x-close{background:none; border:none; font-size:20px; color:var(--ink-faint); line-height:1;}

#storageBanner{position:fixed; top:0; left:0; right:0; z-index:250; background:#8f2d1f; color:#fff; font-size:13px; line-height:1.45; padding:9px 44px 9px 16px; box-shadow:0 2px 10px rgba(0,0,0,.25);}
#storageBanner a{color:#ffe08a; font-weight:700;} #storageBanner button{position:absolute; right:10px; top:6px; background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer;}
.toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--indigo); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; box-shadow:var(--shadow); animation:slidein .18s ease;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes slidein{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;}}

.search-bar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-bar input,.search-bar select{max-width:230px;}
.search-bar .spacer{flex:1;}

.admin-gate{max-width:380px; margin:60px auto; text-align:center;}
.admin-gate .badge{width:56px; height:56px; border-radius:50%; background:var(--gold-pale); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 14px;}
.pin-dots{display:flex; gap:10px; justify-content:center; margin:18px 0;}
.pin-dots input{width:46px; height:54px; text-align:center; font-size:22px; font-weight:700;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-faint);}
.empty-state .ic{font-size:34px; margin-bottom:10px;}

.badge-locked{font-size:10px; background:var(--indigo); color:#F4ECD8; padding:2px 8px; border-radius:20px; letter-spacing:.5px;}
.hr-soft{border:none; border-top:1px solid var(--border-soft); margin:16px 0;}
.two-col{display:grid; grid-template-columns:1.1fr 1.4fr; gap:20px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
.profile-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.avatar{width:52px; height:52px; border-radius:50%; background:var(--gold); color:var(--indigo); font-family:'Roboto',sans-serif; font-weight:700; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.mini-bar-track{background:var(--paper-deep); border-radius:6px; height:8px; overflow:hidden;}
.mini-bar-fill{background:var(--gold); height:100%;}

.pie-row{display:grid; grid-template-columns:1.2fr 1fr; gap:20px; margin-top:16px;}
@media(max-width:1000px){.pie-row{grid-template-columns:1fr;}}

/* ================= ACCESOS (login / roles) ================= */
.auth-screen{position:fixed; inset:0; z-index:300; background:linear-gradient(175deg,var(--indigo) 0%, var(--indigo-soft) 100%); display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
.auth-card{background:var(--paper-alt); border-radius:16px; padding:28px 26px 24px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.auth-brand{text-align:center; margin-bottom:16px; position:relative;}
.auth-brand h1{font-size:30px;}
.auth-brand span{display:block; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-deep); font-weight:700; margin-top:4px;}
.auth-card h3{font-size:21px; margin-bottom:10px;}
.auth-card input{margin-bottom:2px;}
.auth-msg{color:var(--red); font-size:12.5px; min-height:18px; margin:8px 0 6px;}
.auth-banner{background:var(--clay-pale); color:var(--clay); border-bottom:1px solid var(--border); padding:10px 30px; font-size:13px; font-weight:600;}
.user-chip{margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.12); font-size:12px; line-height:1.35;}
.user-chip b{display:block; color:#fff; font-size:13px;} .user-chip span{color:#a598c4;}
@media(max-width:860px){ .auth-banner{padding:10px 14px;} }
/* ================= RESPONSIVE / MÓVIL ================= */
.menu-btn{display:none; background:none; border:1px solid var(--border); color:var(--indigo); border-radius:10px; width:42px; height:42px; font-size:20px; line-height:1; flex:0 0 auto;}
.tb-left{display:flex; align-items:center; gap:12px; min-width:0;}
.tb-title{min-width:0;}
.drawer-overlay{display:none;}
.main{min-width:0;}
.tabs{overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch;}
.tabs button{white-space:nowrap;}
@media (max-width:860px){
  #app{height:auto; min-height:100%;}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; height:100%; width:268px; max-width:84vw; flex:none; z-index:60;
    transform:translateX(-102%); transition:transform .22s ease; box-shadow:none;
  }
  body.menu-open .sidebar{transform:none; box-shadow:0 0 40px rgba(0,0,0,.45);}
  body.menu-open .drawer-overlay{display:block; position:fixed; inset:0; background:rgba(20,15,40,.55); z-index:55;}
  body.menu-open{overflow:hidden;}
  .menu-btn{display:inline-flex; align-items:center; justify-content:center;}
  .topbar{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); top:0; gap:10px; flex-wrap:wrap;}
  :root{padding-top:0;}
  .topbar h2{font-size:21px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62vw;}
  .topbar .crumbs{font-size:10px;}
  .topbar .actions{flex-wrap:wrap; gap:8px; width:100%; justify-content:flex-start;}
  .topbar .actions:empty{display:none;}
  .content{padding:16px 14px 70px;}
  .section-title{flex-wrap:wrap; gap:6px;}
}
@media (max-width:700px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3,.grid-2,.two-col{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
  .kpi .val{font-size:24px;}
  .card{padding:14px 14px;}
  .search-bar{gap:8px;}

/* ---------------- Storage layer ----------------
   Tres modos, elegidos automáticamente:
   - 'db'     → Artifact publicado: base de datos compartida en tiempo real
                (todas las personas con el link ven los mismos datos al instante).
   - 'local'  → Vista previa del chat o archivo abierto suelto: se guarda con
                window.storage, privado en este navegador.
   - 'memory' → Ningún almacenamiento disponible: funciona igual en esta sesión,
                pero los cambios no quedan guardados al cerrar.
*/
let dbClient = null;
let dbUser = null;
let STORAGE_MODE = 'memory';
const unsubscribers = [];

let pendingRender = false;
/* Evita que una actualización de la base (propia o de otra persona) borre lo que se está escribiendo. */
function shouldDeferRender(){
  const content = document.getElementById('content');
  if(!content) return false;
  if(document.getElementById('modalRoot') && document.getElementById('modalRoot').children.length>0) return true;
  if(content.querySelector('form')) return true;
  const a = document.activeElement;
  if(a && content.contains(a) && ['INPUT','SELECT','TEXTAREA'].includes(a.tagName)) return true;
  return false;
}
function slugId(s){
  const slug = String(s==null?'':s).trim().replace(/[^a-zA-Z0-9_\-.~:@+]+/g,'-').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-');
  return slug || uid('X');
}
function docIdFor(col, item){
  if(col==='trm') return item.fecha;
  return slugId(item.id);
}

async function storageGet(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch(e){ console.error('storage error', key, e); return false; }
}

/* Contraseñas: viven en la colección 'credenciales' (cada persona puede cambiar la suya); el perfil y el rol en 'usuarios' (solo administradores). */
const RAW_AUTH = {usuarios:[], credenciales:[]};
const AUTH_CRED_FIELDS = ['salt','hash','mustChange','cambioClave'];
function authMergeUsers(){
  const creds = {}; (RAW_AUTH.credenciales||[]).forEach(c=>{ creds[c.id] = c; });
  return (RAW_AUTH.usuarios||[]).map(u=>{
    const c = creds[u.id]; const m = Object.assign({}, u);
    if(c) AUTH_CRED_FIELDS.forEach(k=>{ if(c[k]!==undefined) m[k] = c[k]; });
    return m;
  });
}
function authSplitUser(u){
  const prof = {}, cred = {id:u.id};
  Object.keys(u).forEach(k=>{ if(AUTH_CRED_FIELDS.includes(k)) cred[k] = u[k]; else prof[k] = u[k]; });
  return {prof, cred};
}
async function authSaveCred(u){            // lo puede hacer cada persona con su propia cuenta
  const {cred} = authSplitUser(u);
  try{ await dbClient.doc('credenciales/'+docIdFor('credenciales',cred)).set(cred); return true; }
  catch(e){ console.error('db cred error', e); return false; }
}

/* Guarda/edita UN registro. En modo db escribe un documento; en modo local
   reescribe el arreglo completo de esa colección; en memoria no hace nada. */
/* Espera máxima a la base compartida: si no responde, se avisa en vez de quedar "guardando" para siempre. */
function withTimeout(promise, ms, what){
  let t; const to = new Promise((_,rej)=>{ t = setTimeout(()=>rej({code:'timeout', message:'La base compartida no respondió en '+Math.round(ms/1000)+' s ('+what+').'}), ms); });
  return Promise.race([promise, to]).finally(()=>clearTimeout(t));
}
/* Tras escribir, vuelve a leer el documento y confirma que quedó igual: si no, NO se dice que se guardó. */
async function verifyWrite(path, item){
  const snap = await withTimeout(dbClient.doc(path).get(), 20000, 'verificando '+path);
  if(!snap.exists) throw {code:'verify', message:'El registro no aparece en la base después de guardar ('+path+').'};
  const got = snap.data() || {};
  const bad = Object.keys(item).filter(k=>{ const a = item[k], b = got[k]; return (a===null||['string','number','boolean'].includes(typeof a)) && a!==b && !(a===undefined); });
  if(bad.length) throw {code:'verify', message:'La base no guardó estos campos: '+bad.slice(0,5).join(', ')+' ('+path+').'};
}
const saveErrText = e => (e && (e.message || e.code)) ? (e.message||'')+(e.code?' [código: '+e.code+']':'') : 'error desconocido';
async function saveEntity(col, item){
  if(STORAGE_MODE==='db' && col==='usuarios'){
    const {prof} = authSplitUser(item);
    if(!(await authSaveCred(item))){ toast('No se pudo guardar en la base compartida.', 'err'); return false; }     // primero la clave, luego el perfil
    try{ const path = 'usuarios/'+docIdFor('usuarios',prof); await withTimeout(dbClient.doc(path).set(prof), 20000, 'guardando usuario'); if(!GAS_MODE) await verifyWrite(path, prof); }
    catch(e){ console.error('db set error usuarios', e); toast('No se pudo guardar en la base compartida: '+saveErrText(e)+' Nada se guardó.', 'err'); return false; }
    return true;
  }

let GAS_MODE = false, gasToken = '', gasMe = null, gasReady = false, gasExpiredShown = false, gasLastPublish = '';

function gasDecodeJwt(t){ try{ const b = String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
async function gasRequest(body){
  let r, j;

    r = await fetch(gasCfg().gasUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({token:gasToken}, body))});
    j = await r.json();
  }catch(e){ throw {code:'network', message:'Sin conexión con Google (revisa tu internet) o el servidor no respondió.'}; }

    const err = {code: (j&&j.error)==='permiso' ? 'invalid_argument' : ((j&&j.error)||'error'), server:(j&&j.error)||'error', message:(j&&j.message)||'Error del servidor.'};

function makeGasClient(){
  const cache = {}, revs = {}, subs = {}; let loaded = null, timer = null;
  const arr = c => cache[c] || [];
  const docsOf = c => arr(c).map(o=>({id:docIdFor(c,o), data:()=>o}));
  const snapOf = c => ({docs:docsOf(c), empty:!arr(c).length});
  const emit = c => (subs[c]||[]).slice().forEach(f=>{ try{ f(snapOf(c)); }catch(e){ console.error('snapshot cb', e); } });
  const clone = o => JSON.parse(JSON.stringify(o));
  async function loadAll(){
    const j = await gasRequest({action:'snapshot'});
    COLLECTIONS.forEach(c=>{ cache[c] = (j.data&&j.data[c]) || []; revs[c] = (j.revs&&j.revs[c]) || 0; });
    gasMe = j.me || gasMe;
  }
  const ensure = () => loaded || (loaded = loadAll().catch(e=>{ loaded = null; throw e; }));
  async function poll(){
    if(typeof document!=='undefined' && document.hidden) return;
    try{
      const j = await gasRequest({action:'rev'});
      if(j.me && gasMe && (j.me.rol!==gasMe.rol || (j.me.closerId||'')!==(gasMe.closerId||''))){ location.reload(); return; }
      for(const c of COLLECTIONS){
        if(c==='credenciales' || c==='solicitudes') continue;
        if((j.revs[c]||0) !== (revs[c]||0)){ const l = await gasRequest({action:'list', collection:c}); cache[c] = l.data||[]; revs[c] = l.rev||0; emit(c); }
      }
    }catch(e){
      if(e && e.server==='no_autorizado'){ alert('Tu acceso fue desactivado por un administrador.'); location.reload(); }
      else console.warn('actualización', e);
    }
  }
  function startPolling(){ if(timer) return; timer = setInterval(poll, gasCfg().pollMs || 20000); if(typeof document!=='undefined') document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); }); }
  function docRef(col, id){
    return {
      get: async ()=>{ await ensure(); const o = arr(col).find(x=>docIdFor(col,x)===id); return {exists:!!o, data:()=>o}; },
      set: async data=>{
        const res = await gasRequest({action:'set', collection:col, id, data});
        if(res.ignored || !(col in cache)) return;
        const i = arr(col).findIndex(x=>docIdFor(col,x)===id); const item = clone(data);
        if(i>=0) cache[col][i] = item; else cache[col].push(item);
        if(res.rev === (revs[col]||0)+1) revs[col] = res.rev;
        emit(col);
      },
      delete: async ()=>{
        const res = await gasRequest({action:'delete', collection:col, id});
        if(res.ignored || !(col in cache)) return;
        cache[col] = arr(col).filter(x=>docIdFor(col,x)!==id);
        if(res.rev === (revs[col]||0)+1) revs[col] = res.rev;
        emit(col);
      }
    };
  }
  return {
    collection(col){ return {
      limit(){ return {get: async ()=>{ await ensure(); return {empty:!arr(col).length, docs:[]}; }}; },
      get: async ()=>{ await ensure(); return snapOf(col); },
      onSnapshot(cb, errCb){ (subs[col] = subs[col]||[]).push(cb); ensure().then(()=>cb(snapOf(col))).catch(e=>{ if(errCb) errCb(e); }); startPolling(); return ()=>{ subs[col] = (subs[col]||[]).filter(f=>f!==cb); }; },
      doc(id){ return docRef(col,id); }
    }; },
    doc(path){ const i = path.indexOf('/'); return docRef(path.slice(0,i), path.slice(i+1)); },
    async batch(col, sets, dels){
      await gasRequest({action:'batch', collection:col, sets, deletes:dels});
      if(col in cache){ const l = await gasRequest({action:'list', collection:col}); cache[col] = l.data||[]; revs[col] = l.rev||0; emit(col); }
    },
    refresh: poll,
    async reload(){ await loadAll(); COLLECTIONS.forEach(emit); }
  };
}
/* ================= MODO GITHUB: los datos viven en un repositorio privado de GitHub (un archivo JSON por tabla) ================= */
let GH_MODE = false;
const GH_KEY = 'amaryya:github';
function ghCfgStored(){ try{ return JSON.parse(localStorage.getItem(GH_KEY) || 'null'); }catch(e){ return null; } }
function ghForget(){ try{ localStorage.removeItem(GH_KEY); }catch(e){} location.reload(); }
const ghB64enc = s => { const b = new TextEncoder().encode(s); let r = ''; for(let i=0;i<b.length;i+=0x8000) r += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(r); };
const ghB64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s||'').replace(/\s/g,'')), c=>c.charCodeAt(0)));
async function ghApi(cfg, path, opts){
  opts = opts || {};
  let r;
  try{ r = await fetch('https://api.github.com/repos/'+cfg.owner+'/'+cfg.repo+path, {method:opts.method||'GET', cache:'no-store', headers:Object.assign({'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, opts.body?{'Content-Type':'application/json'}:{}, opts.headers||{}), body:opts.body?JSON.stringify(opts.body):undefined}); }
  catch(e){ throw {code:'unavailable', message:'Sin conexión con GitHub. Revisa tu internet.'}; }
  if(r.status===304) return {notModified:true};
  if(r.status===404 && opts.allow404) return {notFound:true};
  if(r.status===401){ try{ localStorage.removeItem(GH_KEY); }catch(e){} throw {code:'unauthenticated', message:'El token de GitHub no es válido o venció. Recarga la página y escribe uno nuevo.'}; }
  if(r.status===403 || r.status===404) throw {code:'permission-denied', message: opts.method==='PUT' ? 'Tu token de GitHub no tiene permiso para guardar (solo lectura).' : 'No hay acceso al repositorio de datos. Revisa el usuario, el nombre del repositorio y el token.'};
  if(r.status===409 || r.status===422) throw {code:'conflict', message:'Otra persona guardó al mismo tiempo.'};
  if(!r.ok) throw {code:'unknown', message:'GitHub respondió con error '+r.status+'.'};
  return {json: await r.json(), etag: r.headers.get('ETag')};
}
function makeGhClient(cfg){
  const branch = cfg.branch || 'main';
  const cache = {}, shas = {}, etags = {}, subs = {}, queue = {}, chain = {};
  let loaded = null, lastHead = '', timer = null;
  const arr = c => cache[c] || [];
  const clone = o => JSON.parse(JSON.stringify(o));
  const snapOf = c => { const docs = arr(c).map(o=>({id:docIdFor(c,o), data:()=>o})); return {docs, empty:!docs.length}; };
  const emit = c => (subs[c]||[]).slice().forEach(f=>{ try{ f(snapOf(c)); }catch(e){ console.error('snapshot cb', e); } });
  const filePath = c => '/contents/datos/'+c+'.json';
  async function readFile(c, useEtag){
    const res = await ghApi(cfg, filePath(c)+'?ref='+encodeURIComponent(branch), {allow404:true, headers:(useEtag && etags[c])?{'If-None-Match':etags[c]}:{}});
    if(res.notModified) return false;
    if(res.notFound){ const changed = arr(c).length>0 || shas[c]; cache[c] = []; shas[c] = null; etags[c] = null; return !!changed; }
    let txt = res.json.content ? ghB64dec(res.json.content) : '';
    if(!txt && res.json.size>0){ const bl = await ghApi(cfg, '/git/blobs/'+res.json.sha); txt = ghB64dec(bl.json.content); }
    let data = []; try{ data = txt ? JSON.parse(txt) : []; }catch(e){ data = []; }

    cache[c] = Array.isArray(data) ? data : []; shas[c] = res.json.sha; etags[c] = res.etag;

  }
  async function loadAll(){ for(const c of COLLECTIONS) await readFile(c, false); }
  const ensure = () => loaded || (loaded = loadAll().catch(e=>{ loaded = null; throw e; }));
  async function flush(c){
    const ops = queue[c] || []; queue[c] = [];
    if(!ops.length) return;
    let lastErr = null;
    for(let intento=0; intento<5; intento++){
      try{
        if(intento>0) await readFile(c, false);
        const list = clone(arr(c)); const idx = {}; list.forEach((x,i)=>{ idx[docIdFor(c,x)] = i; });
        ops.forEach(op=>{
          if(op.del){ if(idx[op.id]!==undefined){ list.splice(idx[op.id],1); list.forEach((x,i)=>{ idx[docIdFor(c,x)] = i; }); } }
          else if(idx[op.id]!==undefined) list[idx[op.id]] = op.data; else { list.push(op.data); idx[op.id] = list.length-1; }
        });
        const quien = (typeof currentUser!=='undefined' && currentUser && currentUser.id) ? currentUser.id : 'app';
        const res = await ghApi(cfg, filePath(c), {method:'PUT', body:{message:c+': '+ops.length+' cambio(s) · '+quien, content:ghB64enc(JSON.stringify(list, null, 1)), branch, sha:shas[c]||undefined}});
        cache[c] = list; shas[c] = res.json.content.sha; etags[c] = null;
        ops.forEach(op=>op.ok()); emit(c); return;
      }catch(e){ lastErr = e; if(e.code!=='conflict') break; await new Promise(r=>setTimeout(r, 400+Math.random()*800)); }
    }
    ops.forEach(op=>op.fail(lastErr));
  }
  function enqueue(c, op){
    return new Promise((ok, fail)=>{
      op.ok = ok; op.fail = fail; (queue[c] = queue[c] || []).push(op);
      clearTimeout(op.t); setTimeout(()=>{ chain[c] = (chain[c] || Promise.resolve()).then(()=>flush(c)); }, 250);
    });
  }
  async function poll(){
    if(typeof document!=='undefined' && document.hidden) return;
    try{
      const b = await ghApi(cfg, '/branches/'+encodeURIComponent(branch), {allow404:true});
      const head = b.notFound ? '' : b.json.commit.sha;
      if(head && head===lastHead) return;
      lastHead = head;
      for(const c of COLLECTIONS){ if((queue[c]||[]).length) continue; if(await readFile(c, true)) emit(c); }
    }catch(e){ console.warn('actualización GitHub', e); }
  }
  function startPolling(){ if(timer) return; timer = setInterval(poll, cfg.pollMs || 15000); if(typeof document!=='undefined') document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); }); }
  function docRef(col, id){
    return {
      get: async ()=>{ await ensure(); const o = arr(col).find(x=>docIdFor(col,x)===id); return {exists:!!o, data:()=>o}; },
      set: async data=>{ await ensure(); return enqueue(col, {id, data:clone(data)}); },
      delete: async ()=>{ await ensure(); return enqueue(col, {id, del:true}); }
    };
  }
  return {
    collection(col){ return {
      limit(){ return {get: async ()=>{ await ensure(); return snapOf(col); }}; },
      get: async ()=>{ await ensure(); return snapOf(col); },
      onSnapshot(cb, errCb){ (subs[col] = subs[col]||[]).push(cb); ensure().then(()=>cb(snapOf(col))).catch(e=>{ if(errCb) errCb(e); }); startPolling(); return ()=>{ subs[col] = (subs[col]||[]).filter(f=>f!==cb); }; },
      doc(id){ return docRef(col,id); }
    }; },
    doc(path){ const i = path.indexOf('/'); return docRef(path.slice(0,i), path.slice(i+1)); },
    async seedMany(col, items){ await ensure(); await Promise.all(items.map(it=>enqueue(col, {id:docIdFor(col,it), data:clone(it)}))); },
    refresh: poll
  };
}

async function waitForWindowStorage(maxWaitMs){
  const start = Date.now();
  while((typeof window.storage === 'undefined' || !window.storage) && Date.now()-start < maxWaitMs){
    await new Promise(r=>setTimeout(r, 30));
  }
  return typeof window.storage !== 'undefined' && !!window.storage;
}

async function waitForClaudeHost(maxWaitMs){   // dentro de Claude, la conexión con la base puede inyectarse un instante después de cargar
  const start = Date.now();
  while(!(window.claude && typeof window.claude.use === 'function') && Date.now()-start < maxWaitMs){ await new Promise(r=>setTimeout(r, 40)); }
  return !!(window.claude && typeof window.claude.use === 'function');
}
async function detectStorageMode(){

  if(location.protocol!=='file:' && ghEnabled()){
    let cfg = ghCfgStored();

  }

      const d = await window.claude.use('db');

  // window.storage puede tardar un instante en inyectarse según el entorno; esperamos un poco antes de rendirnos.

/* Re-sincronización: si el canal en vivo falla o se queda dormido, se vuelve a leer la base y se aplica lo que cambió. */
const snapApply = {}; let syncWarnAt = 0, syncBusy = false;
function syncWarn(msg){ if(Date.now()-syncWarnAt > 60000){ syncWarnAt = Date.now(); toast('⚠️ '+msg, 'err'); } }
async function resyncCollection(col, force){
  if(!snapApply[col] || !dbClient || GAS_MODE) return;
  const q = dbClient.collection(col); const snap = await withTimeout((typeof q.get==='function' ? q.get() : q.limit(5000).get()), 20000, 'leyendo '+col);
  const docs = snap.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
  if(!force && JSON.stringify(docs)===JSON.stringify(DB_ALL[col])) return;
  snapApply[col]({docs:snap.docs, empty:!snap.docs.length});
}
async function resyncAll(force){
  if(syncBusy || STORAGE_MODE!=='db' || GAS_MODE) return; syncBusy = true;
  try{ for(const c of COLLECTIONS){ if(c==='credenciales' && !(typeof isAdmin==='function' && isAdmin())) continue; try{ await resyncCollection(c, force); }catch(e){ console.warn('resync', c, e); } } }
  finally{ syncBusy = false; }
}

async function loadAllDb(){
  // Siembra cada colección una sola vez, si está vacía (no en modo Google: ahí los datos viven en tu Sheet).
  for(const col of (GAS_MODE ? [] : COLLECTIONS)){
    try{
      const snap = await dbClient.collection(col).limit(1).get();
      if(snap.empty && typeof dbClient.seedMany==='function'){ try{ await dbClient.seedMany(col, SEED_DATA[col]||[]); }catch(e){ console.error('seed error', col, e); } }
      else if(snap.empty){
        for(const item of (SEED_DATA[col]||[])){
          try{ await dbClient.collection(col).doc(docIdFor(col,item)).set(item); }
          catch(e){ console.error('seed error', col, e); }
        }
      }
    }catch(e){ console.error('seed check error', col, e); }
  }
  // Suscripción en tiempo real: cualquier cambio, propio o de otra persona, se refleja solo.
  const got = new Set();
  COLLECTIONS.forEach(col=>{
    const applySnap = snap=>{
      let docs = snap.docs.map(d=>JSON.parse(JSON.stringify(d.data())));   // copia editable (los datos del servidor pueden venir congelados)
      DB_ALL[col] = docs; got.add(col);
      let c2 = col;                      // 'usuarios' y 'credenciales' se combinan en una sola lista de usuarios
      if(col==='usuarios' || col==='credenciales'){ RAW_AUTH[col] = docs; docs = DB_ALL.usuarios = authMergeUsers(); c2 = 'usuarios'; }
      DB[c2] = (authRequired && currentUser) ? scopeCollection(c2, docs) : docs;
      if(GAS_MODE && gasReady && ['students','payments','closers','programas','platforms','trm'].includes(col)) schedulePublish();
      if(authRequired && currentUser){
        if(c2==='students' || c2==='payments') rescopeAll();
        if(c2==='usuarios' && !(col==='credenciales' && !docs.some(x=>x.id===currentUser.id))) authOnUsersChanged();
        if(col==='solicitudes' && isAdmin()){ if(docs.length>(window.__lastReqCount||0)) toast('🔑 Nueva solicitud de contraseña: revisa Usuarios y accesos.'); window.__lastReqCount = docs.length; renderNav(); }
        if(col==='payments' && isAdmin()) authSyncPending();
      }
      if(col==='credenciales' && !currentUser) return;
      if(authRequired && !currentUser) return;          // todavía en la pantalla de acceso
      if(shouldDeferRender()) { pendingRender = true; return; }
      renderView();
    };
    snapApply[col] = applySnap;
    const unsub = dbClient.collection(col).onSnapshot(applySnap, err=>{
      console.error('db snapshot error', col, err);
      syncWarn('No se pudo recibir actualizaciones de "'+col+'": '+saveErrText(err));
    });
    unsubscribers.push(unsub);
  });
  // Espera a que llegue la primera entrega de cada colección (máx. 10 s) antes de decidir el acceso.
  await new Promise(resolve=>{
    const t0 = Date.now();
    const check = ()=>{ if(COLLECTIONS.every(c=>got.has(c)) || Date.now()-t0>10000) resolve(); else setTimeout(check,50); };
    check();
  });
}

/* ---------------- Utilities ---------------- */
function uid(prefix){ return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function escapeHtml(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseNum(v){
  if(typeof v === 'number'){ return isNaN(v) ? 0 : v; }
  if(v===null || v===undefined) return 0;
  let s = String(v).trim();
  if(s==='') return 0;
  const neg = /^-/.test(s);
  s = s.replace(/^[-+]/,'').replace(/[^0-9.,]/g,'');
  if(s==='') return 0;
  const hasDot = s.indexOf('.') !== -1;
  const hasComma = s.indexOf(',') !== -1;
  if(hasDot && hasComma){
    // El separador que aparece de último se asume decimal; el otro, separador de miles.
    if(s.lastIndexOf(',') > s.lastIndexOf('.')){ s = s.replace(/\./g,'').replace(',', '.'); }
    else { s = s.replace(/,/g,''); }
  } else if(hasComma){
    const parts = s.split(',');
    const lastLen = parts[parts.length-1].length;
    s = (parts.length>2 || lastLen===3) ? s.replace(/,/g,'') : s.replace(',', '.');
  } else if(hasDot){
    const parts = s.split('.');
    const lastLen = parts[parts.length-1].length;
    if(parts.length>2 || lastLen===3){ s = s.replace(/\./g,''); }
  }
  const n = parseFloat(s);
  const result = isNaN(n) ? 0 : n;
  return neg ? -result : result;
}
function fmtUSD(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' USD'; }
function fmtUSDShort(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:0}); }
function normMoneda(m){
  const t = String(m==null?'':m).trim().toUpperCase();
  if(['COP','COL','PESOS COLOMBIANOS'].includes(t)) return 'COP';
  if(['MXN','MX','PESOS MEXICANOS'].includes(t)) return 'MXN';
  if(['USD','US','DOLAR','DÓLAR','DOLARES','DÓLARES'].includes(t)) return 'USD';
  return t==='' ? 'USD' : t;
}
function fmtOrig(n, moneda){
  moneda = normMoneda(moneda);
  if(n===null||n===undefined||n==='') return '—';
  const num = Number(n);
  if(moneda==='COP') return '$' + num.toLocaleString('es-CO',{maximumFractionDigits:0}) + ' COP';
  if(moneda==='MXN') return '$' + num.toLocaleString('es-MX',{maximumFractionDigits:2}) + ' MXN';
  return '$' + num.toLocaleString('en-US',{maximumFractionDigits:2}) + ' USD';
}
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (Number(n)*100).toLocaleString('es-CO',{maximumFractionDigits:1}) + '%'; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function todayIso(){ return new Date().toISOString().slice(0,10); }
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='err'?'err':type==='ok'?'ok':'');

  el.style.cursor = 'pointer'; el.addEventListener('click', kill);

}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
}

/* ---------------- Domain lookups ---------------- */
function getStudent(id){ return DB.students.find(s=>s.id===id); }
function getStudentAny(id){ return getStudent(id) || (DB_ALL.students||[]).find(s=>s.id===id); }   // incluye estudiantes fuera del alcance del rol (solo para sesiones)
function getCloser(id){ return DB.closers.find(c=>c.id===id); }
function getPlatform(name){ const k = String(name==null?'':name).trim().toLowerCase(); return k ? DB.platforms.find(p=>String(p.nombre).trim().toLowerCase()===k) : undefined; }
function getPrograma(name){ return DB.programas.find(pr=>pr.nombre===name); }

function findTRM(fechaIso){
  if(!DB.trm.length) return null;
  const exact = DB.trm.find(t=>t.fecha===fechaIso);
  if(exact) return exact;
  // no hay TRM de ese día: se toma la última fecha ingresada anterior (la más cercana)
  const before = DB.trm.filter(t=>t.fecha <= fechaIso).sort((a,b)=> a.fecha < b.fecha ? 1 : -1);
  if(before.length) return before[0];
  // si no hay fechas anteriores, la fecha ingresada más cercana posterior
  const sorted = [...DB.trm].sort((a,b)=> a.fecha < b.fecha ? -1 : 1);
  return sorted[0];
}

function corteMes(fechaIso){
  const d = new Date(fechaIso+'T00:00:00');
  if(isNaN(d)) return {label:'—', key:'—'};
  let m = d.getMonth(), y = d.getFullYear();
  // Corte: último día del mes (el pago pertenece al mes calendario en que se hizo)
  return { label: MESES[m]+' '+y, key: y+'-'+String(m+1).padStart(2,'0') };
}

function convertToUSD(pagoReal, moneda, trmRec){
  const val = parseNum(pagoReal);
  const m = (moneda||'').toUpperCase();
  if(m==='COP' || m==='COL'){ return trmRec && trmRec.trmCOP ? val/trmRec.trmCOP : 0; }
  if(m==='MXN' || m==='MX'){ return trmRec && trmRec.trmMXN ? val/trmRec.trmMXN : 0; }
  return val; // USD u otra -> se asume ya en USD
}

function effectiveCloserPct(p){
  if(p.pendienteRevision===true) return 0;   // pendiente: el administrador aún no define la comisión
  // % variable guardado en el pago; si es un pago antiguo sin ese dato, usa el % que tenía el closer (compatibilidad).
  if(p.comisionCloserPct!==undefined && p.comisionCloserPct!==null){ const v = parseNum(p.comisionCloserPct); return v>=1 ? v/100 : v; }
  const cl = getCloser(p.closer);
  return cl ? parseNum(cl.comisionPct) : 0;
}
function normPct(v){ const n = parseNum(v); return n>=1 ? n/100 : n; }
function anioMes(p){
  const f = String(p.fecha||'');
  const anio = f.slice(0,4); const mesNum = parseInt(f.slice(5,7),10)||0;
  return { anio, mesNum, mes: (mesNum>=1&&mesNum<=12)? MESES_FULL[mesNum-1] : '—' };
}
function calcPayment(p){
  const trmRec = findTRM(p.fecha);
  const necesitaTRM = ['COP','COL','MXN','MX'].includes(String(p.moneda||'').toUpperCase());
  const trmAprox = !!(necesitaTRM && trmRec && trmRec.fecha!==p.fecha);   // no hay TRM de ese día: se usó la más cercana
  const trmSinDato = !!(necesitaTRM && !trmRec);
  const valorUSD = convertToUSD(p.pagoReal, p.moneda, trmRec);
  const platform = getPlatform(p.medioPago);
  const comisionPlataformaPct = platform ? parseNum(platform.comisionPct) : 0;
  const valorComisionPlataformaUSD = valorUSD * comisionPlataformaPct;
  const ingresoNetoUSD = valorUSD - valorComisionPlataformaUSD;
  const comisionCloserPct = effectiveCloserPct(p);
  const valorComisionCloserUSD = ingresoNetoUSD * comisionCloserPct;
  const apoyoCloserId = p.apoyoCloser || '';
  const comisionApoyoPct = apoyoCloserId ? normPct(p.apoyoComisionPct) : 0;
  const valorComisionApoyoUSD = ingresoNetoUSD * comisionApoyoPct;
  const pagoTerapeutaUSD = parseNum(p.pagoTerapeuta);
  const bonosUSD = parseNum(p.bonos);
  const bonoTerapeutaId = bonosUSD ? (p.bonoTerapeuta || p.nombreTerapeuta || '') : '';   // el bono va asociado a un terapeuta
  const pagoTotalTerapeutaUSD = pagoTerapeutaUSD + bonosUSD;                                 // sesión + bono
  const netoAntesBolsilloUSD = ingresoNetoUSD - valorComisionCloserUSD - valorComisionApoyoUSD - pagoTerapeutaUSD - bonosUSD;
  const bolsilloUSD = Math.max(0, parseNum(p.bolsillo));            // el usuario lo digita; se descuenta después de closers, terapeutas y comisiones
  const netoAmarYYaUSD = netoAntesBolsilloUSD - bolsilloUSD;         // NETO AMARYYA = después de descontar el bolsillo del pago; es la base del ahorro
  const netoDespuesBolsilloUSD = netoAmarYYaUSD;
  const ahorroPct = 0.10;
  const ahorroUSD = netoAmarYYaUSD * ahorroPct;
  const netoFinalUSD = netoAmarYYaUSD - ahorroUSD;
  const corte = corteMes(p.fecha);
  return {
    trmRec, trmAprox, trmSinDato, valorUSD, comisionPlataformaPct, valorComisionPlataformaUSD,
    ingresoNetoUSD, comisionCloserPct, valorComisionCloserUSD, apoyoCloserId, comisionApoyoPct, valorComisionApoyoUSD,
    pagoTerapeutaUSD, bonosUSD, bonoTerapeutaId, pagoTotalTerapeutaUSD, netoAntesBolsilloUSD, netoAmarYYaUSD, bolsilloUSD, netoDespuesBolsilloUSD, ahorroPct, ahorroUSD, netoFinalUSD, corte
  };
}

/* "Real pagado" mensual = histórico base (Datos_Base) + pagos registrados en la app (se calculan en vivo,
   así editar, eliminar o importar un pago siempre se refleja). Los pagos anteriores a este cambio ya estaban
   sumados dentro del arreglo histórico ("almacenados"). */
const isLivePayment = p => p.origen!=='legacy' && (p.liveHist===true || p.pendienteSync===true);
const isStoredPayment = p => p.origen!=='legacy' && !isLivePayment(p);
function livePaymentsByMonth(idSet){
  const arr = new Array(12).fill(0);
  DB.payments.forEach(p=>{
    if(!isLivePayment(p)) return;
    if(idSet && !idSet.has(p.estudianteId)) return;
    const c = calcPayment(p); const m = parseInt(c.corte.key.split('-')[1],10)-1;
    if(m>=0 && m<12) arr[m] += c.valorUSD;
  });
  return arr;
}
/* Eliminación en cascada: al borrar un estudiante se borran primero sus pagos y sesiones personalizadas (bonos), luego el estudiante. */
async function deleteStudentCascade(id, target){
  const pays = (DB_ALL.payments||DB.payments).filter(p=>p.estudianteId===id);
  const bonos = (DB_ALL.bonos||DB.bonos||[]).filter(b=>b.estudianteId===id);
  const drop = (col, pred) => { DB[col] = (DB[col]||[]).filter(x=>!pred(x)); if(DB_ALL[col]) DB_ALL[col] = DB_ALL[col].filter(x=>!pred(x)); };
  drop('payments', p=>p.estudianteId===id);
  for(const p of pays){ if((await deleteEntity('payments', p))===false) return false; }
  drop('bonos', b=>b.estudianteId===id);
  for(const b of bonos){ if((await deleteEntity('bonos', b))===false) return false; }
  drop('students', s=>s.id===id);
  if(target && (await deleteEntity('students', target))===false) return false;
  return {pagos:pays.length, bonos:bonos.length};
}
async function detachStoredPayment(p){
  // Pago anterior al cambio: se resta del arreglo histórico lo que se había sumado, y pasa a calcularse en vivo.
  if(!isStoredPayment(p)) return;
  const st = getStudent(p.estudianteId); const c = calcPayment(p); const m = parseInt(c.corte.key.split('-')[1],10)-1;
  if(st && m>=0 && m<12 && Array.isArray(st.historicoReal) && st.historicoReal.length===12){
    st.historicoReal[m] = Math.max(0, parseNum(st.historicoReal[m]) - c.valorUSD);
    if(st.historicoMeses && st.historicoMeses[c.corte.key]) st.historicoMeses[c.corte.key].r = Math.max(0, parseNum(st.historicoMeses[c.corte.key].r) - c.valorUSD);
    await saveEntity('students', st);
  }
}
function studentPayments(studentId){
  return DB.payments.filter(p=>p.estudianteId===studentId).sort((a,b)=> a.fecha < b.fecha ? 1 : -1);
}
/* Lo pagado en el histórico = SUMA de los valores reales mensuales ingresados (tabla "Cartera mensual" / carga de Excel).
   Si se edita un mes, el total se recalcula solo; ya no depende de un número fijo guardado aparte. */
function histCobrado(st){
  if(!st) return 0;
  if(st.historicoMeses && typeof st.historicoMeses==='object') return Object.keys(st.historicoMeses).reduce((a,k)=>a+parseNum((st.historicoMeses[k]||{}).r),0);
  if(st.historicoMatched && Array.isArray(st.historicoReal)) return st.historicoReal.reduce((a,v)=>a+parseNum(v),0);
  return parseNum(st.historicoCobrado);
}
/* ---------- Programas adicionales: un estudiante puede comprar más de un programa ---------- */
const adicionalesDe = st => (st && Array.isArray(st.adicionales)) ? st.adicionales : [];
const programasDe = st => st ? [...new Set([st.programa, ...adicionalesDe(st).map(a=>a.programa)].filter(Boolean))] : [];
const tienePrograma = (st, prog) => programasDe(st).includes(prog);
function programaDePago(p){ const st = getStudent(p.estudianteId); return p.programa || (st && st.programa) || ''; }
function totalsProg(st, prog){   // totales del estudiante limitados a un programa (o todos si prog está vacío)
  const t = studentTotals(st.id); if(!prog) return t;
  const e = t.porPrograma.find(x=>x.programa===prog); if(!e) return Object.assign({}, t, {valorTotal:0, totalPagadoUSD:0, saldo:0});
  return Object.assign({}, t, {valorTotal:e.valor, totalPagadoUSD:e.pagado, saldo:e.saldo});
}
function programasTxt(st){ const a = programasDe(st); return a.length ? a.join(' + ') : ''; }
function studentTotals(studentId){
  const st = getStudent(studentId);
  const pays = studentPayments(studentId);
  const historicoCobrado = histCobrado(st);
  const conHistorico = !!(st && (st.historicoMatched || (st.historicoMeses && typeof st.historicoMeses==='object')));
  let nuevoPagadoUSD = 0;
  const prin = (st && st.programa) || '', ads = adicionalesDe(st), pm = new Map();
  const slot = n => { if(!pm.has(n)) pm.set(n,{programa:n, valor:0, pagado:0, principal:false}); return pm.get(n); };
  const P0 = slot(prin); P0.principal = true; P0.valor = st ? parseNum(st.valorTotal) : 0; P0.pagado = historicoCobrado;
  ads.forEach(a=>{ slot(a.programa||'(Sin programa)').valor += parseNum(a.valor); });
  pays.forEach(p=>{
    // Los pagos "legacy" y los ya sumados en el histórico no se cuentan dos veces: con histórico solo suman los pagos en vivo
    // (registrados en la app); sin histórico suman todos los pagos registrados.
    if(p.origen==='legacy' && historicoCobrado>0) return;
    if(conHistorico && isStoredPayment(p)) return;
    const vUSD = calcPayment(p).valorUSD;
    nuevoPagadoUSD += vUSD;
    slot(p.programa && pm.has(p.programa) ? p.programa : prin).pagado += vUSD;   // el pago va al programa elegido; sin elegir, al principal
  });
  const totalPagadoUSD = historicoCobrado + nuevoPagadoUSD;
  const valorBase = st ? parseNum(st.valorTotal) : 0, valorAdicionales = ads.reduce((a,x)=>a+parseNum(x.valor),0);
  const valorTotal = valorBase + valorAdicionales;
  const saldo = valorTotal - totalPagadoUSD;
  const porPrograma = [...pm.values()].filter(x=>x.programa || x.valor || x.pagado).map(x=>Object.assign(x,{saldo:x.valor-x.pagado}));
  const pctAvance = valorTotal>0 ? Math.min(1,totalPagadoUSD/valorTotal) : 0;
  return { totalPagadoUSD, nuevoPagadoUSD, historicoCobrado, valorTotal, valorBase, valorAdicionales, porPrograma, saldo, pctAvance, count: pays.length };
}

function latestTRM(){
  if(!DB.trm.length) return null;
  return [...DB.trm].sort((a,b)=> a.fecha<b.fecha?1:-1)[0];
}

/* Agregado mensual desde Datos_Base (Cobro Propuesto vs Cumplimiento Real) */
function monthlyHistoricoAggregate(list){
  const propuesto = new Array(12).fill(0);
  const real = new Array(12).fill(0);
  (list||DB.students).forEach(s=>{
    if(!s.historicoMatched) return;
    (s.historicoPropuesto||[]).forEach((v,i)=> propuesto[i]+=parseNum(v));
    (s.historicoReal||[]).forEach((v,i)=> real[i]+=parseNum(v));
  });
  return {propuesto, real};
}

const VAL_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function valNumber(raw, label, opts){
  // Devuelve '' si es válido; si no, el mensaje. opts: {min, minExcl, max, required, pct}
  opts = opts || {};
  let t = String(raw==null?'':raw).trim();
  if(t===''){ return opts.required ? label+' es obligatorio.' : ''; }
  t = t.replace(/^[$\s]+/,'');
  if(opts.pct) t = t.replace(/\s*%$/,'');
  if(!/^[-+]?[\d][\d.,\s]*$/.test(t) && !/^[-+]?[.,]\d[\d.,\s]*$/.test(t)) return label+': escribe solo números.';
  const n = parseNum(t);
  if(opts.min!==undefined && n<opts.min) return label+(opts.min===0 ? ': no puede ser negativo.' : ': debe ser mayor o igual a '+opts.min+'.');
  if(opts.minExcl!==undefined && n<=opts.minExcl) return label+': debe ser mayor que '+opts.minExcl+'.';
  if(opts.max!==undefined && n>opts.max) return label+': no puede superar '+opts.max.toLocaleString('es-CO')+(opts.pct?'%':'')+'.';
  return '';
}
function inRange(fecha, desde, hasta){ if(desde && fecha < desde) return false; if(hasta && fecha > hasta) return false; return true; }

function pieChartSVG(items, centerTop, centerBottom){
  const total = items.reduce((a,i)=>a+Math.max(0,i.value),0);
  const r=70, C=2*Math.PI*r; let acc=0;
  const slices = total>0 ? items.filter(i=>i.value>0).map(i=>{
    const len = i.value/total*C; const el = `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${i.color}" stroke-width="42" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${escapeHtml(i.label)}: ${fmtUSDShort(i.value)}</title></circle>`;
    acc += len; return el;
  }).join('') : `<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--border)" stroke-width="42"/>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Gráfica de pastel" style="width:100%; max-width:230px; height:auto;">
    ${slices}
    <text x="100" y="94" text-anchor="middle" style="font-size:11px; fill:var(--ink-faint); font-family:'Roboto',sans-serif;">${escapeHtml(centerTop)}</text>
    <text x="100" y="116" text-anchor="middle" style="font-size:20px; font-weight:700; fill:var(--indigo); font-family:'Roboto',sans-serif;">${escapeHtml(centerBottom)}</text>
  </svg>`;
}

function drawDashboardBody(){

    return {nombre:c.nombre, comis};

  const maxComis = Math.max(1, ...closersRanking.map(c=>c.comis));

const GV_EMPTY = {anio:'',mes:'',prog:'',closer:'',ter:'',plat:'',mon:'',tipo:'',est:'',desde:'',hasta:''};
let gvF = Object.assign({}, GV_EMPTY);
const GV_MES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const gvMesLabel = k => { const p = String(k).split('-'); return (GV_MES_CORTO[parseInt(p[1],10)-1]||p[1])+' '+String(p[0]).slice(2); };
const gvName = id => { const c = getCloser(id); return c ? c.nombre : (id||'—'); };
function gvK(n){
  const a = Math.abs(n), s = n<0?'-':'';
  if(a>=1e6) return s+'$'+(a/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+'M';
  if(a>=1e3) return s+'$'+(a/1e3).toLocaleString('en-US',{maximumFractionDigits:a>=1e4?0:1})+'k';
  return s+'$'+Math.round(a);
}
function gvNice(max){ if(max<=0) return 1; const e = Math.pow(10, Math.floor(Math.log10(max))); const f = max/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function gvStudentMap(){ const m = {}; DB.students.forEach(s=>{ m[s.id] = s; }); return m; }
function gvPass(p, ignoreMes, stu){
  const f = gvF, c = corteMes(p.fecha);
  if(f.anio && String(c.key).slice(0,4)!==f.anio) return false;
  if(!ignoreMes && f.mes && c.key!==f.mes) return false;
  if(!inRange(p.fecha, f.desde, f.hasta)) return false;
  const s = stu[p.estudianteId];
  if(f.prog && programaDePago(p)!==f.prog) return false;
  if(f.est && (!s || (s.estado||'ACTIVO')!==f.est)) return false;
  if(f.closer && p.closer!==f.closer && p.apoyoCloser!==f.closer) return false;
  if(f.ter && p.nombreTerapeuta!==f.ter && p.bonoTerapeuta!==f.ter) return false;
  if(f.plat && p.medioPago!==f.plat) return false;
  if(f.mon && String(p.moneda||'').toUpperCase()!==f.mon) return false;
  if(f.tipo && p.tipoPago!==f.tipo) return false;
  return true;
}
function gvUniq(arr){ return [...new Set(arr.filter(x=>x!==undefined && x!==null && x!==''))]; }
function gvSel(id, label, opts, val){

function gvPieSVG(items, top, bottom){

  return {w:W, h:H, markup:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#ffffff"/><g transform="translate(20,${(H-200)/2})">${gvPieSVG(items,top,bottom)}</g>${leg}</svg>`};

function gvNiceMax(m){ return gvNice(Math.max(1,m)); }
function gvColsSVG(labels, series, o){   // columnas agrupadas (1 o más series)
  o = o || {}; const W = 680, H = 270, L = 54, R = 14, T = 16, B_ = 38, n = labels.length, ns = series.length;

  const y = v => T + (H-T-B_) * (1 - Math.max(0,v)/max), bandW = (W-L-R)/Math.max(1,n), gw = Math.min(46*ns, bandW*0.78), bw = gw/ns;

async function gvRaster(svg){   // SVG → PNG (data URL) para insertarlo en Excel / PDF
  const w = svg.w, h = svg.h, sc = 2;
  const url = URL.createObjectURL(new Blob([svg.markup], {type:'image/svg+xml;charset=utf-8'}));
  try{
    const img = new Image(); await new Promise((res,rej)=>{ img.onload = res; img.onerror = rej; img.src = url; });
    const c = document.createElement('canvas'); c.width = w*sc; c.height = h*sc; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- proyección de cobro de cartera ---------- */
let proyF = {horizonte:'12', prog:'', closer:'', inactivos:false};
function calcProyeccion(){
  const hoy = todayIso().slice(0,7), H = Math.max(1, parseInt(proyF.horizonte,10)||12), prog = proyF.prog || gvF.prog, closer = proyF.closer || gvF.closer, inact = proyF.inactivos || gvF.est==='INACTIVO';
  const cols = []; { let y = parseInt(hoy.slice(0,4),10), m = parseInt(hoy.slice(5,7),10)-1; for(let i=0;i<H;i++){ cols.push(finMonthKey(y,m)); m++; if(m>11){ m=0; y++; } } }
  const live = {};
  DB.payments.forEach(p=>{ if(!isLivePayment(p)) return; const c = calcPayment(p); const o = live[p.estudianteId] = live[p.estudianteId] || {}; o[c.corte.key] = (o[c.corte.key]||0) + c.valorUSD; });
  const rows = [];
  DB.students.forEach(s=>{
    if(!inact && (s.estado||'ACTIVO')!=='ACTIVO') return;
    if(prog && !tienePrograma(s,prog)) return;
    if(closer && s.closer!==closer) return;
    const TL = finTimeline(s), mm = finMonthMap(s, TL.keys), lv = live[s.id] || {};
    const pend = k => { const o = mm[k]; if(!o) return 0; return Math.max(0, parseNum(o.p) - (parseNum(o.r) + (lv[k]||0))); };
    let vencido = 0; TL.keys.forEach(k=>{ if(k<hoy) vencido += pend(k); });
    const vals = cols.map(k=>pend(k)), total = vals.reduce((a,b)=>a+b,0);
    if(total<=0.005 && vencido<=0.005) return;
    rows.push({s, vals, vencido, total, saldo: Math.max(0, studentTotals(s.id).saldo)});
  });
  rows.sort((a,b)=>(b.total+b.vencido)-(a.total+a.vencido) || String(a.s.nombre).localeCompare(String(b.s.nombre),'es'));
  const porMes = cols.map((k,i)=>rows.reduce((a,r)=>a+r.vals[i],0));
  const totalProy = porMes.reduce((a,b)=>a+b,0), totalVenc = rows.reduce((a,r)=>a+r.vencido,0);
  const saldoCartera = DB.students.filter(s=>(inact||(s.estado||'ACTIVO')==='ACTIVO') && (!prog||tienePrograma(s,prog)) && (!closer||s.closer===closer)).reduce((a,s)=>a+Math.max(0,totalsProg(s,prog).saldo),0);
  return {hoy, cols, rows, porMes, totalProy, totalVenc, saldoCartera};
}

/* ---------- Estado de cuenta por estudiante: compromiso de pago vs. valor pagado por mes ---------- */
/* Los estudiantes de Datos_Base sin mapa por mes (solo 12 meses sin año) corresponden al año de esa base. */
const EC_ANIO_DATOS_BASE = 2026;
function ecMonthMap(s){
  if(s.historicoMeses && typeof s.historicoMeses==='object') return s.historicoMeses;
  const out = {}, pr = Array.isArray(s.historicoPropuesto)?s.historicoPropuesto:[], re = Array.isArray(s.historicoReal)?s.historicoReal:[];
  for(let m=0;m<12;m++){ const a = parseNum(pr[m]), b = parseNum(re[m]); if(a||b) out[finMonthKey(EC_ANIO_DATOS_BASE, m)] = {p:a, r:b}; }
  return out;
}
let ecF = {desde:'', hasta:'', prog:'', closer:'', est:'', inactivos:false};
const EC_SIT = {
  cumplido:{t:'Cumplido', c:'#3f6b4a'}, mas:{t:'Pagó más del compromiso', c:'#2f8f8b'}, parcialV:{t:'Parcial · vencido', c:'#B5652E'},
  vencido:{t:'Vencido sin pago', c:'#a13d3d'}, actualOk:{t:'Mes actual · cumplido', c:'#3f6b4a'}, actualPend:{t:'Mes actual · pendiente', c:'#C9962C'},
  cubierto:{t:'Cubierto con pagos anteriores', c:'#2f8f8b'}, adelantado:{t:'Pagado por adelantado', c:'#2f8f8b'}, proyectado:{t:'Proyectado', c:'#4b3f73'}, sinComp:{t:'Pago sin compromiso', c:'#8a63b8'}
};
function ecSituacion(k, hoy, comp, pag, cub){
  const ok = pag + 0.005 >= comp;
  if(comp<=0.005) return pag>0.005 ? 'sinComp' : null;
  if(k<hoy) return pag>comp+0.005 ? 'mas' : ok ? 'cumplido' : pag>0.005 ? 'parcialV' : 'vencido';
  if(k===hoy) return ok ? 'actualOk' : 'actualPend';
  return ok ? 'adelantado' : 'proyectado';
}
/* Pagos que suman al "pagado" de cada mes: los mismos que cuenta el total pagado del estudiante (studentTotals),
   así la suma de los meses = total pagado de la ficha. */
function ecPagosDe(s){
  const hc = histCobrado(s), conHist = !!(s.historicoMatched || (s.historicoMeses && typeof s.historicoMeses==='object'));
  return DB.payments.filter(p=>p.estudianteId===s.id && p.fecha).filter(p=>!(p.origen==='legacy' && hc>0) && !(conHist && isStoredPayment(p)));
}
function ecCalc(f){
  f = f || ecF;
  const hoy = todayIso().slice(0,7), rows = [], resumen = [], pagosDet = [], meses = new Set();
  DB.students.forEach(s=>{
    if(!f.inactivos && f.est!=='INACTIVO' && (s.estado||'ACTIVO')!=='ACTIVO') return;
    if(f.est && (s.estado||'ACTIVO')!==f.est) return;
    if(f.prog && !tienePrograma(s, f.prog)) return;
    if(f.closer && s.closer!==f.closer) return;
    const TL = finTimeline(s), mm = ecMonthMap(s);
    const app = {}, pays = ecPagosDe(s);
    pays.forEach(p=>{ const c = calcPayment(p); app[c.corte.key] = (app[c.corte.key]||0) + c.valorUSD;
      if((!f.desde || c.corte.key>=f.desde) && (!f.hasta || c.corte.key<=f.hasta)) pagosDet.push({s, p, c}); });
    const keys = [...new Set([...Object.keys(mm), ...Object.keys(app)])].filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();
    const t = studentTotals(s.id);
    const compOf = k => parseNum((mm[k]||{}).p), pagOf = k => parseNum((mm[k]||{}).r) + (app[k]||0);
    const pagTotal = keys.reduce((a,k)=>a+pagOf(k),0), totalComp = keys.reduce((a,k)=>a+compOf(k),0);
    let compVenc = 0, compHoy = 0, pagHoy = 0; keys.forEach(k=>{ if(k<hoy) compVenc += compOf(k); if(k<=hoy){ compHoy += compOf(k); pagHoy += pagOf(k); } });
    const vencido = Math.max(0, compVenc - pagTotal);                          // cuotas de meses anteriores no cubiertas por lo pagado
    const futuro = Math.max(0, Math.max(0, totalComp - pagTotal) - vencido);    // mes actual + meses futuros aún sin cubrir
    let prox = null, acc = 0; for(const k of keys){ acc += compOf(k); if(k>=hoy && acc - pagTotal > 0.005){ prox = {k, v:Math.min(compOf(k), acc - pagTotal)}; break; } }
    let aC = 0, aP = 0, n = 0;
    const base = {id:s.id, nombre:s.nombre||'', programa:programasTxt(s), closer:gvName(s.closer), tutor:s.tutor?gvName(s.tutor):'', estado:s.estado||'ACTIVO', ingreso:TL.ingreso};
    keys.forEach(k=>{
      const comp = compOf(k), hist = parseNum((mm[k]||{}).r), ap = app[k]||0, pag = hist + ap;
      aC += comp; aP += pag;
      if(comp<=0.005 && pag<=0.005) return;
      if((f.desde && k<f.desde) || (f.hasta && k>f.hasta)) return;
      meses.add(k); n++;
      const sit = ecSituacion(k, hoy, comp, pag, aP + 0.005 >= aC);
      rows.push(Object.assign({}, base, {k, anio:parseInt(k.slice(0,4),10), mes:MESES_FULL[parseInt(k.slice(5,7),10)-1], comp, hist, app:ap, pag, dif:pag-comp, pend:Math.max(0, comp-pag), aC, aP, saldoAc:aC-aP, pct: comp>0.005 ? pag/comp : null, sit}));
    });
    if(!n && !(t.saldo>0.005 && !f.desde && !f.hasta)) return;
    resumen.push(Object.assign({}, base, {valorTotal:t.valorTotal, totalComp, totalPag:t.totalPagadoUSD, compHoy, pagHoy, vencido, futuro, saldo:t.saldo, avance:t.pctAvance, cumpl: compHoy>0.005 ? Math.min(pagHoy/compHoy, 9.99) : null, prox, sinPlan: totalComp<=0.005 && t.saldo>0.005, difPlan: totalComp>0.005 && Math.abs(totalComp - t.valorTotal)>1}));
  });
  const byName = (a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es');
  rows.sort((a,b)=>byName(a,b) || String(a.id).localeCompare(String(b.id)) || (a.k<b.k?-1:a.k>b.k?1:0));
  resumen.sort(byName);
  pagosDet.sort((a,b)=>byName(a.s,b.s) || (a.p.fecha<b.p.fecha?-1:1));
  const mesesArr = [...meses].sort();
  const porMes = mesesArr.map(k=>{ const r = rows.filter(x=>x.k===k); const comp = r.reduce((a,x)=>a+x.comp,0), pag = r.reduce((a,x)=>a+x.pag,0);
    return {k, comp, pag, dif:pag-comp, pend:r.reduce((a,x)=>a+x.pend,0), pct: comp>0.005 ? pag/comp : null, nComp:r.filter(x=>x.comp>0.005).length, nOk:r.filter(x=>x.comp>0.005 && x.pag+0.005>=x.comp).length, tipo: k<hoy?'Cerrado':k===hoy?'Mes actual':'Proyectado'}; });
  const tot = {comp:rows.reduce((a,x)=>a+x.comp,0), pag:rows.reduce((a,x)=>a+x.pag,0), venc:resumen.reduce((a,x)=>a+x.vencido,0), fut:resumen.reduce((a,x)=>a+x.futuro,0), saldo:resumen.reduce((a,x)=>a+Math.max(0,x.saldo),0)};
  return {hoy, rows, resumen, porMes, meses:mesesArr, pagosDet, tot};
}
function ecFiltrosTxt(f){
  f = f || ecF; const a = [];
  if(f.desde || f.hasta) a.push('Meses: '+(f.desde?gvMesLabel(f.desde):'inicio')+' a '+(f.hasta?gvMesLabel(f.hasta):'fin'));
  if(f.prog) a.push('Programa: '+f.prog); if(f.closer) a.push('Closer: '+gvName(f.closer));
  if(f.est) a.push('Estado: '+f.est); else if(f.inactivos) a.push('Incluye inactivos');
  return a.length ? a.join(' · ') : 'Todos los estudiantes activos · todos los meses';
}

  const USD = '"$"#,##0.00;[Red]-"$"#,##0.00;"–"', PCT = '0%';
  const L = n => { let s = ''; while(n>0){ const m = (n-1)%26; s = String.fromCharCode(65+m)+s; n = Math.floor((n-1)/26); } return s; };
  // cols: [{h, w, k|fn, t:'t'|'usd'|'pct'|'int', sum:true}]
  function sheet(name, title, sub, cols, data, opt){
    opt = opt || {};
    const ws = wb.addWorksheet(name, {views:[{state:'frozen', xSplit:opt.freezeCol||0, ySplit:6, showGridLines:false}]});
    ws.columns = cols.map(c=>({width:c.w||14}));
    const nc = cols.length;

    const shown = rows.slice(0,TIP_MAX).map(r=>`<tr><td>${r[0]}</td><td class="m">${r[1]||''}</td><td class="r">${r[2]||''}</td></tr>`).join('');
    const more = rows.length>TIP_MAX ? `<div class="tip-foot">+ ${rows.length-TIP_MAX} más…</div>` : '';
    return `<h5>${tipE(title)}</h5><table>${shown}</table>${more}${foot?`<div class="tip-foot">${foot}</div>`:''}`;
  };
  const stName = id=>{ const st = getStudent(id); return st ? st.nombre : '(estudiante no encontrado)'; };
  const pendList = DB.payments.filter(p=>p.pendienteRevision===true).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const fechaList = alarmas.filter(x=>x.a.nivel==='rojo'||x.a.nivel==='amarillo').sort((a,b)=>(a.a.dias||0)-(b.a.dias||0));
  const sinCloserList = DB.students.filter(s=>(s.estado||'ACTIVO')!=='INACTIVO' && !s.closer).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  const usrList = authRequired ? (DB.usuarios||[]).filter(u=>u.mustChange===true && u.activo!==false) : [];
  window.__gvAlTips = {
    pend: tipBuild('Pagos pendientes de revisión', pendList.map(p=>[tipE(stName(p.estudianteId)), tipE(fmtDate(p.fecha)), tipE(fmtUSDShort(calcPayment(p).valorUSD))]), 'No hay pagos por revisar', 'Clic para ir a Pagos'),
    fechas: tipBuild('Fechas de pago · '+alRojo+' vencida(s) · '+alAmar+' por vencer', fechaList.map(({s,a})=>[`${a.nivel==='rojo'?'🔴':'🟡'} ${tipE(s.nombre)}`, tipE(s.programa||''), tipE(a.txt)]), 'Todas las fechas de pago al día', 'Clic para ir a Estudiantes'),
    morosos: tipBuild('Activos con saldo y sin pago hace 60+ días', morosos.map(({s,t,d})=>[tipE(s.nombre), d===null?'Sin pagos':tipE(d+' días'), tipE(fmtUSDShort(t.saldo))]), 'Ningún estudiante en mora de 60+ días', morosos.length?('Saldo total: <b>'+tipE(fmtUSDShort(morosos.reduce((a,x)=>a+x.t.saldo,0)))+'</b>'):''),
    sincloser: tipBuild('Estudiantes activos sin closer', sinCloserList.map(s=>[tipE(s.nombre), tipE(s.programa||''), tipE(fmtUSDShort(studentTotals(s.id).saldo))+'<span class="muted" style="font-weight:400"> saldo</span>']), 'Todos los estudiantes activos tienen closer', 'Clic para ir a Estudiantes'),
    usuarios: tipBuild('Usuarios que no cambian su clave inicial', usrList.map(u=>[tipE(u.nombre||u.usuario||''), tipE(u.usuario||u.email||''), tipE(u.rol||'')]), 'Todos los usuarios ya cambiaron su clave', 'Clic para ir a Usuarios')
  };
  const al = (n,txt,nav,warn,tip)=>`<div class="gv-al ${warn?'gv-warn':'gv-ok'}" ${nav?`data-nav="${nav}"`:''} ${tip?`data-altip="${tip}"`:''}><b>${n}</b><span>${warn?'⚠ ':'✔ '}${txt}</span></div>`;
  const alCard = gvCard('alertas','🔔','Alertas para gestionar','Lo que requiere atención', `<div class="gv-alerts">${al(pendRev,'Pagos pendientes de revisión','payments',pendRev,'pend')}${al(alRojo+alAmar,'Fechas de pago: '+alRojo+' vencida(s) · '+alAmar+' por vencer ('+ALERTA_PAGO_DIAS+' días)','students',alRojo+alAmar,'fechas')}${al(morosos.length,'Activos con saldo y sin pago hace 60+ días'+(morosos.length?' · '+fmtUSDShort(morosos.reduce((a,x)=>a+x.t.saldo,0)):''),'',morosos.length,'morosos')}${al(sinCloser,'Estudiantes activos sin closer','students',sinCloser,'sincloser')}${authRequired?al(primerIngreso,'Usuarios que aún no cambian su clave inicial','usuarios',primerIngreso,'usuarios'):''}</div>${morosos.length?`<h4 class="gv-sub">Mayor saldo sin pagos recientes</h4>${gvTableHTML(Object.assign({},moTb,{rows:moTb.rows.slice(0,6),ids:moTb.ids.slice(0,6)}))}`:''}`, true);

  body.innerHTML = `
    ${kpiCard}
    <h2 class="gv-sec">Resultados del período</h2>
    <div class="gv-grid">${trendCard}</div>
    <h2 class="gv-sec">Análisis por indicador</h2>
    <div class="gv-grid">${pieCard}</div>
    <h2 class="gv-sec">Cartera por cobrar</h2>
    <div class="gv-grid"><div id="gvProy" class="gv-wide"></div>${baseCard}</div>
    <h2 class="gv-sec">Estado de cuenta por estudiante</h2>
    <div class="gv-grid"><div id="gvEC" class="gv-wide"></div></div>
    <h2 class="gv-sec">Seguimiento</h2>
    <div class="gv-grid">${alCard}</div>
    <p class="field-hint" style="margin-top:12px;">Cobrado, neto y comisiones respetan todos los filtros. La cartera y el saldo son acumulados y solo respetan los filtros de programa, estado, closer y terapeuta habitual. Mes = corte al último día del mes. Cada panel tiene sus botones ⬇ Excel y ⬇ PDF.</p>`;
  gvPieRender();
  renderProyeccion();
  renderEstadoCuenta();
}

function renderDatosBaseControl(list){
  const matched = (list||DB.students).filter(s=>s.historicoMatched);
  const valorInicial = matched.reduce((a,s)=>a+parseNum(s.historicoValorTotal),0);
  const cobradoHistorico = matched.reduce((a,s)=>a+histCobrado(s),0);
  const saldoHistorico = valorInicial - cobradoHistorico;
  const { propuesto, real: realBase } = monthlyHistoricoAggregate(matched);
  const live = livePaymentsByMonth(new Set((list||DB.students).map(s=>s.id)));
  const real = realBase.map((v,i)=>v+live[i]);
  const totalProp = propuesto.reduce((a,b)=>a+b,0), totalReal = real.reduce((a,b)=>a+b,0);
  return `
  <div class="grid grid-4">
    <div class="card kpi"><div class="bar"></div><div class="lbl">Valor inicial (apertura)</div><div class="val" style="font-size:22px;">${fmtUSDShort(valorInicial)}</div><div class="sub">${matched.length} estudiantes con histórico</div></div>
    <div class="card kpi k-green"><div class="bar"></div><div class="lbl">Cobrado histórico</div><div class="val" style="font-size:22px;">${fmtUSDShort(cobradoHistorico)}</div><div class="sub">Antes de esta app</div></div>
    <div class="card kpi k-clay"><div class="bar"></div><div class="lbl">Saldo pendiente histórico</div><div class="val" style="font-size:22px;">${fmtUSDShort(saldoHistorico)}</div></div>
    <div class="card kpi k-indigo"><div class="bar"></div><div class="lbl">% cumplimiento del año</div><div class="val" style="font-size:22px;">${totalProp>0?Math.round(totalReal/totalProp*100):0}%</div><div class="sub">Real vs. presupuesto mensual</div></div>
  </div>
  <div class="card" style="margin-top:16px;">
    <h3 style="font-size:15.5px; margin-bottom:12px;">Cobro Propuesto vs. Cumplimiento Real — mes a mes (Datos_Base)</h3>
    <div class="table-wrap" style="box-shadow:none; border:1px solid var(--border-soft);"><table>
      <thead><tr><th>Mes</th><th class="td-right">Propuesto</th><th class="td-right">Real</th><th class="td-right">Variación</th><th class="td-right">% Cumpl.</th></tr></thead>
      <tbody>
      ${MESES_FULL.map((mes,i)=>{
        const p = propuesto[i], r = real[i], v = r-p, pct = p>0? r/p*100 : (r>0?100:0);
        return `<tr><td>${mes}</td><td class="td-right num">${fmtUSDShort(p)}</td><td class="td-right num">${fmtUSDShort(r)}</td>
        <td class="td-right num" style="color:${v>=0?'var(--green)':'var(--clay)'};">${v>=0?'+':''}${fmtUSDShort(v)}</td>
        <td class="td-right num">${p>0?Math.round(pct)+'%':'—'}</td></tr>`;
      }).join('')}
      <tr style="background:var(--paper-deep); font-weight:700;"><td>▶ TOTAL AÑO</td><td class="td-right num">${fmtUSDShort(totalProp)}</td><td class="td-right num">${fmtUSDShort(totalReal)}</td>
      <td class="td-right num" style="color:${(totalReal-totalProp)>=0?'var(--green)':'var(--clay)'};">${fmtUSDShort(totalReal-totalProp)}</td><td class="td-right num">${totalProp>0?Math.round(totalReal/totalProp*100)+'%':'—'}</td></tr>
      </tbody>
    </table></div>
    <p class="field-hint" style="margin-top:8px;">Corte de facturación: último día de cada mes. "Real" = histórico de Datos_Base + todos los pagos registrados en la app (se actualiza solo al crear, editar, eliminar o importar pagos). "Propuesto" es el compromiso cargado por estudiante.</p>
  </div>`;
}
