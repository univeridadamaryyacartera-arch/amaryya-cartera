/* Guarda un archivo: en página publicada usa el permiso de descargas (el usuario confirma); si no, enlace de descarga. */
/* ---- Exportar la lista de Estudiantes (con los filtros que se ven) a Excel o PDF ---- */
function stExportData(){
  const E = window.__stExport;
  if(!E || !E.list || !E.list.length){ toast('No hay estudiantes con estos filtros para exportar.','err'); return null; }
  const nom = id => (getCloser(id)||{}).nombre || id || '';
  const alTxt = s => { const a = payAlarm(s); return a.nivel==='none'?'Sin saldo':a.nivel==='sin'?'Sin día de pago':a.txt; };
  const rows = E.list.map(({s,t,per})=>({ s, t, per, nombre:s.nombre, celular:s.celular||'', email:s.email||'', programa:programasTxt(s), closer:nom(s.closer), tutor:nom(s.tutor), ingreso:s.fechaIngreso||'',
    valor:t.valorTotal, pagado:t.totalPagadoUSD, saldo:t.saldo, estado:s.estado||'ACTIVO', dia:s.diaPago||'', prox:alTxt(s) }));
  const T = rows.reduce((a,r)=>({valor:a.valor+r.valor, pagado:a.pagado+r.pagado, saldo:a.saldo+r.saldo, per:a.per+(r.per||0)}),{valor:0,pagado:0,saldo:0,per:0});
  return {E, rows, T};
}
async function exportStudentsXlsx(){
  if(!ioNeedXLSX()) return;
  const D = stExportData(); if(!D) return;
  const {E, rows, T} = D;
  const head = ['Estudiante','Celular','Correo','Programa','Closer venta','Tutor','Fecha de ingreso','Valor total (USD)','Pagado (USD)'].concat(E.hayRango?['Pagado en el periodo (USD)']:[]).concat(['Saldo (USD)','Estado','Día de pago','Próximo pago']);
  const body = rows.map(r=>[r.nombre,r.celular,r.email,r.programa,r.closer,r.tutor,r.ingreso?fmtDate(r.ingreso):'',r.valor,r.pagado].concat(E.hayRango?[r.per]:[]).concat([r.saldo,r.estado,r.dia,r.prox]));
  const tot = ['TOTAL ('+rows.length+')','','','','','','',T.valor,T.pagado].concat(E.hayRango?[T.per]:[]).concat([T.saldo,'','','']);
  const aoa = [['AmarYYa · Estudiantes'],['Generado: '+fmtDate(todayIso())+' · Filtros: '+(E.filtros.length?E.filtros.join(' | '):'ninguno (todos los estudiantes)')],[],head,...body,tot];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = head.map((h,i)=>({wch: i===0?30 : i===2?28 : i===3?26 : 15}));
  ws['!freeze'] = {xSplit:1, ySplit:4}; ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:3,c:0},e:{r:3+rows.length,c:head.length-1}})};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Estudiantes');
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  if(await saveFile('amaryya_estudiantes_'+todayIso()+'.xlsx', new Blob([buf],{type:IO_XLSX_MIME}))) toast('✅ Excel exportado: '+rows.length+' estudiante(s) con los filtros actuales.','ok');
}
async function exportStudentsPdf(){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ toast('No se pudo cargar el generador de PDF. Revisa tu conexión a internet y recarga la página.','err'); return; }
  const D = stExportData(); if(!D) return;
  const {E, rows, T} = D;
  const n2 = v => Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  const doc = new J({orientation:'landscape', unit:'pt', format:'a4'});
  doc.setFontSize(15); doc.text('AmarYYa · Estudiantes', 40, 40);
  doc.setFontSize(9); doc.setTextColor(90);
  doc.text('Generado: '+fmtDate(todayIso())+' · '+rows.length+' estudiante(s)', 40, 56);
  const fTxt = 'Filtros: '+(E.filtros.length?E.filtros.join(' | '):'ninguno (todos los estudiantes)');
  doc.text(doc.splitTextToSize(fTxt, 760), 40, 69);
  const head = [['Estudiante','Programa','Closer','Tutor','Valor total','Pagado'].concat(E.hayRango?['Pagado periodo']:[]).concat(['Saldo','Estado','Día pago','Próximo pago'])];
  const body = rows.map(r=>[r.nombre,r.programa,r.closer,r.tutor,n2(r.valor),n2(r.pagado)].concat(E.hayRango?[n2(r.per)]:[]).concat([n2(r.saldo),r.estado,String(r.dia||''),r.prox]));
  const foot = [['TOTAL ('+rows.length+')','','','',n2(T.valor),n2(T.pagado)].concat(E.hayRango?[n2(T.per)]:[]).concat([n2(T.saldo),'','',''])];
  const rightCols = E.hayRango ? [4,5,6,7] : [4,5,6], colStyles = {}; rightCols.forEach(i=>{ colStyles[i] = {halign:'right'}; });
  doc.autoTable({ head, body, foot, startY: 88, styles:{fontSize:7.5, cellPadding:3}, headStyles:{fillColor:[74,59,107]}, footStyles:{fillColor:[236,230,246], textColor:20, fontStyle:'bold'}, columnStyles: colStyles, showFoot:'lastPage',
    didDrawPage: d=>{ doc.setFontSize(8); doc.setTextColor(120); doc.text('Página '+doc.internal.getNumberOfPages(), 40, doc.internal.pageSize.getHeight()-18); } });
  if(await saveFile('amaryya_estudiantes_'+todayIso()+'.pdf', doc.output('blob'))) toast('✅ PDF exportado: '+rows.length+' estudiante(s) con los filtros actuales.','ok');
}
async function saveFile(filename, data){
  if(dlClient && typeof dlClient.save === 'function'){
    try{ await dlClient.save({filename, data}); return true; }
    catch(e){
      const code = e && e.code;
      if(code==='declined'){ toast('Descarga cancelada.'); return false; }
      if(!['unavailable','extension_not_enabled','rejected_extension'].includes(code)){ toast('No se pudo guardar el archivo: '+((e&&e.message)||code||'error'),'err'); return false; }
      // si no hay descargas disponibles, intenta el enlace clásico
    }
  }
  try{

/* ---------- Conversores de celdas ---------- */
const ioPad = n => String(n).padStart(2,'0');
const ioNorm = s => String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,' ');
const ioText = v => v==null ? '' : String(v).trim();
const ioBlank = v => v==null || String(v).trim()==='';
function ioDate(v){            // → 'AAAA-MM-DD' | '' (vacío) | null (inválido)
  if(ioBlank(v)) return '';
  let y,m,d;
  if(typeof v==='number'){ const p = XLSX.SSF.parse_date_code(v); if(!p) return null; y=p.y; m=p.m; d=p.d; }
  else if(v instanceof Date){ y=v.getFullYear(); m=v.getMonth()+1; d=v.getDate(); }
  else {
    const t = String(v).trim(); let k = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(k){ y=+k[1]; m=+k[2]; d=+k[3]; }
    else { k = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!k) return null; d=+k[1]; m=+k[2]; y=+k[3]; }
  }
  const dt = new Date(y, m-1, d); if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return y+'-'+ioPad(m)+'-'+ioPad(d);
}
function ioTime(v){            // → 'HH:MM' | '' | null
  if(ioBlank(v)) return '';
  if(typeof v==='number'){ const mins = Math.round((v%1)*24*60); return ioPad(Math.floor(mins/60)%24)+':'+ioPad(mins%60); }
  const k = String(v).trim().match(/^(\d{1,2}):(\d{2})/); if(!k || +k[1]>23 || +k[2]>59) return null; return ioPad(+k[1])+':'+k[2];
}
function ioNum(v){             // → número | null (vacío) | NaN (inválido)
  if(ioBlank(v)) return null;
  if(typeof v==='number') return v;
  const t = String(v); if(!/\d/.test(t)) return NaN; return parseNum(t);
}
function ioPct(v){             // → fracción | null (vacío) | NaN (inválido)
  if(ioBlank(v)) return null;
  if(typeof v==='number') return v>=1 ? v/100 : v;
  const t = String(v).trim(); if(!/\d/.test(t)) return NaN;
  if(t.indexOf('%')!==-1) return parseNum(t.replace('%',''))/100;
  const n = parseNum(t); return n>=1 ? n/100 : n;
}
const ioYN = v => ['SI','SÍ','S','YES','Y','TRUE','1'].includes(ioNorm(v)) ? 'SI' : 'NO';

/* ---------- Lectura de la plantilla ---------- */
function ioParseWorkbook(wb){
  const out = {}, errors = [];
  Object.keys(IO_SHEETS).forEach(name=>{
    const sp = IO_SHEETS[name];
    const realName = wb.SheetNames.find(n=>ioNorm(n)===ioNorm(name));
    if(!realName){ out[name] = {present:false, rows:[]}; return; }
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[realName], {header:1, raw:true, defval:null, blankrows:true});
    const keys = sp.cols.map(c=>c[0]); const keyMap = {}; keys.forEach(k=>keyMap[ioNorm(k)] = k);
    let keyRow = -1, colIdx = {};
    for(let i=0; i<Math.min(aoa.length,10); i++){
      const idx = {}; let hits = 0;
      (aoa[i]||[]).forEach((v,j)=>{ const k = keyMap[ioNorm(v)]; if(k && !(k in idx)){ idx[k] = j; hits++; } });
      if(hits >= Math.max(2, Math.ceil(keys.length*0.6))){ keyRow = i; colIdx = idx; break; }
    }
    if(keyRow<0){ errors.push({hoja:name, fila:'-', msg:'No se encontró la fila de claves (fila 3). No cambies los encabezados de la plantilla.'}); out[name] = {present:true, rows:[], broken:true}; return; }
    sp.req.forEach(k=>{ if(!(k in colIdx)) errors.push({hoja:name, fila:keyRow+1, msg:'Falta la columna "'+k+'".'}); });
    const rows = [];
    for(let i=keyRow+2; i<aoa.length; i++){          // keyRow+1 = fila de ejemplo (se omite)
      const r = aoa[i] || []; const obj = {_row:i+1}; let any = false;
      Object.keys(colIdx).forEach(k=>{ if(IO_CALC.has(k)) return; const v = r[colIdx[k]]; obj[k] = v===undefined ? null : v; if(!ioBlank(v)) any = true; });
      if(!any) continue;
      if(typeof r[0]==='string' && ioNorm(r[0])==='TOTAL') continue;
      rows.push(obj);
    }
    out[name] = {present:true, rows};
  });
  return {sheets:out, errors};
}

/* ---------- Validación y armado de la carga ---------- */
function ioBuildImport(parsed, mode){
  const S = parsed.sheets; const errors = parsed.errors.slice(), warnings = [], counts = {};
  const clone = o => JSON.parse(JSON.stringify(o));
  const err = (h,f,m)=>{ errors.push({hoja:h,fila:f,msg:m}); cnt(h).errores++; };
  const warn = (h,f,m)=>warnings.push({hoja:h,fila:f,msg:m});
  const cnt = n => counts[n] = counts[n] || {leidas:0,nuevas:0,actualizadas:0,omitidas:0,errores:0};
  parsed.errors.forEach(e=>{ if(e.hoja) cnt(e.hoja).errores++; });
  const changed = {}; COLLECTIONS.forEach(c=>changed[c] = new Set());
  const final = {}, replaced = new Set();
  const mark = (col,item)=>changed[col].add(docIdFor(col,item));

  const merge = (col, existing, imported, c, keyOf, mkNew)=>{
    const byKey = new Map(existing.map(x=>[keyOf(x),x]));
    const result = mode==='replace' ? [] : existing.slice();
    imported.forEach(n=>{
      const ex = byKey.get(keyOf(n));
      if(ex){ const m = Object.assign({}, ex, n); if(mode==='replace') result.push(m); else result[result.indexOf(ex)] = m; c.actualizadas++; mark(col,m); }
      else { const it = Object.assign({}, mkNew(n), n); result.push(it); c.nuevas++; mark(col,it); }
    });
    if(mode==='replace') replaced.add(col);
    final[col] = result; return result;
  };

  /* ORDEN DE CARGA: 1 Programas · 2 Closers · 3 Plataformas · 4 TRM · 5 Estudiantes · 6 Histórico · 7 Pagos */
  /* Programas */
  let finalProg = DB.programas.map(clone);
  if(S.Programas.present && !S.Programas.broken){
    const c = cnt('Programas'), seen = new Set(), imp = [];
    S.Programas.rows.forEach(r=>{ c.leidas++;
      const nombre = ioText(r.nombre); if(!nombre){ err('Programas',r._row,'El nombre es obligatorio.'); return; }
      const nk = ioNorm(nombre); if(seen.has(nk)){ err('Programas',r._row,'Programa repetido: '+nombre+'.'); return; } seen.add(nk);
      const v = ioNum(r.valorReferencia); if(v!==null && (isNaN(v)||v<0)){ err('Programas',r._row,'Valor de referencia no válido.'); return; }
      let estado = ioNorm(r.estado)||'ACTIVO'; if(!['ACTIVO','INACTIVO'].includes(estado)){ warn('Programas',r._row,'Estado no válido; se usó ACTIVO.'); estado='ACTIVO'; }
      const sv = ioNum(r.sesiones); if(sv!==null && (isNaN(sv)||sv<0||sv>100||Math.round(sv)!==sv)){ err('Programas',r._row,'Sesiones personalizadas no válidas (entero de 0 a 100).'); return; }
      imp.push(Object.assign({nombre, descripcion:ioText(r.descripcion), valorReferencia:v||0, estado}, sv!==null ? {sesiones:sv} : {}));
    });
    finalProg = merge('programas', finalProg, imp, c, x=>ioNorm(x.nombre), n=>({id:slugId(n.nombre)}));
  }
  /* Closers */
  let finalClosers = DB.closers.map(clone);
  if(S.Closers.present && !S.Closers.broken){
    const c = cnt('Closers'), seen = new Set(), imp = [];
    S.Closers.rows.forEach(r=>{ c.leidas++;
      const nombre = ioText(r.nombre); if(!nombre){ err('Closers',r._row,'El nombre es obligatorio.'); return; }
      const nk = ioNorm(nombre); if(seen.has(nk)){ err('Closers',r._row,'Closer repetido: '+nombre+'.'); return; } seen.add(nk);
      if(ioYN(r.usuarioApp)==='SI' && !VAL_EMAIL.test(String(r.email||'').trim())){ err('Closers',r._row,'Usuario APP = SI requiere un email válido (será el usuario).'); return; }
      let estado = ioNorm(r.estado)||'ACTIVO'; if(!['ACTIVO','INACTIVO'].includes(estado)){ warn('Closers',r._row,'Estado "'+r.estado+'" no válido; se usó ACTIVO.'); estado='ACTIVO'; }
      imp.push({nombre, email:ioText(r.email), telefono:ioText(r.telefono), paisCiudad:ioText(r.paisCiudad), formaPago:ioText(r.formaPago), cuentaPago:ioText(r.cuentaPago), observacionesComision:ioText(r.observacionesComision), estado, esTerapeuta:ioYN(r.esTerapeuta), usuarioApp:ioYN(r.usuarioApp), rolApp:(['CLOSER','TERAPEUTA'].includes(ioNorm(r.rolApp))?ioNorm(r.rolApp):'')});
    });
    finalClosers = merge('closers', finalClosers, imp, c, x=>ioNorm(x.nombre), n=>({id:slugId(ioNorm(n.nombre))}));
  }
  /* Plataformas */
  let finalPlat = DB.platforms.map(clone);
  if(S.Plataformas.present && !S.Plataformas.broken){
    const c = cnt('Plataformas'), seen = new Set(), imp = [];
    S.Plataformas.rows.forEach(r=>{ c.leidas++;
      const nombre = ioText(r.nombre); if(!nombre){ err('Plataformas',r._row,'El nombre es obligatorio.'); return; }
      const nk = ioNorm(nombre); if(seen.has(nk)){ err('Plataformas',r._row,'Plataforma repetida: '+nombre+'.'); return; } seen.add(nk);
      const pct = ioPct(r.comisionPct); if(pct===null || isNaN(pct) || pct<0 || pct>1){ err('Plataformas',r._row,'El % de comisión es obligatorio y debe estar entre 0% y 100%.'); return; }
      imp.push({nombre, comisionPct:pct, paisMoneda:ioText(r.paisMoneda), tiempoAcreditacion:ioText(r.tiempoAcreditacion), cuenta:ioText(r.cuenta), observaciones:ioText(r.observaciones)});
    });
    finalPlat = merge('platforms', finalPlat, imp, c, x=>ioNorm(x.nombre), n=>({id:slugId(n.nombre)}));
  }
  /* TRM */
  if(S.TRM.present && !S.TRM.broken){
    const c = cnt('TRM'), seen = new Set(), imp = [];
    S.TRM.rows.forEach(r=>{ c.leidas++;
      const f = ioDate(r.fecha); if(!f){ err('TRM',r._row,'Fecha obligatoria y válida (AAAA-MM-DD).'); return; }
      if(seen.has(f)){ err('TRM',r._row,'Fecha repetida: '+f+'.'); return; } seen.add(f);
      const cop = ioNum(r.trmCOP), mxn = ioNum(r.trmMXN);
      if(cop===null||isNaN(cop)||cop<=0){ err('TRM',r._row,'TRM COP obligatoria y mayor que 0.'); return; }
      if(mxn===null||isNaN(mxn)||mxn<=0){ err('TRM',r._row,'TRM MXN obligatoria y mayor que 0.'); return; }
      imp.push({fecha:f, trmCOP:cop, trmMXN:mxn});
    });
    merge('trm', DB.trm.map(clone), imp, c, x=>x.fecha, n=>({}));
  }
  const closerId = (val,h,f,campo)=>{ const t = ioText(val); if(!t) return ''; const k = ioNorm(t); const m = finalClosers.find(c=>ioNorm(c.nombre)===k || ioNorm(c.id)===k); if(!m){ err(h,f,campo+': "'+t+'" no existe en Closers.'); return null; } return m.id; };

  /* Dependencias: lo que se necesita ya cargado (en la app o en este archivo) */
  const nRows = n => (S[n] && S[n].present && !S[n].broken) ? S[n].rows.length : 0;
  if(nRows('Estudiantes') && !finalClosers.length && S.Estudiantes.rows.some(r=>ioText(r.closer)||ioText(r.tutor))) err('Estudiantes','-','Primero deben existir los Closers: carga la hoja Closers (o súbela antes de Estudiantes).');
  if(nRows('Pagos') && !DB.students.length && !nRows('Estudiantes')) err('Pagos','-','Primero deben existir los Estudiantes: carga la hoja Estudiantes antes que Pagos.');
  if(nRows('Pagos') && !finalPlat.length && S.Pagos.rows.some(r=>ioText(r.medioPago))) err('Pagos','-','Primero deben existir las Plataformas: carga la hoja Plataformas antes que Pagos.');

  /* Estudiantes */
  let finalStu = DB.students.map(clone);
  const findStu = raw => { const t = ioText(raw); if(!t) return null; const k = t.toLowerCase();
    return finalStu.find(x=>x.id===t) || finalStu.find(x=>String(x.id).toLowerCase()===k) || finalStu.find(x=>String(x.email||'').trim().toLowerCase()===k) || null; };
  if(S.Estudiantes.present && !S.Estudiantes.broken){
    const c = cnt('Estudiantes'), seen = new Set(), imp = [];
    S.Estudiantes.rows.forEach(r=>{ c.leidas++;
      const f = r._row; const id = ioText(r.id) || String(ioText(r.email)||'').toLowerCase();
      if(!id){ err('Estudiantes',f,'El ID (correo del estudiante) es obligatorio.'); return; }
      if(!/^[A-Za-z0-9_\-.~:@+]+$/.test(id)){ err('Estudiantes',f,'ID "'+id+'" no válido (solo letras, números y - _ . ~ : @ +; sin espacios).'); return; }
      if(seen.has(id)){ err('Estudiantes',f,'ID repetido: '+id+'.'); return; } seen.add(id);
      const nombre = ioText(r.nombre); if(!nombre){ err('Estudiantes',f,'El nombre es obligatorio.'); return; }
      const vt = ioNum(r.valorTotal); if(vt===null||isNaN(vt)||vt<0){ err('Estudiantes',f,'Valor total (USD) obligatorio y mayor o igual a 0.'); return; }
      const progTxt = ioText(r.programa); const pg = finalProg.find(p=>ioNorm(p.nombre)===ioNorm(progTxt));
      let pgx = pg;
      if(progTxt && !pg){ const np = {id:slugId(progTxt), nombre:progTxt, descripcion:'', valorReferencia:0, sesiones:BONOS_MAX, estado:'ACTIVO'}; finalProg.push(np); final.programas = finalProg; mark('programas',np); cnt('Programas').nuevas++; warn('Estudiantes',f,'El programa "'+progTxt+'" no existía: se creó automáticamente en Programas.'); pgx = np; }
      const cl = closerId(r.closer,'Estudiantes',f,'Closer'); if(cl===null) return;
      const tu = closerId(r.tutor,'Estudiantes',f,'Tutor'); if(tu===null) return;
      const fn = ioDate(r.fechaNacimiento), fi = ioDate(r.fechaIngreso), hn = ioTime(r.horaNacimiento);
      if(fn===null){ err('Estudiantes',f,'Fecha de nacimiento no válida.'); return; }
      if(fi===null){ err('Estudiantes',f,'Fecha de ingreso no válida.'); return; }
      if(hn===null){ err('Estudiantes',f,'Hora de nacimiento no válida (HH:MM).'); return; }
      let estado = ioNorm(r.estado)||'ACTIVO'; if(!['ACTIVO','INACTIVO'].includes(estado)){ warn('Estudiantes',f,'Estado no válido; se usó ACTIVO.'); estado='ACTIVO'; }
      let signo = ioText(r.signo); if(signo && !SIGNOS.includes(signo)){ const m = SIGNOS.find(s=>ioNorm(s)===ioNorm(signo)); if(m) signo = m; else { warn('Estudiantes',f,'Signo "'+signo+'" no reconocido; se dejó vacío.'); signo=''; } }
      const dpv = ioNum(r.diaPago); if(dpv!==null && (isNaN(dpv)||dpv<1||dpv>31||Math.round(dpv)!==dpv)){ err('Estudiantes',f,'Día de pago no válido (entero de 1 a 31).'); return; }
      imp.push({id, nombre, celular:ioText(r.celular), email:ioText(r.email), paisCiudad:ioText(r.paisCiudad), closer:cl, tutor:tu, programa:pgx?pgx.nombre:'', acuerdoPago:ioBlank(r.acuerdoPago)?'':ioYN(r.acuerdoPago), valorTotal:vt, estado, fechaNacimiento:fn, horaNacimiento:hn, lugarNacimiento:ioText(r.lugarNacimiento), signo, redSocial:ioText(r.redSocial), comoConocio:ioText(r.comoConocio), fechaIngreso:fi, notasAdicionales:ioText(r.notasAdicionales), observaciones:ioText(r.observaciones), ...(dpv!==null?{diaPago:dpv}:{})});
    });
    finalStu = merge('students', finalStu, imp, c, x=>x.id, n=>({historicoValorTotal:0,historicoCobrado:0,historicoSaldo:0,historicoPropuesto:new Array(12).fill(0),historicoReal:new Array(12).fill(0),historicoMatched:false}));
  }
  /* Programas adicionales: reemplaza la lista de adicionales de cada estudiante que aparezca en la hoja */
  if(S.Programas_Adicionales && S.Programas_Adicionales.present && !S.Programas_Adicionales.broken){
    const c = cnt('Programas_Adicionales'), por = new Map();
    S.Programas_Adicionales.rows.forEach(r=>{ c.leidas++; const f = r._row;
      const st = findStu(r.estudiante_id); if(!st){ err('Programas_Adicionales',f,'El estudiante "'+ioText(r.estudiante_id)+'" no existe en Estudiantes. Cárgalo primero.'); return; }
      const pt = ioText(r.programa); if(!pt){ err('Programas_Adicionales',f,'El programa es obligatorio.'); return; }
      const pg = finalProg.find(x=>ioNorm(x.nombre)===ioNorm(pt)); if(!pg){ err('Programas_Adicionales',f,'El programa "'+pt+'" no existe en Programas. Agrégalo primero al catálogo.'); return; }
      const v = ioNum(r.valor); if(v===null||isNaN(v)||v<=0){ err('Programas_Adicionales',f,'El valor debe ser un número mayor que 0.'); return; }
      const fe = ioDate(r.fecha); if(fe===null){ err('Programas_Adicionales',f,'Fecha de la compra no válida (AAAA-MM-DD).'); return; }
      if(!por.has(st.id)) por.set(st.id, {st, list:[]});
      por.get(st.id).list.push({id:uid('A'), programa:pg.nombre, valor:v, fecha:fe||todayIso(), observaciones:ioText(r.observaciones), creado:todayIso()});
    });
    por.forEach(({st,list})=>{ st.adicionales = list; c.actualizadas += list.length; mark('students',st); });
    final.students = finalStu;
  }
  /* Histórico mensual */
  if(S.Historico_Mensual.present && !S.Historico_Mensual.broken){
    const c = cnt('Historico_Mensual'), seen = new Set();
    S.Historico_Mensual.rows.forEach(r=>{ c.leidas++;
      const id = ioText(r.estudiante_id); const f = r._row;
      const st = findStu(id);
      if(!id || !st){ err('Historico_Mensual',f,'El estudiante "'+id+'" no existe en Estudiantes'+(S.Estudiantes.present && cnt('Estudiantes').errores ? ' (la hoja Estudiantes tiene errores: corrígelos primero)' : '. Carga primero los estudiantes')+'.'); return; }
      if(seen.has(st.id)){ err('Historico_Mensual',f,'Estudiante repetido: '+id+'.'); return; } seen.add(st.id);
      const pr = [], re = []; let bad = false;
      IO_MESES.forEach(m=>{ const a = ioNum(r['propuesto_'+m]), b = ioNum(r['real_'+m]); if(isNaN(a)||isNaN(b)||(a!==null&&a<0)||(b!==null&&b<0)){ bad = true; } pr.push(a||0); re.push(b||0); });
      if(bad){ err('Historico_Mensual',f,'Hay montos mensuales no válidos (deben ser números ≥ 0).'); return; }
      const cobrado = re.reduce((x,y)=>x+y,0);
      Object.assign(st, {historicoMeses:null, historicoPropuesto:pr, historicoReal:re, historicoCobrado:cobrado, historicoValorTotal:parseNum(st.valorTotal), historicoSaldo:parseNum(st.valorTotal)-cobrado, historicoMatched:true});
      c.actualizadas++; mark('students',st);
    });
    final.students = finalStu;
  }
  /* Pagos */
  if(S.Pagos.present && !S.Pagos.broken){
    const c = cnt('Pagos'), imp = [];
    const sigOf = p => [p.fecha,p.estudianteId,p.pagoReal,p.moneda,p.closer||'',p.concepto||'',p.medioPago||''].join('|');
    const existingSigs = new Set(mode==='replace' ? [] : DB.payments.map(sigOf));
    let dup = 0;
    S.Pagos.rows.forEach(r=>{ c.leidas++; const f = r._row;
      const fecha = ioDate(r.fecha); if(!fecha){ err('Pagos',f,'Fecha obligatoria y válida (AAAA-MM-DD).'); return; }
      const sid = ioText(r.estudiante_id); const st = findStu(sid);
      if(!st){ err('Pagos',f,'El estudiante "'+sid+'" no existe en Estudiantes'+(S.Estudiantes.present && cnt('Estudiantes').errores ? ' (la hoja Estudiantes tiene errores y ese estudiante pudo no cargarse: corrígelos primero)' : '. Carga primero los estudiantes (el ID es su correo)')+'.'); return; }
      const monto = ioNum(r.pagoReal); if(monto===null||isNaN(monto)||monto<0){ err('Pagos',f,'El valor pagado es obligatorio (0 si es un pago interno sin ingreso).'); return; }
      const moneda = ioBlank(r.moneda) ? '' : normMoneda(r.moneda); if(!['USD','COP','MXN'].includes(moneda)){ err('Pagos',f,'Moneda obligatoria: USD, COP o MXN.'); return; }
      const pct = ioPct(r.comisionCloserPct); if(pct===null||isNaN(pct)||pct<0||pct>1){ err('Pagos',f,'El % de comisión del closer es obligatorio (0 si no aplica) y debe estar entre 0% y 100%.'); return; }
      const cl = closerId(r.closer,'Pagos',f,'Closer'); if(cl===null) return;
      let ap = closerId(r.apoyoCloser,'Pagos',f,'Apoyo Closer'); if(ap===null) return;
      let apPct = 0;
      if(ap){
        const q = ioPct(r.apoyoComisionPct); if(q===null||isNaN(q)||q<0||q>1){ err('Pagos',f,'El % de comisión del Apoyo Closer es obligatorio.'); return; }
        if(ap===cl){ err('Pagos',f,'El Apoyo Closer debe ser distinto del closer principal.'); return; }
        apPct = q;
      } else if(!ioBlank(r.apoyoComisionPct) && ioNum(r.apoyoComisionPct)){ warn('Pagos',f,'Hay % de apoyo sin Apoyo Closer; se ignoró.'); }
      const te = closerId(r.nombreTerapeuta,'Pagos',f,'Terapeuta'); if(te===null) return;
      const pt = ioNum(r.pagoTerapeuta); if(pt!==null && (isNaN(pt)||pt<0)){ err('Pagos',f,'Pago al terapeuta no válido.'); return; }
      const bo = ioNum(r.bonos); if(bo!==null && (isNaN(bo)||bo<0)){ err('Pagos',f,'Bono no válido.'); return; }
      const bl = ioNum(r.bolsillo); if(bl!==null && (isNaN(bl)||bl<0)){ err('Pagos',f,'Bolsillo no válido (número mayor o igual a 0).'); return; }
      let bt = closerId(r.bonoTerapeuta,'Pagos',f,'Terapeuta del bono'); if(bt===null) return;
      if(bo>0){
        if(!bt && te){ bt = te; warn('Pagos',f,'Bono sin terapeuta: se asignó al terapeuta de la sesión.'); }
        if(!bt){ err('Pagos',f,'El bono debe estar asociado a un terapeuta.'); return; }
        const tm = finalClosers.find(x=>x.id===bt); if(!tm || tm.esTerapeuta!=='SI'){ err('Pagos',f,'"'+(tm?tm.nombre:bt)+'" no está marcado como terapeuta en Closers.'); return; }
      } else { bt = ''; }
      let medio = ioText(r.medioPago);
      if(medio){ const pl = finalPlat.find(p=>ioNorm(p.nombre)===ioNorm(medio)); if(!pl){ err('Pagos',f,'Medio de pago "'+medio+'" no existe en Plataformas.'); return; } medio = pl.nombre; }
      let tg = ioText(r.tipoGestion); if(tg && !['Gestión Closer','Por Sesión','Ambos'].includes(tg)){ const m = ['Gestión Closer','Por Sesión','Ambos'].find(x=>ioNorm(x)===ioNorm(tg)); if(m) tg=m; else { warn('Pagos',f,'Tipo de gestión "'+tg+'" no reconocido; se dejó vacío.'); tg=''; } }
      let progPago = ioText(r.programa);
      if(progPago){ const pgm = finalProg.find(x=>ioNorm(x.nombre)===ioNorm(progPago)); const nombrePg = pgm ? pgm.nombre : progPago; const lista = [st.programa, ...adicionalesDe(st).map(a=>a.programa)].filter(Boolean).map(ioNorm); if(!lista.includes(ioNorm(nombrePg))){ err('Pagos',f,'El estudiante no tiene el programa "'+progPago+'". Agrégalo en la hoja Programas_Adicionales (o en su ficha) primero.'); return; } progPago = ioNorm(nombrePg)===ioNorm(st.programa) ? '' : nombrePg; }
      const am = anioMes({fecha});
      const p = {programa:progPago, fecha, estudianteId:st.id, estudianteNombre:st.nombre, closer:cl, tipoPago:ioText(r.tipoPago)||'Cuota mensual', concepto:ioText(r.concepto), tipoGestion:tg, pagoReal:monto, moneda, medioPago:medio, comisionCloserPct:pct, apoyoCloser:ap, apoyoComisionPct:apPct, pagoTerapeuta:pt||0, nombreTerapeuta:te, bonoTerapeuta:bt, bonos:bo||0, bolsillo:bl||0, consultaUnica:ioYN(r.consultaUnica), observaciones:ioText(r.observaciones), anio:am.anio, mes:am.mes};
      if(ioYN(r.incluidoEnHistorico)==='SI') p.origen = 'legacy'; else p.liveHist = true;   // los demás pagos se suman en vivo al Real mensual
      if(existingSigs.has(sigOf(p))){ dup++; c.omitidas++; return; }
      p.id = uid('P'); imp.push(p); c.nuevas++; mark('payments',p);
    });
    if(dup) warn('Pagos','-',dup+' pago(s) ya existían y se omitieron (mismos fecha, estudiante, monto, moneda, closer, concepto y medio).');
    final.payments = mode==='replace' ? imp : DB.payments.map(clone).concat(imp);
    if(mode==='replace') replaced.add('payments');
  }
  /* Avisos de consistencia */
  if(final.students && mode==='replace' && !final.payments){
    const ids = new Set(finalStu.map(s=>s.id)); const orph = DB.payments.filter(p=>!ids.has(p.estudianteId)).length;
    if(orph) warn('Estudiantes','-',orph+' pago(s) existentes quedarán sin estudiante. Incluye también la hoja Pagos o usa "Agregar y actualizar".');
  }
  if(final.students && !final.payments) final.students = finalStu;
  return {errors, warnings, counts, final, changed, replaced, mode};
}

/* ---------- Aplicar (escritura) ---------- */
async function ioApply(res, onProgress){
  let fails = 0;
  const ORDEN = ['programas','closers','platforms','trm','students','payments','bonos'];
  const cols = Object.keys(res.final).sort((a,b)=>{ const ia = ORDEN.indexOf(a), ib = ORDEN.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  for(const col of cols){
    const finalArr = res.final[col], old = DB[col] || [];
    DB[col] = finalArr;
    if(STORAGE_MODE==='db'){
      const keep = new Set(finalArr.map(x=>docIdFor(col,x)));
      const toDelete = res.replaced.has(col) ? old.filter(x=>!keep.has(docIdFor(col,x))) : [];
      const toWrite = res.replaced.has(col) ? finalArr : finalArr.filter(x=>res.changed[col] && res.changed[col].has(docIdFor(col,x)));
      if(typeof dbClient.batch==='function'){        // modo Google: lotes de hasta 200 registros
        const sets = toWrite.map(x=>({id:docIdFor(col,x), data:x})), dels = toDelete.map(x=>docIdFor(col,x));
        try{ for(let i=0;i<Math.max(sets.length,dels.length,1);i+=200){ await dbClient.batch(col, sets.slice(i,i+200), dels.slice(i,i+200)); if(onProgress) onProgress(col, Math.min(i+200,sets.length), sets.length); } }
        catch(e){ fails++; console.error('lote', col, e); }
        continue;
      }
      const jobs = [...toDelete.map(x=>({op:'del',x})), ...toWrite.map(x=>({op:'set',x}))];
      for(let i=0; i<jobs.length; i+=8){
        await Promise.all(jobs.slice(i,i+8).map(async j=>{
          try{ const ref = dbClient.doc(col+'/'+docIdFor(col,j.x)); if(j.op==='set') await ref.set(j.x); else await ref.delete(); }
          catch(e){ fails++; console.error('import write error', col, e); }
        }));
        if(onProgress) onProgress(col, Math.min(i+8,jobs.length), jobs.length);
      }
    } else if(STORAGE_MODE==='local'){ await storageSet('amaryya:'+col, finalArr); }
  }
  if(res.final.closers && STORAGE_MODE==='db' && authRequired){
    for(const c of res.final.closers){ try{ const r = await authSyncCloserUser(c); if(r.error){ fails++; console.error('usuario APP', c.nombre, r.error); } }catch(e){ fails++; console.error('usuario APP', e); } }
  }
  return fails;
}

/* ---------- Pantalla de revisión ---------- */
function ioShowReport(res, fileName, opts){
  opts = opts || {};
  const hojas = Object.keys(res.counts);
  const totErr = res.errors.length;
  const tot = hojas.reduce((a,h)=>({n:a.n+res.counts[h].nuevas,u:a.u+res.counts[h].actualizadas}),{n:0,u:0});
  const html = `
  <div class="modal wide">
    <div class="modal-head"><h3>${opts.title||'Revisión de la carga'} · ${escapeHtml(fileName||'')}</h3><button class="x-close" data-action="close-modal">×</button></div>
    <div class="modal-body">
      <div class="table-wrap"><table>
        <thead><tr><th>Hoja</th><th class="td-right">Filas leídas</th><th class="td-right">Nuevas</th><th class="td-right">Actualizadas</th><th class="td-right">Omitidas</th><th class="td-right">Errores</th></tr></thead>
        <tbody>${hojas.map(h=>{ const c=res.counts[h]; return `<tr><td><b>${escapeHtml(h)}</b></td><td class="td-right num">${c.leidas}</td><td class="td-right num">${c.nuevas}</td><td class="td-right num">${c.actualizadas}</td><td class="td-right num">${c.omitidas}</td><td class="td-right num" style="color:${c.errores?'var(--red)':'var(--green)'}; font-weight:700;">${c.errores}</td></tr>`; }).join('') || '<tr class="empty-row"><td colspan="6">El archivo no contiene hojas reconocidas (Closers, Plataformas, Programas, TRM, Estudiantes, Historico_Mensual, Pagos).</td></tr>'}</tbody>
      </table></div>
      ${totErr?`<h4 style="margin:16px 0 6px; color:var(--red);">❌ ${totErr} error(es): corrígelos en el Excel y vuelve a cargar el archivo</h4>
        <div style="max-height:200px; overflow:auto; font-size:12.5px; border:1px solid var(--border); border-radius:8px; padding:8px 12px;">${res.errors.slice(0,150).map(e=>`<div style="padding:2px 0;"><b>${escapeHtml(e.hoja)}</b> · fila ${escapeHtml(e.fila)}: ${escapeHtml(e.msg)}</div>`).join('')}${totErr>150?`<div class="muted">… y ${totErr-150} más.</div>`:''}</div>`:`<p style="margin-top:14px; color:var(--green); font-weight:600;">✅ Sin errores. ${tot.n} registro(s) nuevo(s) y ${tot.u} actualizado(s).</p>`}
      ${res.warnings.length?`<h4 style="margin:16px 0 6px;">⚠️ ${res.warnings.length} aviso(s)</h4><div style="max-height:130px; overflow:auto; font-size:12.5px; border:1px solid var(--border-soft); border-radius:8px; padding:8px 12px;">${res.warnings.slice(0,100).map(e=>`<div style="padding:2px 0;"><b>${escapeHtml(e.hoja)}</b> · fila ${escapeHtml(e.fila)}: ${escapeHtml(e.msg)}</div>`).join('')}</div>`:''}
      ${res.mode==='replace'?`<p class="field-hint" style="margin-top:12px;">⚠️ Modo reemplazo: las hojas incluidas en el archivo reemplazan por completo los datos actuales de esa hoja.</p>`:''}
      <label style="display:flex; gap:8px; align-items:center; margin-top:14px; font-weight:600;"><input type="checkbox" id="ioBackup" checked style="width:auto; min-height:0;"> Descargar una copia de seguridad (JSON) antes de aplicar</label>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="button" class="btn btn-gold" id="ioGo" ${totErr||!hojas.length?'disabled':''}>${opts.goLabel||'Importar'}</button></div>
  </div>`;
  showModal(html);
  const go = document.getElementById('ioGo');
  if(go) go.addEventListener('click', ()=>{
    const wantBackup = document.getElementById('ioBackup').checked;
    const run = async ()=>{
      if(wantBackup) await exportData();
      showModal(`<div class="modal"><div class="modal-body" style="text-align:center; padding:30px;"><div style="font-size:30px;">⏳</div><p id="ioProg">Aplicando cambios…</p></div></div>`);
      const fails = await ioApply(res, (col,i,n)=>{ const el=document.getElementById('ioProg'); if(el) el.textContent='Guardando '+col+': '+i+' de '+n+'…'; });
      closeModal();
      toast(fails ? '⚠️ Carga terminada con '+fails+' registro(s) que no se pudieron guardar. Revisa y repite.' : '✅ '+(opts.doneMsg||'Importación completada')+'.', fails?'err':'ok');
      pendingRender = false; go_after_import();
    };
    if(opts.confirmMsg){ closeModal(); confirmAction(opts.confirmMsg, run); } else run();
  });
}
function go_after_import(){ currentStudentId = null; renderNav(); renderView(); }

function ioRunImportWorkbook(wb, mode, fileName){
  const parsed = ioParseWorkbook(wb);
  const res = ioBuildImport(parsed, mode);
  ioShowReport(res, fileName, {title:'Revisión de la carga', goLabel:'Importar', confirmMsg: mode==='replace' ? 'Las hojas incluidas en el archivo REEMPLAZARÁN los datos actuales de esas hojas'+(STORAGE_MODE==='db'?' para TODO el equipo':'')+'. ¿Continuar?' : null});
  return res;
}
async function ioImportFromInput(){
  if(!ioNeedXLSX()) return;
  const inp = document.getElementById('ioFile'); const f = inp && inp.files && inp.files[0];
  if(!f){ toast('Primero elige el archivo Excel (.xlsx).','err'); return; }
  let wb; try{ wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); }catch(e){ toast('No se pudo leer el archivo: '+((e&&e.message)||'formato no válido'),'err'); return; }
  ioRunImportWorkbook(wb, document.getElementById('ioMode').value, f.name);
}

/* ---------- Restaurar copia JSON ---------- */
function ioRunRestore(data, fileName){
  const errors = [], counts = {}, final = {}, replaced = new Set();
  if(!data || typeof data!=='object' || Array.isArray(data)) errors.push({hoja:'JSON',fila:'-',msg:'El archivo no es una copia de seguridad de la app.'});
  else {
    let any = false;
    COLLECTIONS.forEach(col=>{
      if(col==='usuarios' || col==='solicitudes' || col==='config' || col==='credenciales' || data[col]===undefined) return; any = true;
      if(!Array.isArray(data[col])){ errors.push({hoja:col,fila:'-',msg:'Debe ser una lista.'}); return; }
      let bad = 0; data[col].forEach((x,i)=>{ const ok = x && typeof x==='object' && (col==='trm' ? x.fecha : x.id); if(!ok){ bad++; if(bad<=5) errors.push({hoja:col,fila:i+1,msg:col==='trm'?'Falta "fecha".':'Falta "id".'}); } });
      counts[col] = {leidas:data[col].length, nuevas:data[col].length, actualizadas:0, omitidas:0, errores:bad};
      final[col] = data[col]; replaced.add(col);
    });
    if(!any) errors.push({hoja:'JSON',fila:'-',msg:'No contiene ninguna colección (students, payments, closers, platforms, trm, programas).'});
  }
  const res = {errors, warnings:[], counts, final, changed:{}, replaced, mode:'replace'};
  ioShowReport(res, fileName, {title:'Restaurar copia de seguridad', goLabel:'Restaurar', doneMsg:'Copia restaurada', confirmMsg:'La copia REEMPLAZARÁ por completo los datos actuales'+(STORAGE_MODE==='db'?' de TODO el equipo':'')+'. ¿Continuar?'});
  return res;
}
async function ioRestoreFromInput(){
  const inp = document.getElementById('ioJson'); const f = inp && inp.files && inp.files[0];
  if(!f){ toast('Primero elige el archivo de copia de seguridad (.json).','err'); return; }
  let data; try{ data = JSON.parse(await f.text()); }catch(e){ toast('El archivo no es un JSON válido.','err'); return; }
  ioRunRestore(data, f.name);
}

/* ---------- Cifrado de contraseñas (PBKDF2-SHA256 con sal; nunca se guarda la contraseña) ---------- */
function authB64(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function authUnB64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
async function authHash(password, saltB64){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:authUnB64(saltB64), iterations:AUTH_ITER, hash:'SHA-256'}, key, 256);
  return authB64(bits);
}
const authNewSalt = () => authB64(crypto.getRandomValues(new Uint8Array(16)));
function authTempPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(12)), x=>chars[x%chars.length]).join('');
}

/* ---------- Alcance de datos por rol ("ver solo lo mío") ---------- */
function authInvolves(p, me){ return !!me && (p.closer===me || p.apoyoCloser===me || p.nombreTerapeuta===me || p.bonoTerapeuta===me); }
function scopeCollection(col, arr){
  if(!authRequired || !currentUser || isAdminLevel(currentUser.rol)) return arr;
  const me = myCloserId(), meUser = currentUser.id;
  if(col==='usuarios' || col==='solicitudes' || col==='config' || col==='credenciales') return [];
  if(col==='bonos') return currentUser.rol==='TERAPEUTA' ? arr : [];   // todos los terapeutas ven todas las sesiones (solo editan las suyas pendientes)
  if(col==='closers') return arr.map(c=> c.id===me ? c : Object.assign({}, c, {email:'',telefono:'',formaPago:'',cuentaPago:'',observacionesComision:''}));
  const allStu = DB_ALL.students || [], allPay = DB_ALL.payments || [];
  const mine = new Set(allStu.filter(s=>me && (s.closer===me || s.tutor===me)).map(s=>s.id));
  const involved = new Set(allPay.filter(p=>authInvolves(p,me)).map(p=>p.estudianteId));
  if(col==='students') return currentUser.rol==='CLOSER' ? arr.filter(s=>me && s.closer===me) : arr.filter(s=>mine.has(s.id) || involved.has(s.id));
  if(col==='payments') return arr.filter(p=>authInvolves(p,me) || mine.has(p.estudianteId) || p.registradoPor===meUser);
  return arr;
}
function rescopeAll(){ COLLECTIONS.forEach(c=>{ if(DB_ALL[c]) DB[c] = scopeCollection(c, DB_ALL[c]); }); }
const visibleClosers = () => (authRequired && !isAdmin()) ? DB.closers.filter(c=>c.id===myCloserId()) : DB.closers;

/* ---------- Permisos de acciones ---------- */
function authAllowsAction(a, el){
  if(!authRequired || isAdmin()) return true;
  if(a==='new-student') return isCloserRole();
  if(a==='edit-student'){ const st = DB.students.find(x=>x.id===(el && el.dataset.id)); return isCloserRole() && !!st && st.closer===myCloserId(); }
  if(a==='new-adicional' || a==='edit-adicional' || a==='delete-adicional'){ const st = DB.students.find(x=>x.id===(el && el.dataset.id)); return isCloserRole() && !!st && st.closer===myCloserId() && a!=='delete-adicional'; }
  if(a==='new-payment-prog') return isCloserRole();
  if(a==='new-bono') return isTerapeutaRole();
  if(a==='edit-bono'){ if(!isTerapeutaRole()) return false; const b = (DB.bonos||[]).find(x=>x.id===(el&&el.dataset.id)); return !!b && b.terapeutaId===myCloserId() && b.estado!=='PAGADO'; }
  if(ADMIN_ACTIONS.has(a)) return false;
  if(a==='new-payment' || a==='new-payment-for') return isCloserRole();
  if(a==='edit-payment'){
    if(!isCloserRole()) return false;
    const p = DB.payments.find(x=>x.id===(el && el.dataset.id));
    return !!p && p.registradoPor===currentUser.id && p.pendienteRevision===true;
  }
  if(a==='delete-payment') return false;
  return true;
}
function navAllowed(id){
  if(id==='gerencial') return !authRequired || isAdmin();
  if(id==='dashboard') return !isAdmin();
  if(id==='usuarios') return authRequired && isAdmin();
  if(id==='bonos') return !authRequired || isAdmin() || (!!currentUser && currentUser.rol==='TERAPEUTA');
  if(!authRequired || isAdmin()) return true;
  return !['closers','settings','platforms','programas','trm'].includes(id);
}

/* Quita controles de edición y columnas de márgenes de la empresa para roles sin permiso. */
function authRemoveColumn(table, idx){
  table.querySelectorAll('tr').forEach(tr=>{
    let col = 0;
    for(const cell of Array.from(tr.children)){
      const span = cell.colSpan || 1;
      if(idx>=col && idx<col+span){ if(span>1) cell.colSpan = span-1; else cell.remove(); break; }
      col += span;
    }
  });
}
function enforceRole(){
  if(!authRequired || !currentUser || isAdmin()) return;
  const app = document.getElementById('app'); if(!app) return;
  app.querySelectorAll('[data-action]').forEach(el=>{ if(!authAllowsAction(el.dataset.action, el)) el.remove(); });
  if(!isCloserRole()){
    app.querySelectorAll('#compForm input, #compForm select, #compForm textarea').forEach(i=>{ i.disabled = true; });
    app.querySelectorAll('#compForm button[type=submit]').forEach(b=>b.remove());
  }
  app.querySelectorAll('.hist-input').forEach(i=>{ i.readOnly = true; });
  app.querySelectorAll('#content .card, #content .kpi').forEach(c=>{
    if(!c.isConnected) return;
    if(/Neto AmarYYa|Neto tras ahorro|Neto final|Neto Universidad|Ahorro \(10%\)|Bolsillo|Comisión plataformas|Total del período/i.test(c.textContent) && !c.querySelector('table')) c.remove();
  });
  app.querySelectorAll('#content table').forEach(t=>{
    const ths = Array.from(t.querySelectorAll('thead tr:first-child th'));
    for(let i=ths.length-1;i>=0;i--){ if(/Neto|Ahorro|Bolsillo|Plataf/i.test(ths[i].textContent)) authRemoveColumn(t, i); }
  });
  app.querySelectorAll('#content .field-hint').forEach(h=>{ if(/Neto AmarYYa =|Bolsillo|ahorro del 10%/i.test(h.textContent)) h.remove(); });
  app.querySelectorAll('#content .section-title h3').forEach(h=>{ if(/Resultado/.test(h.textContent)){ const st = h.closest('.section-title'); const nx = st && st.nextElementSibling; if(nx && nx.classList.contains('card')) nx.remove(); } });
}
function authStartObserver(){
  if(authObserver) return;
  authObserver = new MutationObserver(()=>{ try{ enforceRole(); }catch(e){} });
  authObserver.observe(document.getElementById('app'), {childList:true, subtree:true});
}

/* La solicitud solo guarda el nombre de usuario; no revela si el usuario existe. */
async function authRequestReset(usuario){
  usuario = normEmail(usuario);
  if(!VAL_EMAIL.test(usuario)) return {ok:false, msg:'Escribe un correo válido (nombre@dominio.com).'};
  const u = (DB_ALL.usuarios||[]).find(x=>ioNorm(x.usuario)===ioNorm(usuario) && x.activo!==false);
  const neutral = 'Si el correo está registrado, un administrador verá tu solicitud y te entregará una contraseña nueva.';
  if(!u) return {ok:true, msg:neutral};
  try{ await dbClient.doc('solicitudes/'+slugId('R-'+u.usuario)).set({id:slugId('R-'+u.usuario), usuario:u.usuario, usuarioId:u.id, fecha:new Date().toISOString(), estado:'PENDIENTE'}); return {ok:true, msg:neutral}; }
  catch(e){ return {ok:false, msg:'No fue posible enviar la solicitud desde tu cuenta (acceso de solo lectura). Pídele a un administrador que restablezca tu contraseña.'}; }
}

async function authTryLogin(usuario, password){
  if(Date.now() < authLockUntil) return {ok:false, msg:'Demasiados intentos. Espera 30 segundos e inténtalo de nuevo.'};
  const u = (DB_ALL.usuarios||[]).find(x=>ioNorm(x.usuario)===ioNorm(usuario));
  const fail = ()=>{ authFails++; if(authFails>=5){ authLockUntil = Date.now()+30000; authFails = 0; } return {ok:false, msg:'Usuario o contraseña incorrectos.'}; };
  if(!u || u.activo===false){ await authHash(password||'x', authNewSalt()); return fail(); }   // mismo tiempo de respuesta
  if(await authHash(password, u.salt) !== u.hash) return fail();
  authFails = 0; return {ok:true, user:u};
}
function authSaveSession(u, remember){
  const v = JSON.stringify({id:u.id, h:u.hash});
  try{ sessionStorage.removeItem('amaryya:session'); localStorage.removeItem('amaryya:session'); }catch(e){}
  try{ (remember ? localStorage : sessionStorage).setItem('amaryya:session', v); }catch(e){}
}
function authClearSession(){ try{ sessionStorage.removeItem('amaryya:session'); localStorage.removeItem('amaryya:session'); }catch(e){} }
function authLoadSession(){
  try{
    const s = JSON.parse(sessionStorage.getItem('amaryya:session') || localStorage.getItem('amaryya:session') || 'null'); if(!s) return null;
    return (DB_ALL.usuarios||[]).find(x=>x.id===s.id && x.hash===s.h && x.activo!==false) || null;
  }catch(e){ return null; }
}
/* Contraseña temporal: la persona debe cambiarla antes de entrar a la app. */
function authShowChangePass(u, msg){
  authHideApp(true);
  authScreen(`<h3>Cambia tu contraseña</h3>
    <p class="muted" style="margin:6px 0 10px; font-size:13px;">Hola <b>${escapeHtml(u.nombre)}</b>. Por seguridad debes crear una contraseña propia antes de continuar.</p>
    <form id="authChgForm" autocomplete="off">
      <label>Nueva contraseña (mínimo 8 caracteres)</label><input type="password" id="chPass" required minlength="8" autocomplete="new-password">
      <label style="margin-top:8px;">Confirmar nueva contraseña</label><input type="password" id="chPass2" required autocomplete="new-password">
      <div id="authMsg" class="auth-msg">${msg?escapeHtml(msg):''}</div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">Guardar y entrar</button>
    </form>
    <p style="margin-top:12px; text-align:center;"><a href="#" id="authChgOut" style="color:var(--gold-deep); font-weight:600; font-size:13px;">Cancelar y salir</a></p>`);
  document.getElementById('authChgOut').addEventListener('click', e=>{ e.preventDefault(); authLogout(''); });
  document.getElementById('authChgForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const p1 = document.getElementById('chPass').value, p2 = document.getElementById('chPass2').value, m = document.getElementById('authMsg');
    if(p1.length<8){ m.textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
    if(/^(\d)\1+$/.test(p1) || /^(0123456789|123456789|12345678|password|contraseña)$/i.test(p1)){ m.textContent = 'Esa contraseña es demasiado fácil de adivinar. Elige otra.'; return; }
    if(p1!==p2){ m.textContent = 'Las contraseñas no coinciden.'; return; }
    if(await authHash(p1, u.salt) === u.hash){ m.textContent = 'La nueva contraseña debe ser diferente de la temporal.'; return; }
    const salt = authNewSalt();
    const nu = Object.assign({}, u, {salt, hash: await authHash(p1, salt), mustChange:false, cambioClave:todayIso()});
    const saved = STORAGE_MODE==='db' ? await authSaveCred(nu) : await saveEntity('usuarios', nu);
    if(saved===false){ m.textContent = 'No se pudo guardar tu nueva contraseña. Verifica tu conexión o pide a un administrador que revise tu acceso e inténtalo de nuevo.'; return; }
    try{                                  // comprobación: lo guardado debe ser la contraseña nueva
      if(STORAGE_MODE==='db'){ const back = await dbClient.doc('credenciales/'+docIdFor('credenciales',nu)).get(); const bd = back && (typeof back.data==='function' ? back.data() : back); if(bd && bd.hash!==nu.hash){ m.textContent = 'La contraseña no quedó guardada (la base rechazó el cambio). Pide a un administrador que revise tu acceso.'; return; } }
    }catch(e){ /* si no se puede releer, se confía en el guardado */ }
    [DB_ALL.usuarios, DB.usuarios].forEach(arr=>{ if(arr){ const i = arr.findIndex(x=>x.id===nu.id); if(i>=0) arr[i] = nu; } });
    await authEnter(nu, false, false);
  });
}
async function authEnter(u, silent, remember){
  if(u.mustChange === true){ authClearSession(); authShowChangePass(u); return; }
  currentUser = {id:u.id, nombre:u.nombre, usuario:u.usuario, rol:u.rol, closerId:u.closerId||'', hash:u.hash};
  if(!silent) authSaveSession(u, !!remember);
  rescopeAll();
  authRoot().innerHTML = ''; authHideApp(false);
  authStartObserver();
  await authCheckPlatformLevel();
  renderNav();
  go(homeView());
  if(isAdmin()) authSyncPending();
  enforceRole();
}
function authLogout(msg){
  if(GAS_MODE){ gasSignOut(); return; }
  currentUser = null; authClearSession();
  COLLECTIONS.forEach(c=>{ if(DB_ALL[c]) DB[c] = DB_ALL[c]; });
  authShowLogin(msg||'');
}
/* Revisa que el nivel de acceso de Claude coincida con el rol (los permisos de escritura los impone la base de datos). */
async function authCheckPlatformLevel(){
  let warn = '';
  try{
    if(dbUser){
      if(isAdminLevel(currentUser.rol) && typeof dbUser.canEdit==='function' && (await dbUser.canEdit())===false) warn = 'Tu rol es Administrador, pero tu acceso en Claude no es de Editor: no podrás guardar cambios. Pide al propietario que te comparta el artifact como Editor.';
      if(currentUser.rol==='CLOSER' && typeof dbUser.can==='function' && (await dbUser.can('data.write'))===false) warn = 'Tu acceso en Claude es de solo lectura, así que no podrás registrar pagos. Pide a un administrador que te comparta el artifact como Contributor.';
    }
  }catch(e){}
  authBanner(warn);
}
function authBanner(text){
  let b = document.getElementById('authBanner');
  if(!b){ b = document.createElement('div'); b.id = 'authBanner'; const main = document.querySelector('.main'); const top = document.querySelector('.topbar'); main.insertBefore(b, top.nextSibling); }
  b.className = text ? 'auth-banner' : ''; b.textContent = text || '';
}
async function authInit(){
  authRequired = (STORAGE_MODE==='db');
  if(!authRequired) return true;
  authHideApp(true);
  if(GAS_MODE){
    await authEnter(Object.assign({}, gasMe, {mustChange:false}), true);
    gasReady = true; gasStartRefresh(); schedulePublish();
    return false;
  }
  const users = DB_ALL.usuarios || [];
  if(!users.length){
    let canBoot = true;
    try{ if(dbUser && typeof dbUser.canEdit==='function') canBoot = !!(await dbUser.canEdit()); }catch(e){}
    if(canBoot) authShowBootstrap();
    else authShowBlocked('Aún no hay usuarios configurados. El propietario o un Editor del artifact debe ingresar primero y crear a los administradores.');
    return false;
  }
  const s = authLoadSession();
  if(s){ await authEnter(s, true); return false; }
  authShowLogin();
  return false;
}
/* Cambios en la tabla de usuarios hechos por otro administrador: cerrar sesión si ya no es válida. */
function authOnUsersChanged(){
  if(!authRequired || !currentUser || GAS_MODE) return;
  const u = (DB_ALL.usuarios||[]).find(x=>x.id===currentUser.id);
  if(u && u.activo!==false && !u.hash) return;            // la clave aún no llegó de la base: se espera la siguiente actualización
  if(!u || u.activo===false || u.hash!==currentUser.hash){ authLogout('Tu acceso cambió. Vuelve a ingresar.'); return; }
  if(u.rol!==currentUser.rol || (u.closerId||'')!==currentUser.closerId){ currentUser.rol = u.rol; currentUser.closerId = u.closerId||''; rescopeAll(); renderNav(); renderView(); }
}
/* Pagos pendientes creados con la versión anterior: pasan a calcularse en vivo (no hace falta tocar al estudiante). */
async function authSyncPending(){
  if(authSyncing || !isAdmin()) return;
  const pend = (DB_ALL.payments||DB.payments).filter(p=>p.pendienteSync===true);
  if(!pend.length) return;
  authSyncing = true;
  try{ for(const p of pend){ p.pendienteSync = false; p.liveHist = true; await saveEntity('payments', p); } }
  finally{ authSyncing = false; }
}

/* ---------- Usuario APP en la hoja de Closers y terapeutas ---------- */
const AUTH_INIT_PASS = '123456_UAYYa';      // contraseña inicial estándar; se guarda cifrada y el cambio es obligatorio al primer ingreso
function authAppRole(c){ return c.rolApp==='TERAPEUTA' || c.rolApp==='CLOSER' ? c.rolApp : (c.esTerapeuta==='SI' ? 'TERAPEUTA' : 'CLOSER'); }
function authUserOfCloser(c){ return (DB_ALL.usuarios||DB.usuarios||[]).find(u=>u.closerId===c.id && !isAdminLevel(u.rol)) || null; }
function authAddLocalUser(u){
  [DB_ALL.usuarios, DB.usuarios].forEach((arr,i)=>{ if(arr && !(i===1 && arr===DB_ALL.usuarios) && !arr.some(x=>x.id===u.id)) arr.push(u); });
}
/* Crea, actualiza o desactiva el usuario de la app que corresponde a una fila de Closers/terapeutas. */
async function authSyncCloserUser(c){
  if(STORAGE_MODE!=='db' || !authRequired) return {skipped:true};
  const all = DB_ALL.usuarios || [];
  const linked = authUserOfCloser(c);
  if(c.usuarioApp!=='SI'){
    if(linked && linked.activo!==false){ linked.activo = false; await saveEntity('usuarios', linked); return {deactivated:true}; }
    return {};
  }
  const mail = normEmail(c.email);
  if(!VAL_EMAIL.test(mail)) return {error:'Para dar Usuario APP el closer necesita un email válido.'};
  const byMail = all.find(x=>ioNorm(x.usuario)===ioNorm(mail));
  if(byMail && isAdminLevel(byMail.rol)) return {error:'Ese correo pertenece a un administrador.'};
  if(byMail && byMail.closerId && byMail.closerId!==c.id) return {error:'Ese correo ya está asignado a otro usuario.'};
  const rol = authAppRole(c);
  let u = linked || byMail;
  if(u){
    if(u.id!==mail){ await deleteEntity('usuarios', {id:u.id}); u.id = mail; }
    Object.assign(u, {usuario:mail, email:mail, nombre:c.nombre, rol, closerId:c.id, activo:true});
    await saveEntity('usuarios', u); authAddLocalUser(u);
    return {updated:true};
  }
  u = GAS_MODE ? {id:mail, nombre:c.nombre, usuario:mail, email:mail, rol, closerId:c.id, activo:true, creado:todayIso()} : await (async()=>{ const salt = authNewSalt(); return {id:mail, nombre:c.nombre, usuario:mail, email:mail, rol, closerId:c.id, salt, hash:await authHash(AUTH_INIT_PASS, salt), mustChange:true, activo:true, creado:todayIso()}; })();
  await saveEntity('usuarios', u); authAddLocalUser(u);
  return {created:true};
}

async function authSyncAllClosers(){
  let creados = 0, sinMail = 0, errores = 0;
  for(const c of DB.closers){
    if(c.usuarioApp!=='SI') continue;
    if(!VAL_EMAIL.test(normEmail(c.email))){ sinMail++; continue; }
    const had = !!authUserOfCloser(c);
    const r = await authSyncCloserUser(c);
    if(r.error) errores++; else if(r.created || (!had && r.updated)) creados++;
  }
  renderClosers();
  toast(`🔑 Usuarios creados: ${creados}${sinMail?` · sin email (no se pueden crear): ${sinMail}`:''}${errores?` · con error: ${errores}`:''}. ${GAS_MODE?'Entran con su cuenta de Google.':'Contraseña inicial: '+AUTH_INIT_PASS}`, errores?'err':'ok');
}

/* ---------- Pantalla "Usuarios y accesos" (solo administradores) ---------- */
const activeAdmins = (exceptId) => (DB.usuarios||[]).filter(u=>u.rol==='ADMIN' && u.activo!==false && u.id!==exceptId);
function renderUsuarios(){

  document.getElementById('content').innerHTML = `
    <div class="grid grid-3">
      <div class="card kpi k-gold"><div class="bar"></div><div class="lbl">Administradores activos</div><div class="val">${admins} de 2</div><div class="sub">${admins<2?'Falta crear el segundo administrador':'Completo'}${pr?' · Principal: '+escapeHtml(pr.nombre):''}</div></div>
      <div class="card kpi"><div class="bar"></div><div class="lbl">Closers y terapeutas</div><div class="val">${DB.usuarios.filter(u=>!isAdminLevel(u.rol)).length}</div></div>

    <div class="table-wrap"><table>
      <thead><tr><th>Nombre</th><th>${GAS_MODE?'Correo (cuenta de Google)':'Correo (ID de usuario)'}</th><th>Rol</th><th>Vinculado a</th><th>${GAS_MODE?'Acceso':'Contraseña'}</th><th>Estado</th><th></th></tr></thead>
      <tbody>
      ${DB.usuarios.map(u=>{ const c = getCloser(u.closerId); return `<tr>
        <td><b>${escapeHtml(u.nombre)}</b>${currentUser&&u.id===currentUser.id?' <span class="pill pill-gold">tú</span>':''}</td>
        <td>${escapeHtml(u.usuario)}</td>
        <td><span class="pill ${isAdminLevel(u.rol)?'pill-gold':u.rol==='CLOSER'?'pill-green':'pill-gray'}">${ROLE_LABEL[u.rol]||u.rol}</span>${pr&&u.id===pr.id?' <span class="pill pill-gold">principal</span>':''}</td>
        <td>${c?escapeHtml(c.nombre):'<span class="muted">—</span>'}</td>
        <td class="muted">${GAS_MODE?'Cuenta de Google':`•••••••• <button class="btn btn-ghost btn-sm" data-action="reset-clave" data-id="${u.id}">↻ Restablecer</button>`}</td>
        <td><span class="pill ${u.activo===false?'pill-gray':'pill-green'}">${u.activo===false?'INACTIVO':'ACTIVO'}</span></td>
        <td style="white-space:nowrap;"><button class="btn btn-ghost btn-sm" data-action="edit-usuario" data-id="${u.id}">✎</button><button class="btn btn-ghost btn-sm" data-action="toggle-usuario" data-id="${u.id}">${u.activo===false?'Activar':'Desactivar'}</button><button class="btn btn-ghost btn-sm" data-action="delete-usuario" data-id="${u.id}">🗑</button></td>
      </tr>`; }).join('') || '<tr class="empty-row"><td colspan="7">Sin usuarios.</td></tr>'}
      </tbody>
    </table></div>
    ${DB.solicitudes.length?`<div class="section-title"><h3>🔑 Solicitudes de contraseña (${DB.solicitudes.length})</h3><span class="hint">Alguien pidió recuperar su acceso</span></div>
    <div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Solicitado</th><th></th></tr></thead><tbody>
    ${DB.solicitudes.map(r=>{ const u = DB.usuarios.find(x=>x.id===r.usuarioId) || DB.usuarios.find(x=>ioNorm(x.usuario)===ioNorm(r.usuario)); return `<tr><td>${escapeHtml(r.usuario)}</td><td>${u?escapeHtml(u.nombre):'<span class="muted">—</span>'}</td><td>${fmtDate((r.fecha||'').slice(0,10))}</td><td style="white-space:nowrap;">${u?`<button class="btn btn-gold btn-sm" data-action="reset-solicitud" data-id="${escapeHtml(r.id)}">Restablecer y mostrar contraseña</button>`:''} <button class="btn btn-ghost btn-sm" data-action="discard-solicitud" data-id="${escapeHtml(r.id)}">Descartar</button></td></tr>`; }).join('')}
    </tbody></table></div>`:''}
    <div class="card" style="margin-top:16px; font-size:13px;">
      <h3 style="font-size:16px; margin-bottom:8px;">Cómo funcionan los roles</h3>
      <ul style="margin:0 0 8px 18px; padding:0; line-height:1.6;">
        <li><b>Administrador</b> (máximo 2): ve y edita todo y gestiona usuarios. El <b>principal</b> (el primero en registrarse) es el único que puede crear, desactivar o eliminar a otro administrador y restablecer todos los usuarios.</li>
        <li><b>Closer</b>: ve solo los estudiantes cuyo closer es él/ella; puede <b>crear y editar sus estudiantes</b> y <b>registrar pagos</b>. No ve ni edita la configuración. Los pagos que registra quedan "pendientes de revisión" hasta que un administrador completa comisión, apoyo, terapeuta y bono.</li>
        <li><b>Terapeuta</b>: solo lectura de lo suyo; no edita nada.</li>
      </ul>
      <p class="field-hint"><b>Importante:</b> además del usuario y la contraseña de la app, comparte el artifact desde el botón <b>Compartir</b> con el nivel correcto: <b>Editor</b> para administradores, <b>Contributor</b> para closers y <b>Viewer</b> para terapeutas. Claude hace cumplir esos niveles al guardar (un Contributor solo puede escribir pagos). Lo que cada persona <i>ve</i> lo filtra la app; no es una barrera contra alguien con conocimientos técnicos que abra la base de datos directamente.</p>
    </div>`;
}
function openUsuarioModal(id){
  const editing = !!id;
  const u = editing ? DB.usuarios.find(x=>x.id===id) : {id:'', nombre:'', usuario:'', rol:'CLOSER', closerId:'', activo:true};
  const html = `
  <div class="modal">
    <div class="modal-head"><h3>${editing?'Editar usuario':'Nuevo usuario'}</h3><button class="x-close" data-action="close-modal">×</button></div>
    <form id="usuarioForm" autocomplete="off">
      <div class="modal-body"><div class="form-grid">
        <div class="full"><label>Nombre completo <span class="req">*</span></label><input type="text" name="nombre" required value="${escapeHtml(u.nombre)}"></div>
        <div><label>Correo electrónico (ID de usuario) <span class="req">*</span></label><input type="text" inputmode="email" name="usuario" required value="${escapeHtml(u.usuario)}" placeholder="nombre@correo.com"><div class="field-hint">Con este correo ingresa y recupera su contraseña.</div></div>
        <div><label>Rol <span class="req">*</span></label><select name="rol" id="usRol">
          ${Object.keys(ROLE_LABEL).map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
        </select></div>
        <div class="full"><label>Vinculado al closer/terapeuta <span class="req" id="usReq">*</span></label><select name="closerId" id="usCloser"><option value="">— Selecciona —</option>${DB.closers.map(c=>`<option value="${c.id}" ${u.closerId===c.id?'selected':''}>${escapeHtml(c.nombre)}${c.esTerapeuta==='SI'?' (terapeuta)':''}</option>`).join('')}</select><div class="field-hint">Define qué estudiantes y pagos ve esta persona.</div></div>
        ${(editing||GAS_MODE) ? '' : `<div class="full"><label>Contraseña inicial <span class="req">*</span> (mínimo 8 caracteres)</label><div style="display:flex; gap:8px;"><input type="text" name="clave" id="usClave" required minlength="8" autocomplete="off"><button type="button" class="btn btn-outline btn-sm" id="usGen">Generar</button></div><div class="field-hint">Se mostrará una sola vez al guardar; la persona deberá cambiarla en su primer ingreso.</div></div>`}
      </div></div>
      <div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-gold">Guardar</button></div>
    </form>
  </div>`;
  showModal(html);
  const rolSel = document.getElementById('usRol');
  const sync = ()=>{ document.getElementById('usReq').style.display = isAdminLevel(rolSel.value) ? 'none' : 'inline'; };
  rolSel.addEventListener('change', sync); sync();
  const gen = document.getElementById('usGen'); if(gen) gen.addEventListener('click', ()=>{ document.getElementById('usClave').value = authTempPassword(); });
  document.getElementById('usuarioForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const o = Object.fromEntries(new FormData(e.target).entries());
    const nombre = o.nombre.trim(), usuario = normEmail(o.usuario);
    if(!nombre){ toast('Escribe el nombre completo.','err'); return; }
    if(!VAL_EMAIL.test(usuario) || usuario.length>120){ toast('Escribe un correo electrónico válido (nombre@dominio.com).','err'); return; }
    if(DB.usuarios.some(x=>x.id!==u.id && ioNorm(x.usuario)===ioNorm(usuario))){ toast('Ese correo ya está registrado.','err'); return; }
    if(!['ADMIN','ADMINTOTAL','CLOSER','TERAPEUTA'].includes(o.rol)){ toast('Rol no válido.','err'); return; }
    if((isAdminLevel(o.rol) || (editing && isAdminLevel(u.rol))) && !amPrincipal() && !(editing && u.id===currentUser.id && o.rol===u.rol)){ toast('Solo el administrador principal puede crear o modificar administradores.','err'); return; }
    if(!isAdminLevel(o.rol) && !o.closerId){ toast('Elige el closer/terapeuta al que está vinculado.','err'); return; }
    if(o.rol==='ADMIN' && u.activo!==false && activeAdmins(u.id).length>=2){ toast('Ya hay 2 administradores activos. Desactiva uno antes de crear otro.','err'); return; }
    if(editing && u.rol==='ADMIN' && o.rol!=='ADMIN' && activeAdmins(u.id).length===0){ toast('Debe quedar al menos un administrador activo.','err'); return; }
    let target, clave = '';
    if(editing){
      target = DB.usuarios.find(x=>x.id===id) || u;
      const isSelf = currentUser && target.id===currentUser.id;
      if(isSelf && ioNorm(target.usuario)!==ioNorm(usuario)){ toast('Tu propio correo no se puede cambiar aquí: pídeselo a otro administrador.','err'); return; }
      const oldDoc = {id:target.id};
      Object.assign(target, {nombre, usuario, email:usuario, rol:o.rol, closerId:o.closerId||''});
      if(!isSelf && target.id!==usuario){            // el correo es el ID: se mueve el registro
        await deleteEntity('usuarios', oldDoc);
        target.id = usuario;
      }
    }
    else if(GAS_MODE){
      target = {id:usuario, nombre, usuario, email:usuario, rol:o.rol, closerId:o.closerId||'', activo:true, creado:todayIso()};
      DB.usuarios.push(target);
    }
    else {
      clave = String(o.clave||'');
      if(clave.length<8){ toast('La contraseña debe tener al menos 8 caracteres.','err'); return; }
      const salt = authNewSalt();
      target = {id:usuario, nombre, usuario, email:usuario, rol:o.rol, closerId:o.closerId||'', salt, hash:await authHash(clave, salt), mustChange:true, activo:true, creado:todayIso()};
      DB.usuarios.push(target);
    }
    await saveEntity('usuarios', target);
    closeModal(); renderUsuarios();
    if(!editing && GAS_MODE) toast('✅ Usuario agregado. Entra con su cuenta de Google: '+target.usuario,'ok');
    else if(!editing) authShowCredentials(target, clave, 'Usuario creado');
    else toast('✅ Usuario actualizado.','ok');
  });
}
function authShowCredentials(u, clave, title){
  showModal(`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x-close" data-action="close-modal">×</button></div>
    <div class="modal-body"><p>Entrega estas credenciales a <b>${escapeHtml(u.nombre)}</b>. <b>La contraseña no se vuelve a mostrar.</b></p>

      <p class="field-hint" style="margin-top:10px;">Recuerda compartirle el artifact con el nivel correcto (Editor / Contributor / Viewer).</p></div>

  const b = document.getElementById('credCopy');
  if(b) b.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText('Correo (usuario): '+u.usuario+'\nContraseña: '+clave); toast('Copiado.','ok'); }catch(e){ toast('Selecciona y copia el texto manualmente.'); } });
}
async function authResetPassword(id){
  const u = DB.usuarios.find(x=>x.id===id); if(!u) return;
  if(isAdminLevel(u.rol) && currentUser && u.id!==currentUser.id && !amPrincipal()){ toast('Solo el administrador principal puede restablecer la contraseña de otro administrador.','err'); return; }
  const clave = authTempPassword(), salt = authNewSalt();
  u.salt = salt; u.hash = await authHash(clave, salt); u.mustChange = true;
  await saveEntity('usuarios', u);
  renderUsuarios();
  authShowCredentials(u, clave, 'Contraseña restablecida');
}
function authToggleUser(id){
  const u = DB.usuarios.find(x=>x.id===id); if(!u) return;
  if(currentUser && u.id===currentUser.id){ toast('No puedes desactivar tu propio usuario.','err'); return; }
  if(isAdminLevel(u.rol) && !amPrincipal()){ toast('Solo el administrador principal puede activar o desactivar administradores.','err'); return; }
  if(u.activo!==false && u.rol==='ADMIN' && activeAdmins(u.id).length===0){ toast('Debe quedar al menos un administrador activo.','err'); return; }
  if(u.activo===false && u.rol==='ADMIN' && activeAdmins(u.id).length>=2){ toast('Ya hay 2 administradores activos.','err'); return; }
  u.activo = (u.activo===false); saveEntity('usuarios', u).then(()=>{ renderUsuarios(); toast(u.activo?'✅ Usuario activado.':'✅ Usuario desactivado.','ok'); });
}
function authDeleteUser(id){
  const u = DB.usuarios.find(x=>x.id===id); if(!u) return;
  if(currentUser && u.id===currentUser.id){ toast('No puedes eliminar tu propio usuario.','err'); return; }
  if(isAdminLevel(u.rol) && !amPrincipal()){ toast('Solo el administrador principal puede eliminar administradores.','err'); return; }
  if(u.rol==='ADMIN' && u.activo!==false && activeAdmins(u.id).length===0){ toast('Debe quedar al menos un administrador activo.','err'); return; }
  confirmAction('¿Eliminar a '+u.nombre+'? Ya no podrá ingresar.', async ()=>{
    DB.usuarios = DB.usuarios.filter(x=>x.id!==id); await deleteEntity('usuarios', u); renderUsuarios(); toast('✅ Usuario eliminado.','ok');
  });
}

/* Restablece TODOS los usuarios y solicitudes: la próxima entrada pide crear el administrador principal. */

async function authResetAll(){
  const us = (DB_ALL.usuarios||[]).slice(), sol = (DB_ALL.solicitudes||[]).slice();

    for(const u of us) await dbClient.doc('usuarios/'+docIdFor('usuarios',u)).delete();

    for(const c of (DB_ALL.credenciales||[])) await dbClient.doc('credenciales/'+docIdFor('credenciales',c)).delete();

  DB_ALL.usuarios = []; DB_ALL.solicitudes = []; DB.usuarios = []; DB.solicitudes = [];

<script>
(function(){
  let tip=null, cur=null;
  function ensure(){ if(!tip){ tip=document.createElement('div'); tip.id='gvAlTip'; document.body.appendChild(tip);} return tip; }
  function place(e){
    const t=ensure(), pad=14, w=t.offsetWidth, h=t.offsetHeight;
    let x=e.clientX+pad, y=e.clientY+pad;
    if(x+w>window.innerWidth-8) x=Math.max(8,e.clientX-w-pad);
    if(y+h>window.innerHeight-8) y=Math.max(8,e.clientY-h-pad);
    t.style.left=x+'px'; t.style.top=y+'px';
  }
  function hide(){ cur=null; if(tip){ tip.classList.remove('on'); tip.style.display='none'; } }
  document.addEventListener('mouseover', function(e){
    const el=e.target.closest && e.target.closest('[data-altip]');
    if(!el){ if(cur) hide(); return; }
    if(el===cur) return;
    const html=(window.__gvAlTips||{})[el.getAttribute('data-altip')];
    if(!html){ hide(); return; }
    cur=el; const t=ensure(); t.innerHTML=html; t.style.display='block'; place(e); t.classList.add('on');
  });
  document.addEventListener('mousemove', function(e){ if(cur) place(e); });
  document.addEventListener('scroll', hide, true);
  document.addEventListener('click', function(e){ if(cur && !(e.target.closest && e.target.closest('[data-altip]'))) hide(); });
})();
