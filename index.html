let stSortKey = 'nombre-asc';
let stProgFiltro = '';
function renderStudentsList(){
  setTopbar('Gestión', 'Estudiantes', `<button class="btn btn-outline btn-sm" data-action="export-students-xlsx" title="Descarga en Excel los estudiantes que ves con los filtros actuales">⬇ Excel</button><button class="btn btn-outline btn-sm" data-action="export-students-pdf" title="Descarga en PDF los estudiantes que ves con los filtros actuales">⬇ PDF</button><button class="btn btn-gold btn-sm" data-action="new-student">＋ Nueva Ficha de Estudiante</button>`);
  const content = document.getElementById('content');
  const sortOpts = [['nombre-asc','Nombre (A → Z)'],['nombre-desc','Nombre (Z → A)'],['programa-asc','Programa (A → Z)'],['programa-desc','Programa (Z → A)'],['saldo-desc','Mayor saldo pendiente'],['valor-desc','Mayor valor total']];
  content.innerHTML = `
    <div class="search-bar">
      <input type="text" id="stSearch" placeholder="🔍 Buscar por nombre, celular o email…">
      <select id="stProgFilter"><option value="">Todos los programas</option>${programasFiltroList().map(n=>`<option value="${escapeHtml(n)}" ${stProgFiltro===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>
      <select id="stCloserFilter" title="Closer Venta"><option value="">Todos los Closer Venta</option>${DB.closers.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select>
      <select id="stTutorFilter" title="Tutor"><option value="">Todos los tutores</option><option value="__none">Sin tutor</option>${DB.closers.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.nombre)}</option>`).join('')}</select>
      <select id="stEstadoFilter"><option value="">Todos los estados</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option></select>
      <select id="stAlarmFilter" title="Semáforo de fecha de pago"><option value="">Semáforo de pago: todos</option><option value="rojo">🔴 Vencidos</option><option value="amarillo">🟡 Por vencer</option><option value="verde">🟢 Al día</option><option value="sin">Sin día de pago</option></select>
      ${dateRangeHTML('stDesde','stHasta','','')}
      <select id="stSort" title="Ordenar por">${sortOpts.map(([v,l])=>`<option value="${v}" ${stSortKey===v?'selected':''}>↕ ${l}</option>`).join('')}</select>
      <span class="spacer"></span>
      <span class="muted" id="stCount"></span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th class="sortable" data-sort="nombre" style="cursor:pointer;">Estudiante <span id="sortIcoNombre"></span></th><th>Closer Venta</th><th>Tutor</th><th class="sortable" data-sort="programa" style="cursor:pointer;">Programa <span id="sortIcoPrograma"></span></th><th>Contacto</th><th class="td-right">Valor Total</th><th class="td-right">Pagado</th><th class="td-right" id="stThPeriodo" style="display:none;">Pagado en el período</th><th class="td-right">Saldo</th><th>Estado</th><th title="Semáforo según el día de pago del mes">Próximo pago</th></tr></thead>
      <tbody id="stTbody"></tbody>
      <tfoot id="stTfoot"></tfoot>
    </table></div>
  `;
  function draw(){
    const q = document.getElementById('stSearch').value.trim().toLowerCase();
    const closerF = document.getElementById('stCloserFilter').value;
    const tutorF = document.getElementById('stTutorFilter').value;
    const estF = document.getElementById('stEstadoFilter').value;
    const alF = document.getElementById('stAlarmFilter').value;
    stProgFiltro = document.getElementById('stProgFilter').value;
    const sD = document.getElementById('stDesde').value, sH = document.getElementById('stHasta').value, hayRango = !!(sD||sH);
    const pagadoPeriodo = id => DB.payments.filter(p=>p.estudianteId===id && inRange(p.fecha,sD,sH)).reduce((a,p)=>a+calcPayment(p).valorUSD,0);
    const conPagoPeriodo = id => DB.payments.some(p=>p.estudianteId===id && inRange(p.fecha,sD,sH));
    document.getElementById('stThPeriodo').style.display = hayRango ? '' : 'none';
    stSortKey = document.getElementById('stSort').value;
    let list = DB.students.filter(s=>{
      if(q && !(s.nombre.toLowerCase().includes(q) || (s.celular||'').toLowerCase().includes(q) || (s.email||'').toLowerCase().includes(q))) return false;
      if(closerF && s.closer !== closerF) return false;
      if(tutorF==='__none' ? !!s.tutor : (tutorF && s.tutor !== tutorF)) return false;
      if(stProgFiltro && !tienePrograma(s, stProgFiltro)) return false;
      if(estF && (s.estado||'ACTIVO') !== estF) return false;
      if(alF){ const al = payAlarm(s).nivel; if(alF==='sin' ? al!=='sin' : al!==alF) return false; }
      if(hayRango && !conPagoPeriodo(s.id)) return false;   // con fechas: estudiantes que tuvieron pagos en ese rango
      return true;
    }).map(s=>({s, t:studentTotals(s.id), per: hayRango ? pagadoPeriodo(s.id) : 0}));
    const [key,dir] = stSortKey.split('-'); const mult = dir==='desc'?-1:1;
    const cmpTxt = (a,b)=> String(a||'').localeCompare(String(b||''),'es',{sensitivity:'base'});
    list.sort((x,y)=>{
      if(key==='nombre') return mult*cmpTxt(x.s.nombre,y.s.nombre);
      if(key==='programa'){ const r = cmpTxt(x.s.programa||'\uffff',y.s.programa||'\uffff'); return r!==0 ? mult*r : cmpTxt(x.s.nombre,y.s.nombre); }
      if(key==='saldo') return mult*(x.t.saldo-y.t.saldo);
      if(key==='valor') return mult*(x.t.valorTotal-y.t.valorTotal);
      return 0;
    });
    { const lab = id => { const e = document.getElementById(id); return e && e.value ? (e.selectedOptions[0]||{}).textContent : ''; };
      const fl = []; if(q) fl.push('Búsqueda: "'+q+'"');
      [['stProgFilter','Programa'],['stCloserFilter','Closer'],['stTutorFilter','Tutor'],['stEstadoFilter','Estado'],['stAlarmFilter','Semáforo']].forEach(([id,n])=>{ const v = lab(id); if(v) fl.push(n+': '+v.replace(/^[^\wÁÉÍÓÚÑáéíóúñ]+/,'')); });
      if(sD||sH) fl.push('Pagos entre '+(sD?fmtDate(sD):'…')+' y '+(sH?fmtDate(sH):'…'));
      window.__stExport = {list, hayRango, filtros: fl}; }
    document.getElementById('sortIcoNombre').textContent = key==='nombre' ? (dir==='asc'?'▲':'▼') : '';
    document.getElementById('sortIcoPrograma').textContent = key==='programa' ? (dir==='asc'?'▲':'▼') : '';
    document.getElementById('stCount').textContent = list.length + ' estudiante(s)';
    document.getElementById('stTbody').innerHTML = list.map(({s,t,per})=>`<tr class="clickable" data-action="open-student" data-id="${s.id}">
        <td><div class="profile-head" style="gap:10px;"><div class="avatar" style="width:32px;height:32px;font-size:13px;">${initials(s.nombre)}</div><b>${escapeHtml(s.nombre)}</b></div></td>
        <td>${escapeHtml((getCloser(s.closer)||{}).nombre||s.closer)||'<span class="muted">—</span>'}</td>
        <td>${escapeHtml((getCloser(s.tutor)||{}).nombre||s.tutor)||'<span class="muted">—</span>'}</td>
        <td>${escapeHtml(s.programa)||'<span class="muted">—</span>'}${adicionalesDe(s).length?`<div class="muted" style="font-size:11px;" title="Programas adicionales">+ ${escapeHtml(adicionalesDe(s).map(a=>a.programa).join(', '))}</div>`:''}</td>
        <td class="muted">${escapeHtml(s.celular)||escapeHtml(s.email)||'—'}</td>
        <td class="td-right num">${fmtUSDShort(t.valorTotal)}</td>
        <td class="td-right num">${fmtUSDShort(t.totalPagadoUSD)}</td>
        ${hayRango?`<td class="td-right num" style="color:var(--green);">${fmtUSDShort(per)}</td>`:''}
        <td class="td-right num" style="font-weight:700; color:${t.saldo>0.01?'var(--clay)':'var(--green)'};">${fmtUSDShort(t.saldo)}</td>
        <td><span class="pill ${(s.estado||'ACTIVO')==='ACTIVO'?'pill-green':'pill-gray'}">${s.estado||'ACTIVO'}</span></td>
        <td>${payAlarmHTML(s)}</td>
      </tr>`).join('') || '<tr class="empty-row"><td colspan="10">No se encontraron estudiantes con esos filtros.</td></tr>';
    const T = list.reduce((a,{t,per})=>({v:a.v+t.valorTotal, p:a.p+t.totalPagadoUSD, q:a.q+per, s:a.s+t.saldo}),{v:0,p:0,q:0,s:0});
    document.getElementById('stTfoot').innerHTML = list.length ? `<tr style="background:var(--paper-deep); font-weight:700;"><td colspan="4">▶ TOTAL (${list.length} estudiantes)</td><td class="td-right num">${fmtUSDShort(T.v)}</td><td class="td-right num">${fmtUSDShort(T.p)}</td>${hayRango?`<td class="td-right num" style="color:var(--green);">${fmtUSDShort(T.q)}</td>`:''}<td class="td-right num" style="color:var(--clay);">${fmtUSDShort(T.s)}</td><td></td><td></td></tr>` : '';
  }
  ['stSearch','stProgFilter','stCloserFilter','stTutorFilter','stEstadoFilter','stAlarmFilter','stSort','stDesde','stHasta'].forEach(id=>document.getElementById(id).addEventListener('input', draw));
  // Ordenar tocando el encabezado (Estudiante / Programa): alterna ascendente y descendente
  content.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click', e=>{
    e.stopPropagation();
    const k = th.dataset.sort; const cur = document.getElementById('stSort').value;
    document.getElementById('stSort').value = (cur===k+'-asc') ? k+'-desc' : k+'-asc';
    draw();
  }));
  draw();
}

let finDesde='', finHasta='';

/* ===== Cartera mensual de 24 meses: 1 mes antes del ingreso + mes de ingreso + 22 posteriores ===== */
function finMonthKey(y,m){ return y+'-'+String(m+1).padStart(2,'0'); }
function finTimeline(s){
  let base = (s.fechaIngreso && /^\d{4}-\d{2}/.test(s.fechaIngreso)) ? s.fechaIngreso : null;
  if(!base){
    const ps = DB.payments.filter(p=>p.estudianteId===s.id && p.fecha).map(p=>p.fecha).sort();
    if(ps[0]) base = ps[0];
    else {   // sin fecha de ingreso ni pagos: se parte del primer mes con datos históricos (año actual)
      const pr = Array.isArray(s.historicoPropuesto)?s.historicoPropuesto:[], re = Array.isArray(s.historicoReal)?s.historicoReal:[];
      let f = -1; for(let i=0;i<12;i++){ if(parseNum(pr[i])||parseNum(re[i])){ f = i; break; } }
      base = f>=0 ? finMonthKey(new Date().getFullYear(), f)+'-01' : todayIso();
    }
  }
  let y = parseInt(base.slice(0,4),10), m = parseInt(base.slice(5,7),10)-1;
  const ingreso = finMonthKey(y,m);
  m -= 1; if(m<0){ m=11; y-=1; }                       // 1 mes antes del ingreso
  const keys = [];
  for(let i=0;i<24;i++){ keys.push(finMonthKey(y,m)); m++; if(m>11){ m=0; y++; } }
  return {keys, ingreso};
}
/* Valores por mes (clave AAAA-MM). Si aún no existe el mapa, se construye desde los 12 meses antiguos (sin año):
   cada mes del calendario se ubica en su primera aparición dentro de los 24 meses. */
function finMonthMap(s, keys){
  if(s.historicoMeses && typeof s.historicoMeses==='object') return s.historicoMeses;
  const out = {}, used = {};
  const pr = Array.isArray(s.historicoPropuesto)?s.historicoPropuesto:[], re = Array.isArray(s.historicoReal)?s.historicoReal:[];
  keys.forEach(k=>{ const m = parseInt(k.slice(5,7),10)-1; if(used[m]) return; used[m] = true; const a = parseNum(pr[m]), b = parseNum(re[m]); if(a||b) out[k] = {p:a, r:b}; });
  return out;
}
function finLegacySync(s){      // mantiene los 12 meses antiguos (suma por mes del calendario) para análisis y reportes
  const pr = new Array(12).fill(0), re = new Array(12).fill(0);
  Object.keys(s.historicoMeses||{}).forEach(k=>{ const m = parseInt(k.slice(5,7),10)-1; if(m<0||m>11) return; pr[m]+=parseNum(s.historicoMeses[k].p); re[m]+=parseNum(s.historicoMeses[k].r); });
  s.historicoPropuesto = pr; s.historicoReal = re;
  s.historicoCobrado = re.reduce((a,b)=>a+b,0); s.historicoSaldo = parseNum(s.valorTotal) - s.historicoCobrado;   // el total siempre es la suma de los meses
}
function livePaymentsByKey(idSet){
  const out = {};
  DB.payments.forEach(p=>{
    if(!isLivePayment(p)) return;
    if(idSet && !idSet.has(p.estudianteId)) return;
    const c = calcPayment(p); out[c.corte.key] = (out[c.corte.key]||0) + c.valorUSD;
  });
  return out;
}
function finYearLabel(y){ const cur = new Date().getFullYear(); return y===cur?'Año actual':y===cur-1?'Año anterior':y===cur+1?'Año siguiente':(y<cur?'Años anteriores':'Años posteriores'); }

function attachHistTableEvents(s){
  const fd = document.getElementById('finDesde'), fh = document.getElementById('finHasta');
  if(fd) fd.addEventListener('change', ()=>{ finDesde = fd.value; renderView(); });
  if(fh) fh.addEventListener('change', ()=>{ finHasta = fh.value; renderView(); });
  document.querySelectorAll('.hist-input').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      if(!isAdmin()) return;
      const row = e.target.dataset.row;
      const key = e.target.dataset.key;
      const val = parseNum(e.target.value);
      const keys = finTimeline(s).keys;
      const mm = JSON.parse(JSON.stringify(finMonthMap(s, keys)));           // copia editable
      keys.forEach(k=>{ if(!mm[k]) mm[k] = {p:0,r:0}; });
      mm[key][row==='prop'?'p':'r'] = val;
      s.historicoMeses = mm; finLegacySync(s);
      s.historicoMatched = true;
      if(await saveEntity('students', s)===false) return;
      const trmRef = latestTRM();
      const liveM = livePaymentsByKey(new Set([s.id]));
      const shown = row==='real' ? val + (liveM[key]||0) : val;      // en "real" las filas COP/MXN muestran el total (histórico + pagos de la app)
      const copCell = document.querySelector(`[data-copcell="${row}-${key}"]`);
      const mxCell = document.querySelector(`[data-mxcell="${row}-${key}"]`);
      if(copCell) copCell.textContent = trmRef? fmtOrig(Math.round(shown*trmRef.trmCOP),'COP') : '—';
      if(mxCell) mxCell.textContent = trmRef? fmtOrig((shown*trmRef.trmMXN).toFixed(2),'MXN') : '—';
      const sumK = f => keys.reduce((a,k)=>a+parseNum((mm[k]||{})[f]),0);
      const totalEl = document.getElementById(row==='prop'?'histPropTotal':'histRealTotal');
      if(totalEl){ totalEl.textContent = fmtUSDShort(sumK(row==='prop'?'p':'r')); }
      if(row==='real'){
        const tc = document.querySelector(`[data-totcell="${key}"]`); if(tc) tc.textContent = shown ? fmtUSDShort(shown) : '—';
        const g = document.getElementById('histRealGrand'); if(g) g.textContent = fmtUSDShort(sumK('r') + keys.reduce((a,k)=>a+(liveM[k]||0),0));
      }
      toast('✅ Valor mensual actualizado.','ok');
    });
  });
}

async function refreshPayments(btn){
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Actualizando…'; }
  const FIL = ['pSearch','pCloserFilter','pProgFilter','pDesde','pHasta','pAnioFilter','pMesFilter'];
  const keep = {}; FIL.forEach(id=>{ const e = document.getElementById(id); if(e) keep[id] = e.value; });
  const snap = () => { const m = {}; (DB.payments||[]).forEach(p=>{ m[p.id] = JSON.stringify(p); }); return m; };
  const antes = snap();
  try{
    if(GAS_MODE && dbClient && dbClient.reload) await withTimeout(dbClient.reload(), 30000, 'actualizando');
    else if(STORAGE_MODE==='db' && !GAS_MODE){ syncBusy = false; await withTimeout((async()=>{ for(const c of ['payments','students','programas','closers','platforms','trm','bonos']) await resyncCollection(c, true); })(), 40000, 'actualizando'); }
  }catch(e){ if(btn){ btn.disabled = false; btn.textContent = '🔄 Actualizar'; } toast('No se pudo leer la base de datos: '+((e&&e.message)||e),'err'); return; }
  renderView();
  FIL.forEach(id=>{ const e = document.getElementById(id); if(e && keep[id]){ e.value = keep[id]; e.dispatchEvent(new Event('input',{bubbles:true})); } });
  const des = snap(); let cambiados = 0, nuevos = 0, quitados = 0;
  Object.keys(des).forEach(k=>{ if(!(k in antes)) nuevos++; else if(antes[k]!==des[k]) cambiados++; });
  Object.keys(antes).forEach(k=>{ if(!(k in des)) quitados++; });
  const partes = []; if(cambiados) partes.push(cambiados+' modificado(s)'); if(nuevos) partes.push(nuevos+' nuevo(s)'); if(quitados) partes.push(quitados+' eliminado(s)');
  toast('✅ Pagos actualizados y valores recalculados'+(partes.length?': '+partes.join(', ')+'.':' (sin cambios nuevos en la base de datos).'),'ok');
}

function initialPaymentOf(studentId, excludeId){
  const list = DB.payments.filter(x=>x.estudianteId===studentId && x.id!==excludeId).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)) || String(a.id).localeCompare(String(b.id)));

let ocrSampleP = null;
function ocrSample(){
  if(!ocrSampleP) ocrSampleP = (async ()=>{
    try{
      if(!(window.claude && typeof window.claude.use==='function')) return null;
      const s = await window.claude.use('sample'); if(!s) return null;

/* Reduce la imagen (máx. 1600 px, JPEG) para enviarla más rápido. */
function ocrShrink(file){
  return new Promise(res=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const M = 1600, k = Math.min(1, M/Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>res(b||file), 'image/jpeg', 0.88);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
const ocrFold = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function ocrMatchPlatform(name){
  const n = ocrFold(name); if(!n) return null;
  const pls = DB.platforms || [];
  return pls.find(p=>ocrFold(p.nombre)===n)
      || pls.find(p=>{ const q = ocrFold(p.nombre); return q && (n.includes(q) || q.includes(n)); })
      || pls.find(p=>{ const q = ocrFold(p.nombre).split(' ')[0]; return q.length>=4 && n.split(' ').includes(q); })
      || null;
}
function ocrMatchStudent(name){
  const toks = ocrFold(name).split(' ').filter(t=>t.length>=3); if(toks.length<2) return null;
  const pool = DB.students.filter(s=>isAdmin() || s.closer===myCloserId());
  const hits = pool.filter(s=>{ const sn = ' '+ocrFold(s.nombre)+' '; return toks.filter(t=>sn.includes(' '+t+' ')).length>=2; });
  return hits.length===1 ? hits[0] : null;
}
let ocrPasteBound = false;
function setupReceiptReader(onChange){
  const box = document.getElementById('pf_ocrBox'); if(!box) return;
  const fileIn = document.getElementById('pf_ocrFile'), drop = document.getElementById('pf_ocrDrop'), thumb = document.getElementById('pf_ocrThumb'),
        dropTxt = document.getElementById('pf_ocrDropTxt'), btn = document.getElementById('pf_ocrBtn'), clr = document.getElementById('pf_ocrClear'),
        status = document.getElementById('pf_ocrStatus'), out = document.getElementById('pf_ocrResult');
  let current = null, ctrl = null;
  ocrSample().then(s=>{ if(!s && document.body.contains(status)){ status.innerHTML = '⚠️ La lectura automática no está disponible en esta vista. Puedes llenar el pago a mano como siempre.'; btn.disabled = true; btn.title = 'No disponible'; } });

  function setFile(f){
    if(!f) return;
    if(!/^image\//.test(f.type||'')){ toast('El comprobante debe ser una imagen (JPG, PNG…).','err'); return; }
    if(f.size > 15*1024*1024){ toast('La imagen pesa más de 15 MB.','err'); return; }
    current = f;
    if(thumb.src) URL.revokeObjectURL(thumb.src);
    thumb.src = URL.createObjectURL(f); thumb.hidden = false; dropTxt.hidden = true; clr.hidden = false;
    btn.disabled = false; out.innerHTML = '';
    status.textContent = 'Imagen lista: pulsa "Detectar datos del pago".';
  }
  fileIn.addEventListener('change', ()=>setFile(fileIn.files && fileIn.files[0]));
  drop.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileIn.click(); } });
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', e=>{ const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; setFile(f); });
  clr.addEventListener('click', ()=>{ current = null; fileIn.value=''; if(thumb.src) URL.revokeObjectURL(thumb.src); thumb.removeAttribute('src'); thumb.hidden = true; dropTxt.hidden = false; clr.hidden = true; btn.disabled = true; out.innerHTML=''; status.textContent = 'Se detectan el valor, la moneda, la fecha y la plataforma, y se llenan solos en el formulario. Revísalos antes de registrar.'; });
  box._setFile = setFile;
  if(!ocrPasteBound){
    ocrPasteBound = true;
    document.addEventListener('paste', e=>{
      const b = document.getElementById('pf_ocrBox'); if(!b || !b._setFile) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];

  btn.addEventListener('click', async ()=>{
    if(!current) return;
    const sample = await ocrSample();

    if(ctrl) ctrl.abort(); ctrl = new AbortController();
    btn.disabled = true; const old = btn.textContent; btn.textContent = '⏳ Leyendo comprobante…'; out.innerHTML = '';
    status.textContent = 'Analizando la imagen…';
    try{
      const blob = await ocrShrink(current);
      const plats = (DB.platforms||[]).map(p=>p.nombre).filter(Boolean);
      const prompt = `Eres un asistente contable de la Universidad AmarYYa (Colombia). La imagen adjunta es un comprobante de pago (transferencia, recibo, captura de app bancaria, PayPal, Stripe, Hotmart, Nequi, Bancolombia, etc.).
Extrae los datos y responde SOLO con un objeto JSON, sin texto adicional, con estas claves:
{"valor": número (monto efectivamente pagado o recibido, sin símbolos ni separadores de miles, punto como decimal; null si no se ve),
 "moneda": "USD" | "COP" | "MXN" | null,
 "fecha": "AAAA-MM-DD" | null (fecha de la transacción),
 "plataforma": uno de los nombres EXACTOS de esta lista, o null si ninguno corresponde: ${JSON.stringify(plats)},
 "plataformaDetectada": texto de la plataforma/banco tal como aparece en la imagen o null,
 "pagador": nombre de la persona que paga si aparece, o null,
 "referencia": número de referencia / comprobante / transacción si aparece, o null,
 "confianza": "alta" | "media" | "baja",
 "notas": observación corta en español si algo es dudoso, o ""}
Reglas: en formato colombiano "1.250.000" o "$ 1.250.000,00" es un millón doscientos cincuenta mil. Si el monto está en pesos sin especificar país, usa COP salvo que el comprobante sea claramente mexicano (MXN). Si hay monto bruto y neto, usa el monto que pagó el cliente. Las fechas como "05/11/2026" son día/mes/año. Hoy es ${todayIso()}.`;
      const res = await sample.json(prompt, {images:[blob], signal: ctrl.signal, modelTier:'default'});
      const d = (res && typeof res==='object') ? res : {};
      const filled = [], missing = [];
      const valor = typeof d.valor==='number' ? d.valor : parseNum(d.valor);
      if(valor>0){ setVal('pf_pagoReal', String(Math.round(valor*100)/100)); filled.push('valor'); } else missing.push('valor');
      const mon = d.moneda ? normMoneda(d.moneda) : '';
      if(['USD','COP','MXN'].includes(mon)){ setVal('pf_moneda', mon); filled.push('moneda'); } else missing.push('moneda');
      if(d.fecha && /^\d{4}-\d{2}-\d{2}$/.test(String(d.fecha))){ setVal('pf_fecha', String(d.fecha)); filled.push('fecha'); } else missing.push('fecha');
      const pl = ocrMatchPlatform(d.plataforma) || ocrMatchPlatform(d.plataformaDetectada);
      if(pl){ setVal('pf_medio', pl.nombre); filled.push('plataforma'); } else missing.push('plataforma');
      let stTxt = '';
      const stSel = document.getElementById('pf_estudiante');
      if(d.pagador && stSel && !stSel.value){ const st = ocrMatchStudent(d.pagador); if(st){ setVal('pf_estudiante', st.id); stTxt = st.nombre; } }
      if(d.referencia){ const ob = document.querySelector('#paymentForm [name="observaciones"]'), co = document.querySelector('#paymentForm [name="concepto"]'); const tag = 'Ref. comprobante: '+d.referencia; const tgt = ob || co; if(tgt && !String(tgt.value).includes(String(d.referencia))){ tgt.value = tgt.value ? tgt.value+' · '+tag : tag; flash(tgt); } }
      if(typeof onChange==='function') onChange();
      const conf = String(d.confianza||'').toLowerCase();
      const R = (k,v,cls)=>`<div class="row"><span class="muted">${k}</span><span class="${cls||''}">${v}</span></div>`;
      out.innerHTML = `<div class="ocr-res">
        ${R('Valor', valor>0 ? escapeHtml(fmtOrig(valor, mon||'USD')) : 'No detectado', valor>0?'ok':'warn')}
        ${R('Moneda', mon||'No detectada', mon?'ok':'warn')}
        ${R('Fecha', d.fecha ? escapeHtml(fmtDate(d.fecha)) : 'No detectada', d.fecha?'ok':'warn')}
        ${R('Plataforma', pl ? escapeHtml(pl.nombre) : (d.plataformaDetectada ? escapeHtml(d.plataformaDetectada)+' (no está en Plataformas de Cobro: elígela a mano)' : 'No detectada'), pl?'ok':'warn')}
        ${d.pagador ? R('Pagador', escapeHtml(d.pagador) + (stTxt ? ' → estudiante seleccionado: <b>'+escapeHtml(stTxt)+'</b>' : '')) : ''}
        ${d.referencia ? R('Referencia', escapeHtml(d.referencia)) : ''}
        ${R('Confianza de la lectura', conf ? escapeHtml(conf) : '—', conf==='alta'?'ok':'warn')}
        ${d.notas ? `<div class="field-hint" style="margin-top:6px;">📝 ${escapeHtml(d.notas)}</div>` : ''}
      </div>`;
      status.textContent = filled.length ? `✅ Se llenaron: ${filled.join(', ')}.${missing.length?' Completa a mano: '+missing.join(', ')+'.':''} Revisa los campos resaltados antes de registrar.` : '⚠️ No se pudieron leer datos de esta imagen. Prueba con una captura más nítida o llena el pago a mano.';
      if(filled.length) toast('Datos del comprobante cargados en el formulario.','ok');
    }catch(err){
      const code = err && err.code;
      if(code==='cancelled') return;
      status.textContent = code==='not_granted' ? '⚠️ No se autorizó la lectura automática. Puedes llenar el pago a mano.'
        : code==='rate_limited' ? '⏳ Demasiadas lecturas seguidas. Espera un momento y vuelve a intentarlo.'
        : '⚠️ No se pudo leer el comprobante. Intenta de nuevo o llena el pago a mano.';
    }finally{
      btn.textContent = old; btn.disabled = !current;
    }
  });
}

/* ================= DÍA DE PAGO (semáforo) Y BOLSILLO DE FORMACIÓN ================= */
const ALERTA_PAGO_DIAS = 5;          // el semáforo se pone amarillo cuando faltan 5 días o menos
const BOLSILLO_META = 500, BOLSILLO_BASE = 2500, FORMACION_MIN_SESIONES = 8;   // bolsillo = 500 × valor del pago / 2.500, hasta 500 por estudiante
function payAlarm(s, hoyIso){
  const hoy = hoyIso || todayIso(), dia = parseInt(s.diaPago,10);
  const saldo = studentTotals(s.id).saldo;
  if(!(saldo>0.01)) return {nivel:'none', txt:'Sin saldo'};
  if(!(dia>=1 && dia<=31)) return {nivel:'sin', txt:'Sin día de pago'};
  const y = +hoy.slice(0,4), m = +hoy.slice(5,7)-1, key = hoy.slice(0,7);
  const dueOf = (yy,mm)=>{ const dim = new Date(Date.UTC(yy,mm+1,0)).getUTCDate(); return new Date(Date.UTC(yy,mm,Math.min(dia,dim))).toISOString().slice(0,10); };
  // ¿ya cubrió la cuota de este mes? (compromiso del mes menos lo cobrado; si no hay compromiso, basta con un pago en el mes)
  let pagado;
  const TL = finTimeline(s), mm = finMonthMap(s, TL.keys), o = mm[key];
  const live = DB.payments.filter(p=>p.estudianteId===s.id && isLivePayment(p) && calcPayment(p).corte.key===key).reduce((a,p)=>a+calcPayment(p).valorUSD,0);
  if(o && parseNum(o.p)>0.005) pagado = parseNum(o.r)+live >= parseNum(o.p)-0.005;
  else pagado = DB.payments.some(p=>p.estudianteId===s.id && String(p.fecha).slice(0,7)===key);
  const due = pagado ? dueOf(m===11?y+1:y, (m+1)%12) : dueOf(y,m);
  const diff = Math.round((Date.parse(due)-Date.parse(hoy))/86400000);
  const fd = due.slice(8,10)+'/'+due.slice(5,7);
  if(diff<0) return {nivel:'rojo', dias:diff, due, txt:'Vencido hace '+(-diff)+' día'+(diff===-1?'':'s')+' · '+fd};
  if(diff===0) return {nivel:'amarillo', dias:0, due, txt:'Vence hoy · '+fd};
  if(diff<=ALERTA_PAGO_DIAS) return {nivel:'amarillo', dias:diff, due, txt:'Vence en '+diff+' día'+(diff===1?'':'s')+' · '+fd};
  return {nivel:'verde', dias:diff, due, txt:'Próximo pago '+fd};
}
function payAlarmHTML(s){
  const a = payAlarm(s), dia = parseInt(s.diaPago,10);
  const tip = dia>=1 ? 'Paga el día '+dia+' de cada mes' : 'Define el día de pago en la ficha del estudiante';
  if(a.nivel==='none') return '<span class="muted" title="Sin saldo pendiente">—</span>';
  if(a.nivel==='sin') return '<span class="muted" title="'+tip+'">Sin día</span>';
  const cls = a.nivel==='rojo'?'pill-red':a.nivel==='amarillo'?'pill-gold':'pill-green', ic = a.nivel==='rojo'?'🔴':a.nivel==='amarillo'?'🟡':'🟢';
  return `<span class="pill ${cls}" title="${tip}" style="white-space:nowrap;">${ic} ${escapeHtml(a.txt)}</span>`;
}
function esFormacion(sid){   // estudiante de formación = su programa da derecho a MÁS de 8 sesiones
  const st = getStudent(sid), pr = st && st.programa ? DB.programas.find(x=>x.nombre===st.programa) : null;
  if(!pr || pr.sesiones===undefined || pr.sesiones===null || pr.sesiones==='') return false;
  return parseInt(pr.sesiones,10) > FORMACION_MIN_SESIONES;
}
const VALOR_SESION_BOLSILLO = 50;   // procesos terapéuticos: bolsillo = sesiones del programa × 50 USD
function sesionesDefinidasPrograma(sid){   // sesiones escritas en el catálogo para el programa principal del estudiante (0 si no están definidas)
  const st = getStudentAny(sid), pr = st && st.programa ? DB.programas.find(x=>x.nombre===st.programa) : null;
  const n = pr && pr.sesiones!==undefined && pr.sesiones!==null && pr.sesiones!=='' ? parseInt(pr.sesiones,10) : NaN;
  return isNaN(n) || n<0 ? 0 : n;
}
function esProcesoTerapeutico(sid){ return !esFormacion(sid) && sesionesDefinidasPrograma(sid) > 0; }
function bolsilloMeta(sid){   // formación: 500 · proceso terapéutico: sesiones × 50 · otros: sin bolsillo automático
  if(esFormacion(sid)) return BOLSILLO_META;
  return esProcesoTerapeutico(sid) ? sesionesDefinidasPrograma(sid) * VALOR_SESION_BOLSILLO : 0;
}
function bolsilloAcumPagos(sid, excludeId){ return DB.payments.filter(p=>p.estudianteId===sid && p.id!==excludeId).reduce((a,p)=>a+calcPayment(p).bolsilloUSD,0); }
function bolsilloSugerido(sid, valorUSD, excludeId){   // formación: 500 × valor / 2.500 · proceso terapéutico: (sesiones × 50) × valor / valor total del estudiante · sin pasar de la meta
  const meta = bolsilloMeta(sid);
  if(!(meta>0) || !(valorUSD>0)) return 0;
  const restante = Math.max(0, meta - bolsilloAcumPagos(sid, excludeId));
  let aporte;
  if(esFormacion(sid)) aporte = BOLSILLO_META*valorUSD/BOLSILLO_BASE;
  else { const vt = parseNum((getStudentAny(sid)||{}).valorTotal); aporte = vt>0 ? meta*valorUSD/vt : valorUSD; }   // proporcional a lo que paga del valor total
  return Math.round(Math.min(aporte, restante)*100)/100;
}

/* ================= BONOS DE ESTUDIANTES (salen del bolsillo; no son ingreso) ================= */
const BONOS_MAX = 10;   // valor por defecto: sesiones personalizadas a las que tiene derecho un estudiante si su programa no define otro número
function sesionesMax(sid){   // derecho del estudiante = columna "Sesiones" de su programa (10 si no está definida)
  const st = getStudentAny(sid); const pr = st && st.programa ? DB.programas.find(x=>x.nombre===st.programa) : null;
  const v = pr && pr.sesiones!==undefined && pr.sesiones!=='' && pr.sesiones!==null ? parseInt(pr.sesiones,10) : NaN;
  const base = isNaN(v) || v<0 ? BONOS_MAX : v;
  const extra = adicionalesDe(st).reduce((a,x)=>{ const pr2 = DB.programas.find(y=>y.nombre===x.programa); const n = pr2 && pr2.sesiones!==undefined && pr2.sesiones!=='' && pr2.sesiones!==null ? parseInt(pr2.sesiones,10) : 0; return a + (n>0?n:0); }, 0);
  return base + extra;   // el programa principal + las sesiones que definan los programas adicionales
}
const therapistsList = () => DB.closers.filter(c=>c.esTerapeuta==='SI');
function bolsilloAcumulado(sid){ return studentPayments(sid).reduce((a,p)=>a+calcPayment(p).bolsilloUSD,0); }
function bolsilloInfo(sid, excludeId){
  const acum = bolsilloAcumulado(sid);
  const bs = (DB.bonos||[]).filter(b=>b.estudianteId===sid && b.id!==excludeId);
  const pend = bs.filter(b=>b.estado!=='PAGADO').reduce((a,b)=>a+parseNum(b.monto),0);
  const pag = bs.filter(b=>b.estado==='PAGADO').reduce((a,b)=>a+parseNum(b.monto),0);
  return {acum, pend, pag, saldo: acum-pag, disp: acum-pend-pag, n: bs.length, max: sesionesMax(sid), restantes: Math.max(0, sesionesMax(sid)-bs.length)};
}
function fechaTxt(iso){ return /^\d{4}-\d{2}-\d{2}$/.test(iso||'') ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : ''; }
function parseFechaTxt(t){   // acepta dd/mm/aaaa, d/m/aa, aaaa-mm-dd (separadores / - .) -> 'YYYY-MM-DD' | '' | null (inválida)
  t = String(t||'').trim(); if(!t) return '';
  let m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/), y, mo, d;
  if(m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else { m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/); if(!m) return null; d=+m[1]; mo=+m[2]; y=+m[3]; if(y<100) y+=2000; }
  const dt = new Date(Date.UTC(y,mo-1,d)); if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return null;
  const z = n=>String(n).padStart(2,'0'); return y+'-'+z(mo)+'-'+z(d);
}
// 10 casillas por estudiante: la sesión usa su número (campo "sesion"); las antiguas sin número ocupan la primera casilla libre por fecha
function sesionesSlots(sid, excludeId){
  const bs = (DB.bonos||[]).filter(b=>b.estudianteId===sid && b.id!==excludeId).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)) || String(a.creado||'').localeCompare(String(b.creado||'')) || String(a.id).localeCompare(String(b.id)));
  const L = Math.max(sesionesMax(sid), bs.length);   // si ya hay más registradas que el derecho actual, no se pierde ninguna
  const slots = Array(L).fill(null), rest = [];
  bs.forEach(b=>{ const n = parseInt(b.sesion,10); if(n>=1 && n<=L && !slots[n-1]) slots[n-1] = b; else rest.push(b); });
  rest.forEach(b=>{ const i = slots.indexOf(null); if(i>=0) slots[i] = b; });
  return slots;
}
function sesionNum(b){ return sesionesSlots(b.estudianteId).findIndex(x=>x&&x.id===b.id)+1; }
function bonosOrdenados(sid){ return sesionesSlots(sid).filter(Boolean); }
function defaultTerapeutaFor(sid){
  const st = getStudent(sid), ts = therapistsList();

  return last ? last.nombreTerapeuta : '';
}

async function deleteAdicional(sid, aid){
  const st = getStudent(sid), ad = adicionalesDe(st).find(x=>x.id===aid); if(!st || !ad) return;
  const otros = adicionalesDe(st).filter(x=>x.id!==aid && x.programa===ad.programa).length + (st.programa===ad.programa?1:0);
  const pagos = studentPayments(sid).filter(p=>p.programa===ad.programa).length;
  if(pagos && !otros){ toast('No se puede quitar: ya hay '+pagos+' pago(s) registrados a "'+ad.programa+'". Edita esos pagos primero o cambia el valor de la compra.','err'); return; }
  confirmAction('¿Quitar "'+ad.programa+'" ('+fmtUSDShort(parseNum(ad.valor))+') de este estudiante? Se resta de su cartera.', async ()=>{
    const prev = JSON.stringify(st.adicionales||[]);
    st.adicionales = adicionalesDe(st).filter(x=>x.id!==aid);
    if(await saveEntity('students', st)===false){ st.adicionales = JSON.parse(prev); renderView(); return; }
    renderView(); toast('Programa adicional quitado.','ok');
  });
}

    <div class="section-title" style="margin-top:22px;"><h3>🧮 Totales de control</h3><span class="muted" style="font-size:12px;">Según los filtros aplicados</span></div>
    <div class="card" id="boControl"></div>`;
  const tn = id => (getCloser(id)||{}).nombre || id || '—';
  function draw(){
    const q = document.getElementById('boSearch').value.trim().toLowerCase(), tf = document.getElementById('boTer').value, ef = document.getElementById('boEstado').value, sf = document.getElementById('boEst').value, pgf = document.getElementById('boProg').value;
    const d1 = document.getElementById('boDesde').value, d2 = document.getElementById('boHasta').value;
    const list = (DB.bonos||[]).filter(b=>{
      if(q && !((b.estudianteNombre||'').toLowerCase().includes(q) || (b.concepto||'').toLowerCase().includes(q))) return false;
      if(tf && b.terapeutaId!==tf) return false;
      if(sf && b.estudianteId!==sf) return false;
      if(pgf && !tienePrograma(getStudentAny(b.estudianteId), pgf)) return false;
      if(ef && (b.estado||'PENDIENTE')!==ef) return false;
      if(!inRange(b.fecha,d1,d2)) return false;
      return true;
    }).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const sum = (arr,f)=>arr.reduce((a,b)=>a+(f(b)?parseNum(b.monto):0),0);
    const pend = sum(list,b=>b.estado!=='PAGADO'), pag = sum(list,b=>b.estado==='PAGADO');
    document.getElementById('boKpis').innerHTML = [['Sesiones pendientes de pago',pend],['Sesiones pagadas a terapeutas',pag],['Total en sesiones',pend+pag]].map(([l,v])=>`<div class="card kpi"><div class="bar"></div><div class="lbl">${l}</div><div class="val" style="font-size:22px;">${fmtUSDShort(v)}</div></div>`).join('');
    document.getElementById('boCount').textContent = list.length+' sesión(es)';
    document.getElementById('boTbody').innerHTML = list.map(b=>{
      const pagado = b.estado==='PAGADO';
      const nOrd = sesionNum(b);
      return `<tr><td>${fmtDate(b.fecha)}</td><td><b>${escapeHtml(b.estudianteNombre||b.estudianteId)}</b></td><td>Sesión ${nOrd} de ${sesionesMax(b.estudianteId)}</td><td>${escapeHtml(tn(b.terapeutaId))}</td><td>${escapeHtml(b.concepto)||'<span class="muted">—</span>'}${b.observaciones?`<div class="muted" style="font-size:11px;">${escapeHtml(b.observaciones)}</div>`:''}</td><td class="td-right num">${fmtUSDShort(parseNum(b.monto))}</td><td><span class="pill ${pagado?'pill-green':'pill-gold'}">${pagado?'Pagada'+(b.fechaPago?' · '+fmtDate(b.fechaPago):''):'Pendiente'}</span></td>${admin?`<td class="td-right num">${fmtUSDShort(bolsilloInfo(b.estudianteId).disp)}</td><td style="white-space:nowrap;">${pagado?`<button class="btn btn-ghost btn-sm" title="Marcar como pendiente" data-action="unpay-bono" data-id="${escapeHtml(b.id)}">↩</button>`:`<button class="btn btn-ghost btn-sm" title="Marcar como pagada al terapeuta" data-action="pay-bono" data-id="${escapeHtml(b.id)}">💵</button>`}<button class="btn btn-ghost btn-sm" data-action="edit-bono" data-id="${escapeHtml(b.id)}">✎</button><button class="btn btn-ghost btn-sm" data-action="delete-bono" data-id="${escapeHtml(b.id)}">🗑</button></td>`:''}</tr>`;
    }).join('') || `<tr class="empty-row"><td colspan="${admin?9:7}">No hay sesiones con esos filtros.</td></tr>`;
    const nPend = list.filter(b=>b.estado!=='PAGADO').length, nPag = list.length - nPend;
    const ftr = (lab, n, v, strong)=>`<tr class="bo-tot${strong?' bo-tot-main':''}"><td colspan="5">${strong?'<b>'+lab+'</b>':lab} <span class="muted">· ${n} sesión(es)</span></td><td class="td-right num">${strong?'<b>'+fmtUSDShort(v)+'</b>':fmtUSDShort(v)}</td><td colspan="${admin?3:1}"></td></tr>`;
    document.getElementById('boTfoot').innerHTML = list.length ? ftr('Pendientes de pago', nPend, pend) + ftr('Pagadas a terapeutas', nPag, pag) + ftr('TOTAL SESIONES', list.length, pend+pag, true) : '';
    const g = {}; list.forEach(b=>{ const k = b.terapeutaId||'—'; const r = g[k] = g[k]||{n:0,p:0,g:0}; r.n++; if(b.estado==='PAGADO') r.g+=parseNum(b.monto); else r.p+=parseNum(b.monto); });
    const gT = Object.values(g).reduce((a,r)=>({n:a.n+r.n,p:a.p+r.p,g:a.g+r.g}),{n:0,p:0,g:0});
    document.getElementById('boTer2f').innerHTML = list.length ? `<tr class="bo-tot bo-tot-main"><td><b>TOTAL (${Object.keys(g).length} terapeuta(s))</b></td><td class="td-right num"><b>${gT.n}</b></td><td class="td-right num"><b>${fmtUSDShort(gT.p)}</b></td><td class="td-right num"><b>${fmtUSDShort(gT.g)}</b></td><td class="td-right num"><b>${fmtUSDShort(gT.p+gT.g)}</b></td></tr>` : '';
    document.getElementById('boTer2').innerHTML = Object.entries(g).sort((a,b)=>(b[1].p+b[1].g)-(a[1].p+a[1].g)).map(([k,r])=>`<tr><td><b>${escapeHtml(tn(k))}</b></td><td class="td-right num">${r.n}</td><td class="td-right num">${fmtUSDShort(r.p)}</td><td class="td-right num">${fmtUSDShort(r.g)}</td><td class="td-right num">${fmtUSDShort(r.p+r.g)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="5">Sin sesiones.</td></tr>';
    const bs = document.getElementById('boStu');
    let sT = null;
    if(bs){
      const rows = DB.students.filter(s=>(!sf||s.id===sf) && (!pgf||tienePrograma(s,pgf))).map(s=>({s, i:bolsilloInfo(s.id)})).filter(x=>Math.abs(x.i.acum)>0.005 || x.i.pend>0 || x.i.pag>0).sort((a,b)=>b.i.saldo-a.i.saldo);
      sT = rows.reduce((a,{i})=>({k:a.k+1, acum:a.acum+i.acum, n:a.n+i.n, pend:a.pend+i.pend, pag:a.pag+i.pag, saldo:a.saldo+i.saldo, disp:a.disp+i.disp}),{k:0,acum:0,n:0,pend:0,pag:0,saldo:0,disp:0});
      const sf2 = document.getElementById('boStuF');
      if(sf2) sf2.innerHTML = rows.length ? `<tr class="bo-tot bo-tot-main"><td><b>TOTAL (${sT.k} estudiante(s))</b></td><td class="td-right num"><b>${fmtUSDShort(sT.acum)}</b></td><td class="td-right num"><b>${sT.n}</b></td><td class="td-right num"><b>${fmtUSDShort(sT.pend)}</b></td><td class="td-right num"><b>${fmtUSDShort(sT.pag)}</b></td><td class="td-right num"><b>${fmtUSDShort(sT.saldo)}</b></td><td class="td-right num"><b>${fmtUSDShort(sT.disp)}</b></td></tr>` : '';
      bs.innerHTML = rows.map(({s,i})=>`<tr class="clickable" data-action="open-student" data-id="${escapeHtml(s.id)}"><td><b>${escapeHtml(s.nombre)}</b></td><td class="td-right num">${fmtUSDShort(i.acum)}</td><td class="td-right num">${i.n} de ${sesionesMax(s.id)}</td><td class="td-right num">${fmtUSDShort(i.pend)}</td><td class="td-right num">${fmtUSDShort(i.pag)}</td><td class="td-right num" style="font-weight:700; color:${i.saldo>=-0.005?'var(--green)':'var(--clay)'};">${fmtUSDShort(i.saldo)}</td><td class="td-right num" style="color:${i.disp>=-0.005?'var(--green)':'var(--clay)'};">${fmtUSDShort(i.disp)}</td></tr>`).join('') || '<tr class="empty-row"><td colspan="7">Aún no hay bolsillo acumulado: se llena con el campo "Bolsillo" de cada pago.</td></tr>';
    }
    /* Totales de control: cuadre entre la lista de sesiones, el resumen por terapeuta y el bolsillo */
    const ok = (a,b)=>Math.abs(a-b)<0.01, chk = c=>c?'<span class="bo-ok">✔ Cuadra</span>':'<span class="bo-bad">✖ No cuadra</span>';
    const nStu = new Set(list.map(b=>b.estudianteId)).size;
    const cR = (lab, val, extra)=>`<tr><td>${lab}</td><td class="td-right num"><b>${val}</b></td><td>${extra||''}</td></tr>`;
    document.getElementById('boControl').innerHTML = `<div class="table-wrap"><table class="bo-ctl"><thead><tr><th>Control</th><th class="td-right">Valor</th><th>Verificación</th></tr></thead><tbody>
      ${cR('Sesiones registradas (lista)', list.length, '')}
      ${cR('Sesiones pendientes de pago', nPend+' · '+fmtUSDShort(pend), '')}
      ${cR('Sesiones pagadas a terapeutas', nPag+' · '+fmtUSDShort(pag), '')}
      ${cR('Total valor de sesiones (lista)', fmtUSDShort(pend+pag), chk(ok(pend+pag, sum(list,()=>true))))}
      ${cR('Total por terapeuta', gT.n+' sesiones · '+fmtUSDShort(gT.p+gT.g), chk(gT.n===list.length && ok(gT.p+gT.g, pend+pag))+' <span class="muted">vs. lista</span>')}
      ${cR('Estudiantes con sesiones', nStu, '')}
      ${cR('Terapeutas con sesiones', Object.keys(g).length, '')}
      ${cR('Valor promedio por sesión', fmtUSDShort(list.length?(pend+pag)/list.length:0), '')}
      ${sT ? cR('Bolsillo acumulado (estudiantes)', fmtUSDShort(sT.acum), '') + cR('Saldo del bolsillo (acumulado − pagadas)', fmtUSDShort(sT.saldo), chk(ok(sT.saldo, sT.acum - sT.pag))) + cR('Disponible (saldo − pendientes)', fmtUSDShort(sT.disp), chk(ok(sT.disp, sT.saldo - sT.pend))) : ''}
    </tbody></table></div>
    <p class="field-hint" style="margin-top:8px;">La lista y el resumen por terapeuta respetan todos los filtros. El bolsillo por estudiante solo respeta los filtros de estudiante y programa (es acumulado), por eso puede diferir del total de la lista cuando filtras por terapeuta, estado o fechas.</p>`;
  }
  ['boSearch','boEst','boProg','boTer','boEstado','boDesde','boHasta'].forEach(id=>{ const el = document.getElementById(id); el.addEventListener('input', draw); el.addEventListener('change', draw); });
  draw();
}
function openBonoModal(bonoId, prefillStu, pre){
  const editing = !!bonoId;
  const b = editing ? (DB.bonos||[]).find(x=>x.id===bonoId) : {fecha:(pre&&pre.fecha)||todayIso(), estudianteId:prefillStu||'', terapeutaId:prefillStu?defaultTerapeutaFor(prefillStu):'', monto:'', concepto:'', estado:'PENDIENTE', fechaPago:'', observaciones:''};
  if(!b){ toast('No se encontró la sesión.','err'); return; }
  const stus = DB.students.slice().sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre),'es',{sensitivity:'base'}));
  const isTer = isTerapeutaRole();
  let ters = therapistsList();
  if(isTer){ b.terapeutaId = myCloserId(); ters = [getCloser(myCloserId())].filter(Boolean); }
  if(b.terapeutaId && !ters.some(c=>c.id===b.terapeutaId) && getCloser(b.terapeutaId)) ters.push(getCloser(b.terapeutaId));
  showModal(`<div class="modal"><div class="modal-head"><h3>${editing?'Editar sesión':'Registrar sesión'}</h3><button class="x-close" data-action="close-modal">×</button></div>
  <form id="bonoForm"><div class="modal-body"><div class="form-grid">
    <div><label>Fecha de la sesión <span class="req">*</span></label><input type="text" name="fechaTxt" required inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${fechaTxt(b.fecha)}"><div class="field-hint">Escríbela, ej: 25/11/2026</div></div>
    <div><label>Sesión n.º <span class="req">*</span></label><select name="sesion" id="bo_ses" required></select></div>
    <div><label>Valor de la sesión (USD) <span class="req">*</span></label><input type="text" inputmode="decimal" name="monto" id="bo_monto" value="${b.monto===''?'':escapeHtml(String(parseNum(b.monto)))}" placeholder="Ej: 20"></div>
    <div class="full"><label>Estudiante (de cuyo bolsillo sale) <span class="req">*</span></label><select name="estudianteId" id="bo_est" required><option value="">— Selecciona —</option>${stus.map(s=>`<option value="${escapeHtml(s.id)}" ${b.estudianteId===s.id?'selected':''}>${escapeHtml(s.nombre)}</option>`).join('')}</select><div class="field-hint" id="bo_info"></div></div>
    <div class="full"><label>Terapeuta asociado <span class="req">*</span></label><select name="terapeutaId" id="bo_ter" required><option value="">— Selecciona —</option>${ters.map(c=>`<option value="${escapeHtml(c.id)}" ${b.terapeutaId===c.id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('')}</select><div class="field-hint">Se sugiere el tutor o el terapeuta del último pago del estudiante; puedes cambiarlo.</div></div>
    <div class="full"><label>Concepto</label><input type="text" name="concepto" value="${escapeHtml(b.concepto)}" placeholder="Ej: Sesión adicional"></div>
    ${isTer ? '<input type="hidden" name="estado" value="PENDIENTE"><div class="full field-hint">La sesión queda <b>pendiente de pago</b>; un administrador la marca como pagada y ahí se descuenta del bolsillo del estudiante.</div>' : `<div><label>Estado</label><select name="estado"><option value="PENDIENTE" ${b.estado!=='PAGADO'?'selected':''}>Pendiente de pago</option><option value="PAGADO" ${b.estado==='PAGADO'?'selected':''}>Pagada al terapeuta</option></select></div>
    <div><label>Fecha de pago al terapeuta</label><input type="date" name="fechaPago" value="${escapeHtml(b.fechaPago||'')}"></div>`}
    <div class="full"><label>Observaciones</label><textarea name="observaciones">${escapeHtml(b.observaciones)}</textarea></div>
    <div class="full" id="bo_excesoBox" style="display:none;"><label style="display:flex; gap:8px; align-items:center; font-weight:600;"><input type="checkbox" name="permitirExceso" value="1"> Registrar aunque supere el bolsillo disponible (quedará en negativo)</label></div>
  </div></div>
  <div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-gold">Guardar</button></div></form></div>`);
  const est = document.getElementById('bo_est'), monto = document.getElementById('bo_monto'), info = document.getElementById('bo_info'), box = document.getElementById('bo_excesoBox'), ter = document.getElementById('bo_ter');
  const sesSel = document.getElementById('bo_ses');
  function fillSes(){
    if(!est.value){ sesSel.innerHTML = '<option value="">— Elige estudiante —</option>'; return; }
    const sl = sesionesSlots(est.value, editing?b.id:null), cur = editing ? sesionNum(b) : 0;
    const want = sesSel.value ? +sesSel.value : (cur || (pre&&pre.sesion) || 0);
    const free = []; sl.forEach((x,k)=>{ if(!x) free.push(k+1); });
    sesSel.innerHTML = free.map(n=>`<option value="${n}">Sesión ${n} de ${sesionesMax(est.value)}</option>`).join('') || '<option value="">Sin sesiones libres</option>';
    if(free.includes(want)) sesSel.value = String(want);
  }
  function upd(){
    fillSes();
    if(!est.value){ info.textContent = ''; box.style.display = 'none'; return; }
    const i = bolsilloInfo(est.value, editing?b.id:null), m = parseNum(monto.value);
    info.innerHTML = 'Bolsillo acumulado '+fmtUSDShort(i.acum)+' · sesiones ya registradas '+fmtUSDShort(i.pend+i.pag)+' · <b>disponible '+fmtUSDShort(i.disp)+'</b><br>Sesiones usadas: <b>'+i.n+' de '+sesionesMax(est.value)+'</b> (quedan '+i.restantes+')'+(i.n>=sesionesMax(est.value)?' · <b style="color:var(--clay);">ya usó sus '+sesionesMax(est.value)+' sesiones personalizadas</b>':'');
    box.style.display = (m>0 && m>i.disp+0.005) ? '' : 'none';
  }
  est.addEventListener('change', ()=>{ if(!editing || !ter.value){ const t = defaultTerapeutaFor(est.value); if(t && [...ter.options].some(o=>o.value===t)) ter.value = t; } upd(); });
  monto.addEventListener('input', upd); upd();
  document.getElementById('bonoForm').addEventListener('submit', async e=>{
    e.preventDefault();
    if(window.__boSaving) return; window.__boSaving = true;
    try{
      const obj = Object.fromEntries(new FormData(e.target).entries());
      if(!obj.estudianteId){ toast('Selecciona el estudiante.','err'); return; }
      if(!obj.terapeutaId){ toast('Selecciona el terapeuta.','err'); return; }
      obj.fecha = parseFechaTxt(obj.fechaTxt); delete obj.fechaTxt;
      if(!obj.fecha){ toast('Escribe una fecha válida para la sesión (dd/mm/aaaa).','err'); return; }
      if(obj.estudianteId && bolsilloInfo(obj.estudianteId, editing?b.id:null).n >= sesionesMax(obj.estudianteId)){ toast('Este estudiante ya usó sus '+sesionesMax(obj.estudianteId)+' sesiones personalizadas. No se pueden registrar más.','err'); return; }
      obj.sesion = parseInt(obj.sesion,10);
      if(!(obj.sesion>=1 && obj.sesion<=sesionesMax(obj.estudianteId))){ toast('Elige el número de sesión (1 a '+sesionesMax(obj.estudianteId)+').','err'); return; }
      const mErr = valNumber(obj.monto,'El valor de la sesión',{required:true, minExcl:0, max:1e12});
      if(mErr){ toast(mErr,'err'); return; }
      obj.monto = parseNum(obj.monto);
      const i = bolsilloInfo(obj.estudianteId, editing?b.id:null);
      if(i.n >= sesionesMax(obj.estudianteId)){ toast('Este estudiante ya usó sus '+sesionesMax(obj.estudianteId)+' sesiones personalizadas. No se pueden registrar más.','err'); return; }
      const subeMonto = !editing || obj.estudianteId!==b.estudianteId || obj.monto > parseNum(b.monto)+0.005;   // editar sin aumentar el valor no vuelve a pedir la casilla
      if(!isTer && subeMonto && obj.monto > i.disp+0.005 && !obj.permitirExceso){ toast('La sesión ('+fmtUSD(obj.monto)+') supera el bolsillo disponible del estudiante ('+fmtUSD(Math.max(0,i.disp))+'). Marca "Registrar aunque supere…" si es intencional.','err'); document.getElementById('bo_excesoBox').style.display=''; return; }
      delete obj.permitirExceso;
      if(isTer){ obj.terapeutaId = myCloserId(); obj.estado = 'PENDIENTE'; }
      if(obj.estado==='PAGADO' && !obj.fechaPago) obj.fechaPago = todayIso();
      if(obj.estado!=='PAGADO') obj.fechaPago = '';
      obj.estudianteNombre = (getStudent(obj.estudianteId)||{}).nombre || '';
      let target;
      let prevSnap = null;
      if(editing){ target = (DB.bonos||[]).find(x=>x.id===b.id) || b; prevSnap = JSON.stringify(target); Object.assign(target, obj); }
      else { target = Object.assign({id:uid('B'), creado:todayIso(), registradoPor:(authRequired&&currentUser)?currentUser.id:''}, obj); DB.bonos.push(target); }
      if(await saveEntity('bonos', target)===false){ if(!editing) DB.bonos = DB.bonos.filter(x=>x!==target); else { const o = JSON.parse(prevSnap); Object.keys(target).forEach(k=>{ if(!(k in o)) delete target[k]; }); Object.assign(target, o); } return; }
      closeModal(); renderView();
      toast((editing?'✅ Sesión actualizada.':'✅ Sesión personalizada registrada: sale del bolsillo del estudiante.')+savedWhereTxt(), STORAGE_MODE==='db'?'ok':'err');
    } finally { window.__boSaving = false; }
  });
}
async function setBonoEstado(id, estado){
  const b = (DB.bonos||[]).find(x=>x.id===id); if(!b) return;
  const prev = {estado:b.estado, fechaPago:b.fechaPago};
  b.estado = estado; b.fechaPago = estado==='PAGADO' ? todayIso() : '';
  if(await saveEntity('bonos', b)===false){ Object.assign(b, prev); renderView(); return; }
  const sv = bolsilloInfo(b.estudianteId).saldo;
  toast(estado==='PAGADO' ? '✅ Sesión pagada al terapeuta: se restaron '+fmtUSDShort(parseNum(b.monto))+' del bolsillo. Saldo del bolsillo: '+fmtUSDShort(sv)+'.' : 'Sesión marcada como pendiente: se devolvieron '+fmtUSDShort(parseNum(b.monto))+' al bolsillo. Saldo: '+fmtUSDShort(sv)+'.','ok'); renderView();
}

/* ================= ANÁLISIS POR CLOSER ================= */
let analysisMesFiltro = '';
let analysisProgramaFiltro = '';
let analysisDesde = '', analysisHasta = '';
function renderAnalysis(){
  setTopbar('Gestión', 'Analisis por Closer y Terapeutas', '');
  const mesesSet = {};
  DB.payments.forEach(p=>{ const c=corteMes(p.fecha); mesesSet[c.key]=c.label; });
  const mesesKeys = Object.keys(mesesSet).sort().reverse();

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="search-bar">
      <label style="margin:0; font-weight:600; color:var(--ink-soft);">📅 Filtrar por mes:</label>
      <select id="analysisMes" style="max-width:220px;">
        <option value="">Todos los meses (acumulado)</option>
        ${mesesKeys.map(k=>`<option value="${k}" ${analysisMesFiltro===k?'selected':''}>${mesesSet[k]}</option>`).join('')}
      </select>
      <label style="margin:0 0 0 12px; font-weight:600; color:var(--ink-soft);">📚 Programa:</label>
      <select id="analysisPrograma" style="max-width:260px;">
        <option value="">Todos los programas</option>
        ${programasFiltroList().map(n=>`<option value="${escapeHtml(n)}" ${analysisProgramaFiltro===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
      ${dateRangeHTML('anDesde','anHasta',analysisDesde,analysisHasta)}
      <span class="spacer"></span>
      <span class="muted" style="font-size:12px;">Cartera / cobrado / saldo son acumulados a la fecha; comisión y pago a terapeuta se filtran por mes. El programa filtra todo.</span>
    </div>
    <div id="analysisBody"></div>
  `;
  document.getElementById('analysisMes').addEventListener('change', e=>{
    analysisMesFiltro = e.target.value;
    drawAnalysisBody();
  });
  ['anDesde','anHasta'].forEach(id=>document.getElementById(id).addEventListener('input', ()=>{
    analysisDesde = document.getElementById('anDesde').value; analysisHasta = document.getElementById('anHasta').value; drawAnalysisBody();
  }));
  document.getElementById('analysisPrograma').addEventListener('change', e=>{
    analysisProgramaFiltro = e.target.value;
    drawAnalysisBody();
  });
  drawAnalysisBody();
}

function drawAnalysisBody(){
  const mesKey = analysisMesFiltro;
  const hayRango = !!(analysisDesde||analysisHasta);
  const mesLabel = mesKey ? (()=>{ const found = DB.payments.map(p=>corteMes(p.fecha)).find(c=>c.key===mesKey); return found?found.label:mesKey; })() : (hayRango ? ((analysisDesde?fmtDate(analysisDesde):'…')+' → '+(analysisHasta?fmtDate(analysisHasta):'…')) : 'Todos los meses');

  const progKey = analysisProgramaFiltro;
  const pagosBase = DB.payments.filter(p=>(!progKey || programaDePago(p)===progKey) && inRange(p.fecha, analysisDesde, analysisHasta));
  const rows = visibleClosers().map(c=>{
    const misEstudiantes = DB.students.filter(s=>s.closer===c.id && (!progKey || tienePrograma(s,progKey)));
    let carteraTotal=0, cobrado=0;
    misEstudiantes.forEach(s=>{ const t = totalsProg(s, progKey); carteraTotal+=t.valorTotal; cobrado+=t.totalPagadoUSD; });
    const saldo = carteraTotal - cobrado;
    const pctRecup = carteraTotal>0 ? cobrado/carteraTotal : 0;

    let misPagos = pagosBase.filter(p=>p.closer===c.id);
    if(mesKey) misPagos = misPagos.filter(p=>corteMes(p.fecha).key===mesKey);
    let comision=0, netoGenerado=0, ingresoNetoTotal=0;
    misPagos.forEach(p=>{ const calc=calcPayment(p); comision+=calc.valorComisionCloserUSD; netoGenerado+=calc.netoAmarYYaUSD; ingresoNetoTotal+=calc.ingresoNetoUSD; });
    const pctEfectivo = ingresoNetoTotal>0 ? comision/ingresoNetoTotal : null;

    let pagosComoTerapeuta = pagosBase.filter(p=>p.nombreTerapeuta===c.id);
    if(mesKey) pagosComoTerapeuta = pagosComoTerapeuta.filter(p=>corteMes(p.fecha).key===mesKey);
    let pagoTerapeutaTotal = 0, bonoTotal = 0;
    pagosComoTerapeuta.forEach(p=>{ pagoTerapeutaTotal += calcPayment(p).pagoTerapeutaUSD; });
    // El bono se asigna al terapeuta indicado en "Terapeuta del bono"
    let pagosConBono = pagosBase.filter(p=>calcPayment(p).bonoTerapeutaId===c.id);
    if(mesKey) pagosConBono = pagosConBono.filter(p=>corteMes(p.fecha).key===mesKey);
    pagosConBono.forEach(p=>{ bonoTotal += calcPayment(p).bonosUSD; });

    let pagosComoApoyo = pagosBase.filter(p=>p.apoyoCloser===c.id);
    if(mesKey) pagosComoApoyo = pagosComoApoyo.filter(p=>corteMes(p.fecha).key===mesKey);
    let apoyoTotal = 0;
    pagosComoApoyo.forEach(p=>{ apoyoTotal += calcPayment(p).valorComisionApoyoUSD; });

    const totalAPagar = comision + apoyoTotal + pagoTerapeutaTotal + bonoTotal;
    return {c, misEstudiantes:misEstudiantes.length, carteraTotal, cobrado, saldo, pctRecup, comision, apoyoTotal, netoGenerado, pagoTerapeutaTotal, bonoTotal, totalTerapeuta:pagoTerapeutaTotal+bonoTotal, totalAPagar, pctEfectivo};
  });
  const totales = rows.reduce((a,r)=>({est:a.est+r.misEstudiantes, cart:a.cart+r.carteraTotal, cob:a.cob+r.cobrado, sal:a.sal+r.saldo, com:a.com+r.comision, net:a.net+r.netoGenerado, ter:a.ter+r.pagoTerapeutaTotal, apo:a.apo+r.apoyoTotal, bon:a.bon+r.bonoTotal, tt:a.tt+r.totalTerapeuta, pag:a.pag+r.totalAPagar}), {est:0,cart:0,cob:0,sal:0,com:0,net:0,ter:0,apo:0,bon:0,tt:0,pag:0});

  // Resultado del período: de lo cobrado se restan plataforma, comisiones, terapeutas y bonos
  const pagosPeriodo = mesKey ? pagosBase.filter(p=>corteMes(p.fecha).key===mesKey) : pagosBase;
  const res = {cobrado:0, plat:0, comis:0, apo:0, ter:0, bono:0, neto:0, bol:0, aho:0, fin:0};
  pagosPeriodo.forEach(p=>{ const cc=calcPayment(p); res.cobrado+=cc.valorUSD; res.plat+=cc.valorComisionPlataformaUSD; res.comis+=cc.valorComisionCloserUSD; res.apo+=cc.valorComisionApoyoUSD; res.ter+=cc.pagoTerapeutaUSD; res.bono+=cc.bonosUSD; res.neto+=cc.netoAmarYYaUSD; res.bol+=cc.bolsilloUSD; res.aho+=cc.ahorroUSD; res.fin+=cc.netoFinalUSD; });

  const listaRec = [...pagosBase].filter(p=> !mesKey || corteMes(p.fecha).key===mesKey).sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,20);
  const recT = listaRec.reduce((a,p)=>{const c=calcPayment(p); return {u:a.u+c.valorUSD,c:a.c+c.valorComisionCloserUSD,a:a.a+c.valorComisionApoyoUSD,t:a.t+c.pagoTerapeutaUSD,b:a.b+c.bonosUSD,n:a.n+c.netoAmarYYaUSD,bl:a.bl+c.bolsilloUSD};},{u:0,c:0,a:0,t:0,b:0,n:0,bl:0});

  const bodyLabel = mesKey ? `Comisión de ${mesLabel}` : 'Comisión Generada';
  document.getElementById('analysisBody').innerHTML = `
    <div class="grid grid-5">
      <div class="card kpi k-gold"><div class="bar"></div><div class="lbl">Comisión de closers · ${mesLabel}</div><div class="val" style="font-size:22px;">${fmtUSDShort(totales.com)}</div></div>
      <div class="card kpi k-gold"><div class="bar"></div><div class="lbl">Comisión apoyo closer</div><div class="val" style="font-size:22px;">${fmtUSDShort(totales.apo)}</div></div>
      <div class="card kpi k-indigo"><div class="bar"></div><div class="lbl">Pago terapeutas (sesión)</div><div class="val" style="font-size:22px;">${fmtUSDShort(totales.ter)}</div></div>
      <div class="card kpi k-indigo"><div class="bar"></div><div class="lbl">Bono terapeutas</div><div class="val" style="font-size:22px;">${fmtUSDShort(totales.bon)}</div></div>
      <div class="card kpi k-green"><div class="bar"></div><div class="lbl">Total a pagar · ${mesLabel}</div><div class="val" style="font-size:22px;">${fmtUSDShort(totales.pag)}</div></div>
    </div>
    <div class="section-title" style="margin-top:20px;"><h3>💰 Cuánto pagar por closer${mesKey?' — '+mesLabel:''}${progKey?' · 📚 '+escapeHtml(progKey):''}</h3><span class="hint">Comisión de venta + comisión como apoyo + pago por sesión + bono (sumado al pago del terapeuta)</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Closer</th><th>Forma de pago</th><th class="td-right">Estudiantes</th><th class="td-right">Cartera Total</th><th class="td-right">Cobrado</th><th class="td-right">Saldo</th><th class="td-right">% Recup.</th><th class="td-right">% Comisión efectiva</th><th class="td-right">${bodyLabel}</th><th class="td-right">Comisión Apoyo</th><th class="td-right">Pago Terapeuta</th><th class="td-right">Bono Terapeuta</th><th class="td-right">Total Terapeuta</th><th class="td-right">Total a Pagar</th></tr></thead>
      <tbody>
      ${rows.map(r=>`<tr>
        <td><b>${escapeHtml(r.c.nombre)}</b><div class="muted" style="font-size:11px;">${escapeHtml(r.c.paisCiudad)}${r.c.esTerapeuta==='SI'?' · <span class="pill pill-gold" style="padding:1px 6px;">Terapeuta</span>':''}</div></td>
        <td style="font-size:12.5px;">${r.c.formaPago?escapeHtml(r.c.formaPago):'<span class="muted">—</span>'}${r.c.cuentaPago?`<div class="muted" style="font-size:11px;">${escapeHtml(r.c.cuentaPago)}</div>`:''}</td>
        <td class="td-right num">${r.misEstudiantes}</td>
        <td class="td-right num">${fmtUSDShort(r.carteraTotal)}</td>
        <td class="td-right num">${fmtUSDShort(r.cobrado)}</td>
        <td class="td-right num" style="color:${r.saldo>0.01?'var(--clay)':'var(--green)'};">${fmtUSDShort(r.saldo)}</td>
        <td class="td-right num">${fmtPct(r.pctRecup)}</td>
        <td class="td-right num muted">${r.pctEfectivo===null?'—':fmtPct(r.pctEfectivo)}</td>
        <td class="td-right num" style="font-weight:700;">${fmtUSDShort(r.comision)}</td>
        <td class="td-right num" style="${r.apoyoTotal?'font-weight:700;':'color:var(--ink-faint);'}">${r.apoyoTotal?fmtUSDShort(r.apoyoTotal):'—'}</td>
        <td class="td-right num" style="${r.pagoTerapeutaTotal?'font-weight:700;':'color:var(--ink-faint);'}">${r.pagoTerapeutaTotal?fmtUSDShort(r.pagoTerapeutaTotal):'—'}</td>
        <td class="td-right num" style="${r.bonoTotal?'font-weight:700;':'color:var(--ink-faint);'}">${r.bonoTotal?fmtUSDShort(r.bonoTotal):'—'}</td>
        <td class="td-right num" style="${r.totalTerapeuta?'font-weight:700; color:var(--indigo);':'color:var(--ink-faint);'}">${r.totalTerapeuta?fmtUSDShort(r.totalTerapeuta):'—'}</td>
        <td class="td-right num" style="font-weight:800; color:var(--indigo); background:var(--gold-pale);">${fmtUSDShort(r.totalAPagar)}</td>
      </tr>`).join('') || '<tr class="empty-row"><td colspan="14">No hay closers registrados.</td></tr>'}
      </tbody>
      <tfoot><tr style="background:var(--paper-deep); font-weight:700;">
        <td>▶ TOTAL</td><td></td><td class="td-right num">${totales.est}</td><td class="td-right num">${fmtUSDShort(totales.cart)}</td>
        <td class="td-right num">${fmtUSDShort(totales.cob)}</td><td class="td-right num">${fmtUSDShort(totales.sal)}</td><td></td><td></td>
        <td class="td-right num">${fmtUSDShort(totales.com)}</td><td class="td-right num">${fmtUSDShort(totales.apo)}</td><td class="td-right num">${fmtUSDShort(totales.ter)}</td><td class="td-right num">${fmtUSDShort(totales.bon)}</td><td class="td-right num">${fmtUSDShort(totales.tt)}</td><td class="td-right num">${fmtUSDShort(totales.pag)}</td>
      </tr></tfoot>
    </table></div>
    <p class="field-hint" style="margin-top:8px;">Cartera, cobrado y saldo son acumulados a la fecha (incluyen Datos_Base + pagos nuevos). Comisión, pago a terapeuta y total a pagar se calculan solo con pagos registrados como transacción en "Registro de Pagos" para ${mesKey?mesLabel:'todos los meses'}.</p>
    <div class="section-title"><h3>🧮 Resultado${mesKey?' — '+mesLabel:''}${progKey?' · 📚 '+escapeHtml(progKey):''}</h3><span class="hint">Neto AmarYYa restando comisiones, terapeutas, bonos y bolsillo</span></div>
    <div class="card" style="max-width:520px;">
      <div class="preview-box" style="margin-top:0;">
        <div class="row"><span class="lab">Cobrado (USD)</span><b>${fmtUSD(res.cobrado)}</b></div>
        <div class="row"><span class="lab">− Comisión plataformas</span><span>−${fmtUSDShort(res.plat)}</span></div>
        <div class="row"><span class="lab">− Comisión closers</span><span>−${fmtUSDShort(res.comis)}</span></div>
        <div class="row"><span class="lab">− Comisión apoyo closer</span><span>−${fmtUSDShort(res.apo)}</span></div>
        <div class="row"><span class="lab">− Pago terapeutas (sesión)</span><span>−${fmtUSDShort(res.ter)}</span></div>
        <div class="row"><span class="lab">− Bono terapeutas</span><span>−${fmtUSDShort(res.bono)}</span></div>
        <hr>
        <div class="row"><span class="lab">− Bolsillo</span><span>−${fmtUSDShort(res.bol)}</span></div>
        <div class="row"><b>Neto Universidad AmarYYa (después del bolsillo)</b><b>${fmtUSD(res.neto)}</b></div>
        <div class="row"><span class="lab">− Ahorro (10% sobre el Neto AmarYYa)</span><span>−${fmtUSDShort(res.aho)}</span></div>
        <hr>
        <div class="row"><b>Neto final</b><b>${fmtUSD(res.fin)}</b></div>
      </div>
    </div>
    <div class="section-title"><h3>Pagos ${mesKey?('de '+mesLabel):'recientes'} por closer</h3></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Estudiante</th><th>Closer</th><th>Apoyo</th><th>Terapeuta</th><th class="td-right">Valor USD</th><th class="td-right">Comisión</th><th class="td-right">Com. Apoyo</th><th class="td-right">− Pago Terap.</th><th class="td-right">− Bono</th><th class="td-right">− Bolsillo</th><th class="td-right">Neto AmarYYa</th><th>Corte</th></tr></thead>
      <tbody>
      ${listaRec.map(p=>{
        const calc=calcPayment(p); const st=getStudent(p.estudianteId); const terap=getCloser(p.nombreTerapeuta); const ap=getCloser(p.apoyoCloser);
        return `<tr><td>${fmtDate(p.fecha)}</td><td>${escapeHtml(st?st.nombre:p.estudianteNombre)}</td><td>${escapeHtml(p.closer)}</td><td>${ap?escapeHtml(ap.nombre):'<span class="muted">—</span>'}</td><td>${terap?escapeHtml(terap.nombre):'<span class="muted">—</span>'}</td>
        <td class="td-right num">${fmtUSDShort(calc.valorUSD)}</td><td class="td-right num">${fmtUSDShort(calc.valorComisionCloserUSD)}</td><td class="td-right num">${calc.valorComisionApoyoUSD?fmtUSDShort(calc.valorComisionApoyoUSD):'—'}</td><td class="td-right num">${calc.pagoTerapeutaUSD?fmtUSDShort(calc.pagoTerapeutaUSD):'—'}</td><td class="td-right num">${calc.bonosUSD?fmtUSDShort(calc.bonosUSD):'—'}${calc.bonosUSD?`<div class="muted" style="font-size:10.5px;">${escapeHtml((getCloser(calc.bonoTerapeutaId)||{}).nombre||'')}</div>`:''}</td><td class="td-right num">${calc.bolsilloUSD?fmtUSDShort(calc.bolsilloUSD):'—'}</td><td class="td-right num" style="color:var(--green);">${fmtUSDShort(calc.netoAmarYYaUSD)}</td><td><span class="pill pill-gold">${calc.corte.label}</span></td></tr>`;
      }).join('') || '<tr class="empty-row"><td colspan="13">Sin pagos en este período.</td></tr>'}
      </tbody>

}

    <div class="table-wrap"><table>
      <thead><tr><th>Closer</th><th>Contacto</th><th>País</th><th>Forma de pago</th><th>¿Terapeuta?</th><th>Usuario APP</th><th>Estado</th><th></th></tr></thead>
      <tbody>
      ${DB.closers.map(c=>{ const ua = c.usuarioApp==='SI'; const uu = ua ? authUserOfCloser(c) : null; return `<tr>

        <td>${ua?`<span class="pill pill-green">Sí · ${authAppRole(c)==='TERAPEUTA'?'terapeuta':'closer'}</span>${uu?(uu.mustChange?'<div class="muted" style="font-size:11px;">1er ingreso pendiente</div>':''):(VAL_EMAIL.test(normEmail(c.email))?'<div class="muted" style="font-size:11px;">Usuario pendiente de crear</div>':'<div style="font-size:11px; color:var(--red);">Falta email</div>')}`:'<span class="pill pill-gray">No</span>'}</td>

      </tbody>
    </table></div>
    <p class="field-hint" style="margin-top:10px;">🔑 <b>Usuario APP = Sí</b> crea el acceso a la app con el email de la persona como usuario y la contraseña inicial <b>${AUTH_INIT_PASS}</b>; en su primer ingreso la app le obliga a cambiarla. La contraseña se guarda cifrada.</p>

}
function openCloserModal(id){
  const editing = !!id;
  const c = editing ? getCloser(id) : {id:'', nombre:'',email:'',telefono:'',paisCiudad:'',formaPago:'',cuentaPago:'',observacionesComision:'',estado:'ACTIVO',esTerapeuta:'NO',usuarioApp:'NO',rolApp:''};
  const html = `
  <div class="modal">
    <div class="modal-head"><h3>${editing?'Editar Closer':'Nuevo Closer'}</h3><button class="x-close" data-action="close-modal">×</button></div>
    <form id="closerForm">
      <div class="modal-body">
        <div class="form-grid">
          <div class="full"><label>Nombre <span class="req">*</span></label><input type="text" name="nombre" required value="${escapeHtml(c.nombre)}" ${editing?'':''}></div>
          <div><label>Email</label><input type="email" name="email" value="${escapeHtml(c.email)}"></div>
          <div><label>Teléfono / WhatsApp</label><input type="text" name="telefono" value="${escapeHtml(c.telefono)}"></div>
          <div><label>País / Ciudad</label><input type="text" name="paisCiudad" value="${escapeHtml(c.paisCiudad)}"></div>
          <div><label>Forma de pago</label><input type="text" name="formaPago" value="${escapeHtml(c.formaPago)}" placeholder="Zelle, Binance, ARQ…"></div>
          <div><label>Usuario / Cuenta de pago</label><input type="text" name="cuentaPago" value="${escapeHtml(c.cuentaPago)}"></div>
          <div><label>Estado</label><select name="estado"><option value="ACTIVO" ${c.estado==='ACTIVO'?'selected':''}>Activo</option><option value="INACTIVO" ${c.estado==='INACTIVO'?'selected':''}>Inactivo</option></select></div>
          <div><label>¿Es Terapeuta?</label><select name="esTerapeuta">
            <option value="NO" ${c.esTerapeuta!=='SI'?'selected':''}>No — Solo Closer</option>
            <option value="SI" ${c.esTerapeuta==='SI'?'selected':''}>Sí — Atiende estudiantes</option>
          </select></div>
          <div><label>Usuario APP <span class="req">*</span></label><select name="usuarioApp" id="cfUsr">
            <option value="NO" ${c.usuarioApp!=='SI'?'selected':''}>No — no ingresa a la app</option>
            <option value="SI" ${c.usuarioApp==='SI'?'selected':''}>Sí — tiene usuario de la app</option>
          </select></div>
          <div id="cfRolWrap"><label>Rol en la app</label><select name="rolApp" id="cfRol">
            <option value="" ${!c.rolApp?'selected':''}>Automático (según ¿Es terapeuta?)</option>
            <option value="CLOSER" ${c.rolApp==='CLOSER'?'selected':''}>Closer — registra pagos</option>
            <option value="TERAPEUTA" ${c.rolApp==='TERAPEUTA'?'selected':''}>Terapeuta — solo lectura</option>
          </select></div>
          <div class="full" id="cfUsrHint"><div class="field-hint">Con Usuario APP = Sí el email es obligatorio: será su usuario. Contraseña inicial: <b>${AUTH_INIT_PASS}</b> (cambio obligatorio en el primer ingreso).</div></div>
          <div class="full"><label>Observaciones</label><textarea name="observacionesComision">${escapeHtml(c.observacionesComision)}</textarea></div>
        </div>
        <p class="field-hint">El % de comisión de este closer se define en cada pago, dentro de Registro de Pagos — no aquí. Marca "Terapeuta" si esta persona también atiende sesiones.</p>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-outline" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-gold">Guardar</button></div>
    </form>
  </div>`;
  showModal(html);
  const cfSync = ()=>{ const on = document.getElementById('cfUsr').value==='SI'; document.getElementById('cfRolWrap').style.display = on?'':'none'; document.getElementById('cfUsrHint').style.display = on?'':'none'; };
  document.getElementById('cfUsr').addEventListener('change', cfSync); cfSync();
  document.getElementById('closerForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const obj = Object.fromEntries(new FormData(e.target).entries());
    obj.nombre = String(obj.nombre||'').trim();
    if(!obj.nombre){ toast('El nombre es obligatorio.','err'); return; }
    if(obj.nombre.length>80){ toast('El nombre es demasiado largo (máx. 80 caracteres).','err'); return; }
    if(DB.closers.some(x=>x.id!==c.id && ioNorm(x.nombre)===ioNorm(obj.nombre))){ toast('Ya existe un closer con ese nombre.','err'); return; }
    if(String(obj.email||'').trim() && !VAL_EMAIL.test(String(obj.email).trim())){ toast('El email no tiene un formato válido.','err'); return; }
    obj.email = normEmail(obj.email);
    obj.usuarioApp = obj.usuarioApp==='SI' ? 'SI' : 'NO';
    obj.rolApp = ['CLOSER','TERAPEUTA'].includes(obj.rolApp) ? obj.rolApp : '';
    if(obj.usuarioApp==='SI' && !VAL_EMAIL.test(obj.email)){ toast('Para dar Usuario APP escribe un email válido: será su usuario.','err'); return; }
    let target;
    if(editing){ Object.assign(c, obj); target = c; }
    else { target = Object.assign({id: uid('C')}, obj); DB.closers.push(target); }
    const sr = await authSyncCloserUser(target);
    if(sr.error){
      if(!editing) DB.closers = DB.closers.filter(x=>x!==target); else { target.usuarioApp='NO'; }
      toast(sr.error,'err'); return;
    }
    if(await saveEntity('closers', target)===false) return;
    closeModal(); renderClosers();
    toast(sr.created?'✅ Closer guardado y usuario APP creado ('+(GAS_MODE?'entra con su cuenta de Google':'contraseña inicial: '+AUTH_INIT_PASS)+').':(editing?'✅ Closer actualizado.':'✅ Closer creado.'),'ok');
  });
}

function sesionesDePrograma(pr){ const v = pr && pr.sesiones!==undefined && pr.sesiones!=='' && pr.sesiones!==null ? parseInt(pr.sesiones,10) : NaN; return isNaN(v)||v<0 ? BONOS_MAX : v; }

let dlClient = null;
const IO_XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function ioNeedXLSX(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el lector de Excel. Revisa tu conexión a internet y recarga la página.','err'); return false; }
